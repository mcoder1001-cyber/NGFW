name: Traffic cleanup proof fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/traffic-cleanup-proof-fixtures.yml'
      - '.github/scripts/traffic-cleanup-proof-fixtures.py'
      - '.github/scripts/traffic-transaction-fixtures.py'
      - 'test/topology/traffic-a/**'
      - 'docs/status/tasks/TEST-traffic-A-cleanup-*'
  push:
    paths:
      - '.github/workflows/traffic-cleanup-proof-fixtures.yml'
      - '.github/scripts/traffic-cleanup-proof-fixtures.py'
      - '.github/scripts/traffic-transaction-fixtures.py'
      - 'test/topology/traffic-a/**'
      - 'docs/status/tasks/TEST-traffic-A-cleanup-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-cleanup-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Inactive cleanup proof and original source cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check strict cleanup and source gate policies
        run: |
          python3 .github/scripts/traffic-cleanup-proof-fixtures.py --check-policy
          python3 .github/scripts/traffic-transaction-fixtures.py --check-policy
      - name: Run exactly two disappearance and readiness controls
        run: python3 .github/scripts/traffic-cleanup-proof-fixtures.py --controls
      - name: Run ten owned-group cases with numeric PID signals forbidden
        run: python3 .github/scripts/traffic-cleanup-proof-fixtures.py --repetitions
      - name: Run unchanged original forty-seven source cases
        run: python3 .github/scripts/traffic-transaction-fixtures.py
