// Desired-state model of the memif.* descriptors (task DF-1). Agent-internal, see interface/model.proto.
syntax = "proto3";

package vrx.agent.memif;

option go_package = "ngfw/agent/internal/descriptors/memif;memif";

// Socket is memif_socket_filename_add_del_v2. Ownership: filename lives in the owner's socket dir.
message Socket {
  uint32 id = 1;
  string filename = 2;
}

enum Role {
  ROLE_MASTER = 0;
  ROLE_SLAVE = 1;
}

enum Mode {
  MODE_ETHERNET = 0;
  MODE_IP = 1;
  MODE_PUNT_INJECT = 2;
}

// Memif is memif_create_v2 with VPP's defaults for everything the API cannot read back:
// ring_size / buffer_size (memif_details reports the values negotiated with the peer, 0 before it
// connects — src/plugins/memif/memif_api.c send_memif_details uses mif->run.*), rx/tx queue
// counts, the secret and the hw address (interface.mac-address).
message Memif {
  string name = 1;
  uint32 id = 2;
  uint32 socket = 3;  // socket id; 0 = VPP's default socket (never owned)
  Role role = 4;
  Mode mode = 5;
  reserved 6, 7;  // ring_size, buffer_size: not retrievable (see above)
  bool zero_copy = 8;
}
