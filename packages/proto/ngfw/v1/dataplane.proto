  // Free-text description.
  optional string description = 2;
  // "permit" | "deny".
  optional string action = 3;
  // Source MAC "aa:bb:cc:dd:ee:ff".
  optional string source_mac = 4;
  // Source MAC mask; "ff:ff:ff:ff:ff:ff" = exact.
