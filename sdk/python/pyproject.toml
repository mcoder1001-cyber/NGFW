[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrx"
version = "0.1.0"
description = "Python SDK for the VRX REST API (generated operations + VrxSession)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[tool.setuptools.packages.find]
include = ["vrx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
