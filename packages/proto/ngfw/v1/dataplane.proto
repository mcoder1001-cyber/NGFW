// ----- management (P02a, mirrors packages/schema/src/domains/management.ts) -----

// ManagementConfig mirrors `management` minus the schema's secret-flagged leaves (D-040). Most of
// it is consumed by the API itself (users, TLS); the agent needs only what it renders (syslog
// targets, local accounts' public keys, host firewall).
message ManagementConfig {
  // Local users.
  repeated ManagementUser users = 1;
  // AAA (RADIUS / TACACS+).
  ManagementAaa aaa = 2;
  // TLS settings of the management endpoint.
  ManagementTls tls = 3;
  // Remote syslog targets (rsyslog renderer).
  repeated SyslogTarget syslog = 4;

  // wave-BC: F-dashboard-prom-alarms
  // The agent's external Prometheus listener (the loopback /metrics endpoint is always on).
  ManagementPrometheus prometheus = 5;
  // Threshold alarm rules and their notification targets (evaluated by the API; mirrored here for the drift guard).
  ManagementAlarms alarms = 6;
  // API-owned email/webhook configuration, mirrored for schema drift validation.
  ManagementNotifications notifications = 7;
  // wave-BC: F-backup-restore
}

// ManagementNotifications mirrors management.notifications; the API dispatches deliveries.
message ManagementNotifications {
  repeated NotificationChannel channels = 1;
  repeated NotificationRule rules = 2;
}

// NotificationChannel mirrors a named email or webhook channel; secret values are never carried.
message NotificationChannel {
  optional string name = 1;
  optional bool enabled = 2;
  optional string vrf = 3;
  optional string type = 4;
  NotificationEmail email = 5;
  NotificationWebhook webhook = 6;
}

