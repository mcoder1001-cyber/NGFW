# Generated by ngfw-startupgen from the `dataplane` domain of the NGFW configuration.
# Do not edit by hand: changes need a VPP restart, applied by the manager procedure in
# docs/agent/renderers/vppstartup.md.
# hugepages: 15 GiB of 2 MB pages, reserved by the host (vm.nr_hugepages), not by this file.

unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

api-trace {
  on
}

api-segment {
  gid vpp
}

socksvr {
  default
}

statseg {
  socket-name /run/vpp/stats.sock
}

cpu {
  main-core 16
  corelist-workers 2,4,6,8,10,12,14
}

buffers {
  buffers-per-numa 1048576
}

