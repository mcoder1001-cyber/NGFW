  // Free-text description.
  optional string description = 1;
  // Policers.
  Policer policer = 2;
  // Shaper name.
  optional string shaper = 3;
  // "ext" | "vlan" | "mpls" | "ip".
  optional string record = 4;
  // Store.
  Store store = 5;
  // Mark.
  Mark mark = 6;

  // wave-BC: F-qos-flat
}

