// ----- F-mpls-ldp -----

// MplsLdp mirrors `routing.mpls.ldp`.
message MplsLdp {
  // LDP router-id (IPv4).
  optional string router_id = 1;
  // Address LDP sessions are established over (IPv4).
  optional string transport_address = 2;
  // Interfaces LDP runs on.
  repeated string interfaces = 3;
  // Per-neighbour settings keyed by the peer LSR-ID.
  map<string, LdpNeighbor> neighbors = 4;
  // The dynamic label block.
  LdpLabelRange label_range = 5;
}

// LdpNeighbor mirrors one entry of `routing.mpls.ldp.neighbors`.
message LdpNeighbor {
  // Reference to the MD5 password secret ("password/<name>").
  optional string password_ref = 1;
}

// LdpLabelRange mirrors `routing.mpls.ldp.labelRange`.
message LdpLabelRange {
  optional uint32 min = 1;
  optional uint32 max = 2;
}

// MplsLdpStateRequest asks for the live LDP state.
message MplsLdpStateRequest {
  string owner = 1;
}

// MplsLdpStateResponse is the live LDP state (neighbours, LIB bindings, and the FRR→VPP sync status).
message MplsLdpStateResponse {
  string owner = 1;
  google.protobuf.Timestamp retrieved_at = 2;
  repeated LdpNeighborState neighbors = 3;
  repeated LdpBindingState bindings = 4;
  LdpSyncState sync = 5;
}

// LdpNeighborState is one LDP neighbour.
message LdpNeighborState {
  string lsr_id = 1;
  string address = 2;
  // FRR state name (e.g. OPERATIONAL).
  string state = 3;
  uint32 uptime_sec = 4;
}

// LdpBindingState is one label binding from the LIB.
message LdpBindingState {
  string prefix = 1;
  uint32 local_label = 2;
  string peer = 3;
  uint32 remote_label = 4;
  bool in_use = 5;
}

// LdpSyncState is the FRR→VPP label-sync status (V5).
message LdpSyncState {
  google.protobuf.Timestamp last_sync_at = 1;
  // Routes installed in the MPLS FIB by the sync.
  uint32 installed = 2;
  // Label collisions the sync could not install.
  uint32 conflicts = 3;
  // Last sync error, empty when healthy.
  string last_error = 4;
  // The source in use ("zebra-lfib" | "ldp-bindings").
  string source = 5;
}

