// ----- F-mpls-srmpls -----

// MplsConfig mirrors `routing.mpls` (F-mpls-srmpls). Fields 1–9 are F-mpls-srmpls's; 10 is F-mpls-ldp's.
message MplsConfig {
  // Interfaces with MPLS enabled (sw_interface_set_mpls_enable), configuration keys. Canonical order: sorted.
  repeated string interfaces = 1;
  // Additional MPLS FIBs by decimal table id (mpls_table_add_del); table 0 (the default MPLS table) is never listed.
  map<string, MplsTable> tables = 2;
  // Static label routes (mpls_route_add_del). Canonical order: table, label, end-of-stack first.
  repeated MplsLabelRoute label_routes = 3;
  // Local label ↔ IP prefix bindings (mpls_ip_bind_unbind; write-only in VPP 26.06, never in a Retrieve result).
  repeated MplsIpBinding ip_bindings = 4;
  // MPLS tunnel interfaces by name (mpls_tunnel_add_del); the name is the tunnel interface's logical name.
  map<string, MplsTunnel> tunnels = 5;
  // SR-MPLS (sr_mpls plugin; write-only in VPP 26.06, never in a Retrieve result).
  MplsSr sr = 6;

  // LDP label distribution (`routing.mpls.ldp`, F-mpls-ldp); unset = LDP not configured.
  // wave-BC: F-mpls-ldp
  MplsLdp ldp = 10;
}

// MplsTable mirrors `routing.mpls.tables.<id>`: an additional MPLS FIB (no settings yet).
message MplsTable {}

// MplsLabelRoute mirrors one entry of `routing.mpls.labelRoutes`.
message MplsLabelRoute {
  // MPLS table id; Zod default 0 (the default MPLS table).
  optional uint32 table = 1;
  // Local label 16–1048575.
  optional uint32 label = 2;
  // End of stack; Zod default true.
  optional bool eos = 3;
  // EOS payload: "ip4", "ip6" or "ethernet"; unset = ip6 when a next hop is IPv6, else ip4.
  optional string payload = 4;
  // Paths (load-balanced by weight). Canonical order: next hop, interface, lookup VRF, out labels, weight.
  repeated MplsPath paths = 5;
}

// MplsPath mirrors one path of a label route or MPLS tunnel.
message MplsPath {
  // Next-hop address (canonical text).
  optional string next_hop = 1;
  // Egress interface or MPLS tunnel (configuration key / tunnel name).
  optional string interface = 2;
  // Out-label stack pushed on the path, outermost first (≤ 16 labels); empty = pop.
  repeated uint32 out_labels = 3;
  // Weight 1–255; Zod default 1.
  optional uint32 weight = 4;
  // End-of-stack routes: pop and look the IP payload up in this VRF (no next hop, no interface).
  optional string vrf = 5;
}

// MplsIpBinding mirrors one entry of `routing.mpls.ipBindings`.
message MplsIpBinding {
  // Local label 16–1048575 (installed in MPLS table 0).
  optional uint32 label = 1;
  // VRF of the prefix; Zod default "default".
  optional string vrf = 2;
  // IP prefix (network address, CIDR).
  optional string prefix = 3;
}

// MplsTunnel mirrors `routing.mpls.tunnels.<name>`.
message MplsTunnel {
  // Paths with their out labels. Canonical order as MplsLabelRoute.paths.
  repeated MplsPath paths = 1;
  // Layer-2 only tunnel; Zod default false.
  optional bool l2_only = 2;
}

// MplsSr mirrors `routing.mpls.sr`.
message MplsSr {
  // SR-MPLS policies by decimal binding SID.
  map<string, MplsSrPolicy> policies = 1;
  // Steering of IP prefixes into policies by BSID.
  repeated MplsSrSteering steering = 2;
}

// MplsSrPolicy mirrors `routing.mpls.sr.policies.<bsid>`.
message MplsSrPolicy {
  // Segment lists (at least one).
  repeated MplsSrSegmentList segment_lists = 1;
  // Replicate on every list instead of load-balancing; Zod default false.
  optional bool spray = 2;
}

// MplsSrSegmentList mirrors one segment list of an SR-MPLS policy.
message MplsSrSegmentList {
  // Segment labels, first segment first (1–16 labels, each 16–1048575).
  repeated uint32 labels = 1;
  // Weight 1–255; Zod default 1.
  optional uint32 weight = 2;
}

// MplsSrSteering mirrors one entry of `routing.mpls.sr.steering`.
message MplsSrSteering {
  // VRF of the prefix; Zod default "default".
  optional string vrf = 1;
  // Steered IP prefix (CIDR).
  optional string prefix = 2;
  // Binding SID of the policy.
  optional uint32 bsid = 3;
  // Optional VPN label pushed under the segments.
  optional uint32 vpn_label = 4;
}

// MplsStateRequest selects one view of the live MPLS state.
message MplsStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // "fib" (one page of the MPLS FIB of table_id) or "tunnels" (every MPLS tunnel this owner can name). Anything else →
  // INVALID_ARGUMENT.
  string view = 2;
  // fib: the MPLS table: 0 (the default table, shared) or a table this owner created; another owner's table or a
  // missing one → NOT_FOUND.
  uint32 table_id = 3;
  // fib: only entries of this local label (0 = every label).
  uint32 label = 4;
  // fib: index of the first entry of the page in the sorted, filtered list (0-based).
  uint32 offset = 5;
  // fib: page size; 0 = 100; max 1000.
  uint32 limit = 6;
}

// MplsStateResponse is one view of the live MPLS state.
message MplsStateResponse {
  // The owner whose view was returned.
  string owner = 1;
  // The view that was read ("fib" or "tunnels").
  string view = 2;
  // fib: the MPLS table that was read.
  uint32 table_id = 3;
  // fib: entries that matched the filter (the agent reads the whole table; only the page crosses this boundary).
  uint32 total = 4;
  // fib: the page, sorted by label, then end-of-stack before non-end-of-stack.
  repeated MplsStateFibEntry entries = 5;
  // tunnels: this owner's MPLS tunnels (and untagged ones), sorted by name.
  repeated MplsStateTunnel tunnels = 6;
  // The MPLS tables the owner can read (0 when it exists, plus the owner's own), ascending.
  repeated MplsStateTable tables = 7;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 8;
}

// MplsStateTable is one readable MPLS table.
message MplsStateTable {
  uint32 table_id = 1;
  // VPP's table name ("" for an unnamed table).
  string name = 2;
}

// MplsStateFibEntry is one MPLS FIB entry (live state, not configuration).
message MplsStateFibEntry {
  // Local label (reserved labels 0–15 are VPP's special entries and are listed too).
  uint32 label = 1;
  // End of stack.
  bool eos = 2;
  // EOS payload ("ip4", "ip6", "ethernet", "mpls"; "" for non-EOS entries).
  string payload = 3;
  // The entry's paths.
  repeated MplsStatePath paths = 4;
}

// MplsStatePath is one path of an MPLS FIB entry or tunnel.
message MplsStatePath {
  // "normal", "local", "drop", "icmp-unreach", "icmp-prohibit", … (fib_api_path_type).
  string type = 1;
  // Next-hop protocol ("ip4", "ip6", "mpls", "ethernet").
  string proto = 2;
  // Next-hop address; "" when the path has none.
  string next_hop = 3;
  // Egress interface: its logical name (D-069), else VPP's name; "" when none.
  string interface = 4;
  // Table the next hop or the payload is looked up in.
  uint32 table_id = 5;
  // Pushed out labels, outermost first.
  repeated uint32 out_labels = 6;
  uint32 weight = 7;
  uint32 preference = 8;
}

// MplsStateTunnel is one live MPLS tunnel.
message MplsStateTunnel {
  // The tunnel's logical name (our tag id), else VPP's interface name.
  string name = 1;
  // VPP's interface name (mpls-tunnel<N>).
  string interface = 2;
  uint32 sw_if_index = 3;
  uint32 tunnel_index = 4;
  bool l2_only = 5;
  bool multicast = 6;
  // The tunnel's paths.
  repeated MplsStatePath paths = 7;
  // true when the tunnel carries this owner's tag (created by this agent).
  bool owned = 8;
}

// ----- F-lb -----

// LbService is `services.lb` (VPP lb plugin; WBS D7.9, tier T3). Every lb object is write-only in VPP
// 26.06 (V20, D-063): Retrieve never reports this message; LbState is the read-only live view.
message LbService {
  // VPP-global settings (lb_conf); applied only by the globals owner (D-071).
  LbSettings settings = 1;
  // Virtual IPs keyed by name.
  map<string, LbVip> vips = 2;
  // Interfaces with the lb NAT in2out feature (nat4/nat6 VIPs).
  repeated LbNatInterface nat_interfaces = 3;
}

// LbSettings is `services.lb.settings` (lb_conf).
message LbSettings {
  // Outer source of gre4 packets / SNAT source of nat4 nodeport VIPs; unset = VPP default.
  optional string ip4_source = 1;
  // Outer source of gre6 packets / SNAT source of nat6 nodeport VIPs; unset = VPP default.
  optional string ip6_source = 2;
  // Sticky-table buckets per worker (power of two); unset = keep VPP's value.
  optional uint32 flow_buckets = 3;
  // Flow timeout in seconds; unset = keep VPP's value.
  optional uint32 flow_timeout_sec = 4;
}

// LbVip is `services.lb.vips.<name>`.
message LbVip {
  // VIP prefix (CIDR, host bits zero).
  optional string prefix = 1;
  // "any" | "tcp" | "udp".
  optional string protocol = 2;
  // Destination port (tcp/udp VIPs); unset for protocol any.
  optional uint32 port = 3;
  // "gre4" | "gre6" | "l3dsr" | "nat4" | "nat6".
  optional string encap = 4;
  // DSCP written by an l3dsr VIP.
  optional uint32 dscp = 5;
  // "clusterip" | "nodeport" (nat4/nat6).
  optional string srv_type = 6;
  // Port on the application server (nat4/nat6).
  optional uint32 target_port = 7;
  // Node port of a nodeport VIP (ignored by VPP 26.06).
  optional uint32 node_port = 8;
  // Entries of the new-flows (Maglev) table, a power of two.
  optional uint32 new_flows_table_length = 9;
  // Hash on the source address only.
  optional bool src_ip_sticky = 10;
  // Application servers.
  repeated LbServer servers = 11;
}

// LbServer is one application server of a VIP.
message LbServer {
  // Server address (the encapsulation's family).
  optional string address = 1;
  // Also drop the server's sticky-table entries when it is removed.
  optional bool flush_on_delete = 2;
}

// LbNatInterface is one entry of `services.lb.nat_interfaces`.
message LbNatInterface {
  // Logical interface name.
  optional string interface = 1;
  // "ip4" | "ip6".
  optional string family = 2;
}

// LbStateRequest selects VIPs by configuration name.
message LbStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // VIP names of the agent's stored desired state; empty = every configured VIP.
  repeated string names = 2;
}

// LbStateResponse is one snapshot of the lb plugin for this agent's VIPs.
message LbStateResponse {
  // One entry per configured VIP, sorted by name.
  repeated LbVipState vips = 1;
  // The owner whose view was returned.
  string owner = 2;
  // When the dumps were taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 3;
  // lb_vip_dump entries in the whole VPP (every owner, "removed" ones included).
  uint32 total_vpp_vips = 4;
}

// LbServerState is one application server as lb_as_dump reports it.
message LbServerState {
  // Server address.
  string address = 1;
  // true = in use (LB_AS_FLAGS_USED); false = removed, waiting for the lb garbage collection.
  bool in_use = 2;
  // VPP clock (seconds) at which the server was last used / removed.
  uint32 in_use_since = 3;
}

// LbVipState is the live state of one configured VIP.
message LbVipState {
  // Configuration name (services.lb.vips key).
  string name = 1;
  // Configured prefix.
  string prefix = 2;
  // Configured protocol (VPP 26.06 does not report it: lb_vip_details.protocol is always 0).
  string protocol = 3;
  // Configured port (0 = all ports).
  uint32 port = 4;
  // This agent created the VIP on the running VPP instance (its D-080 boot record exists).
  bool applied = 5;
  // lb_vip_dump entries with this prefix and port: 0 = not in VPP, 1 = the VIP, > 1 = the VIP plus
  // "removed" ones (a VIP change is delete + add) until the lb garbage collection.
  uint32 vpp_entries = 6;
  // Encapsulation VPP reports (from the VIP type): gre4, gre6, l3dsr, nat4, nat6; "" = not in VPP.
  string encap = 7;
  // DSCP of an l3dsr VIP as VPP reports it.
  uint32 dscp = 8;
  // Target port of a nat VIP (VPP 26.06 sends it byte-swapped; the agent swaps it back).
  uint32 target_port = 9;
  // Application servers of every entry with this prefix and port (in use and removed).
  repeated LbServerState servers = 10;
}

// LbFlushVipRequest names one configured VIP.
message LbFlushVipRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // VIP name in the agent's stored desired state (services.lb.vips key).
  string name = 2;
}

// LbFlushVipResponse is the outcome of a flush.
message LbFlushVipResponse {
  // The VIP that was flushed (prefix/protocol/port).
  string vip = 1;
}

// ----- F-qos-flat -----

// QosPolicerStateRequest selects policers of this agent.
message QosPolicerStateRequest {
  // Must be empty or equal to the agent's owner (§6).
  string owner = 1;
  // Policer names without the owner prefix (a `services.qos.policers` key, or "shaper:<name>"); empty = all.
  repeated string names = 2;
}

// QosPolicerCounter is one colour's counter of a policer, summed over VPP's threads.
message QosPolicerCounter {
  // Packets.
  uint64 packets = 1;
  // Bytes.
  uint64 bytes = 2;
}

// QosPolicerStatus is one policer of this owner as VPP reports it (policer_dump_v2 + stats segment).
message QosPolicerStatus {
  // Name without the owner prefix: a `services.qos.policers` key, or "shaper:<name>" for a shaper.
  string name = 1;
  // "policer" | "shaper".
  string kind = 2;
  // VPP pool index (changes when the policer is re-created).
  uint32 index = 3;
  // "1r2c" | "1r3c-rfc2697" | "2r3c-rfc2698" | "2r3c-rfc4115" | "2r3c-mef5cf1" (the configuration spelling).
  string type = 4;
  // "kbps" | "pps".
  string rate_unit = 5;
  // Committed information rate.
  uint32 cir = 6;
  // Excess / peak information rate (0 for single-rate policers).
  uint32 eir = 7;
  // Committed burst (bytes for kbps, packets for pps).
  uint64 cb = 8;
  // Excess burst.
  uint64 eb = 9;
  // Committed token bucket fill (policer_details current_bucket, VPP's internal token units).
  uint32 current_bucket = 10;
  // Committed token bucket limit.
  uint32 current_limit = 11;
  // Extended (excess / peak) token bucket fill.
  uint32 extended_bucket = 12;
  // Extended token bucket limit.
  uint32 extended_limit = 13;
  // Conforming traffic.
  QosPolicerCounter conform = 14;
  // Exceeding traffic.
  QosPolicerCounter exceed = 15;
  // Violating traffic (three-colour policers).
  QosPolicerCounter violate = 16;
}

// QosPolicerStateResponse lists the selected policers, sorted by name.
message QosPolicerStateResponse {
  // Policers.
  repeated QosPolicerStatus policers = 1;
  // The agent's owner.
  string owner = 2;
  // When VPP was read.
  google.protobuf.Timestamp retrieved_at = 3;
  // Non-empty when the stats segment could not be read: the counters are then zero, the rest is valid.
  string counters_error = 4;
}

// QosPolicerResetRequest names the policer whose token buckets are refilled.
message QosPolicerResetRequest {
  // Must be empty or equal to the agent's owner (§6).
  string owner = 1;
  // Policer name without the owner prefix (a `services.qos.policers` key, or "shaper:<name>").
  string name = 2;
}

// QosPolicerResetResponse confirms a reset.
message QosPolicerResetResponse {
  // The agent's owner.
  string owner = 1;
  // The policer.
  string name = 2;
  // VPP pool index of the policer that was reset.
  uint32 index = 3;
  // When the reset was sent.
  google.protobuf.Timestamp reset_at = 4;
}

// ----- F-host-stack -----

// HostStackService is `services.hostStack` (F-host-stack, D-085): the API-configurable part of VPP's host stack.
message HostStackService {
  // Required state of the session layer (rule-table engine); set only by the globals owner (D-071).
  optional bool enabled = 1;
  // Application namespaces by id.
  map<string, HostStackNamespace> namespaces = 2;
  // Session rules (the host-stack "firewall"), each with a unique tag.
  repeated HostStackSessionRule session_rules = 3;
  // TCP source-address pool of one VRF (write-only in VPP, no delete).
  HostStackTcpSource tcp_source_addresses = 4;
  // http_static server (agent opt-in only, cannot be disabled via the API).
  HostStackHttpStatic http_static = 5;
}

// HostStackNamespace is one application namespace.
message HostStackNamespace {
  // Namespace secret as a `key/<name>` reference (D-051); refused until the secret channel exists.
  optional string secret_ref = 1;
  // VPP interface the namespace is bound to.
  optional string interface = 2;
  // VRF (ip4/ip6 fib).
  optional string vrf = 3;
}

// HostStackSessionRule is one session rule.
message HostStackSessionRule {
  // Unique tag (the agent prefixes its owner in VPP).
  optional string tag = 1;
  // "global" | "local".
  optional string scope = 2;
  // "tcp" | "udp".
  optional string transport = 3;
  // Local prefix (canonical CIDR).
  optional string local = 4;
  // Local port; unset = any.
  optional uint32 local_port = 5;
  // Remote prefix (canonical CIDR, same family).
  optional string remote = 6;
  // Remote port; unset = any.
  optional uint32 remote_port = 7;
  // "allow" | "deny" | "redirect".
  optional string action = 8;
  // App index for action redirect.
  optional uint32 redirect_app_index = 9;
  // App namespace id; unset = default namespace.
  optional string app_namespace = 10;
}

// HostStackTcpSource is the TCP source-address pool of one VRF.
message HostStackTcpSource {
  // First address.
  optional string first = 1;
  // Last address.
  optional string last = 2;
  // VRF.
  optional string vrf = 3;
}

// HostStackHttpStatic is the http_static server.
message HostStackHttpStatic {
  // Enabled.
  optional bool enabled = 1;
  // Web root, under /var/lib/ngfw/www/.
  optional string www_root_path = 2;
  // Listen URI, e.g. tcp://0.0.0.0/80.
  optional string uri = 3;
  // Cache size in MiB.
  optional uint32 cache_size_mb = 4;
}

// HostStackStateRequest asks for the host-stack snapshot.
message HostStackStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// HostStackRuleState is one session rule as VPP reports it (this owner's tags only).
message HostStackRuleState {
  // Tag without the owner prefix.
  string tag = 1;
  // "global" | "local" | "both".
  string scope = 2;
  // "tcp" | "udp" | other VPP transport names.
  string transport = 3;
  // Local prefix.
  string local = 4;
  // Local port (0 = any).
  uint32 local_port = 5;
  // Remote prefix.
  string remote = 6;
  // Remote port (0 = any).
  uint32 remote_port = 7;
  // "allow" | "deny" | "redirect".
  string action = 8;
  // VPP app namespace indexes the rule applies to.
  repeated uint32 appns_indexes = 9;
}

// HostStackStateResponse is one host-stack snapshot.
message HostStackStateResponse {
  // Session layer answered the rules dump (VPP has no getter; true when the dump works).
  bool session_enabled = 1;
  // Why session_enabled is false or unknown (e.g. "session layer disabled"), empty otherwise.
  string session_detail = 2;
  // App namespaces this agent applied on the running VPP (write-only in VPP: from the agent's records).
  repeated string namespaces = 3;
  // This owner's session rules.
  repeated HostStackRuleState rules = 4;
  // Number of session rules in VPP (all owners).
  uint32 rule_count_total = 5;
  // Snapshot time.
  google.protobuf.Timestamp retrieved_at = 6;
}

// ----- F-snmp -----

// SnmpView is one VACM view of `services.snmp.views` (F-snmp, D-086).
message SnmpView {
  // Included subtrees (numeric OID or a symbolic name of the renderer's allow-list).
  repeated string include = 1;
  // Excluded subtrees.
  repeated string exclude = 2;
}

// SnmpMonitors is `services.snmp.monitors` (UCD-SNMP dskTable / laTable thresholds).
message SnmpMonitors {
  // Disk monitors.
  repeated SnmpMonitorDisk disks = 1;
  // Load-average monitor.
  SnmpMonitorLoad load = 2;
}

// SnmpMonitorDisk is one `disk <path> <min>%` monitor.
message SnmpMonitorDisk {
  // Absolute mount path.
  optional string path = 1;
  // Minimum free space in percent (1–99); unset = 10.
  optional uint32 min_percent = 2;
}

// SnmpMonitorLoad is the `load <1m> <5m> <15m>` monitor.
message SnmpMonitorLoad {
  // 1-minute load threshold.
  optional uint32 max1 = 1;
  // 5-minute load threshold.
  optional uint32 max5 = 2;
  // 15-minute load threshold.
  optional uint32 max15 = 3;
}

// SnmpSubagent is `services.snmp.subagent`: the NGFW-MIB AgentX subagent of the agent.
message SnmpSubagent {
  // Register NGFW-MIB with snmpd over AgentX (default true when SNMP is enabled).
  optional bool enabled = 1;
}

// SnmpStateRequest selects the agent (owner check as in Retrieve).
message SnmpStateRequest {
  // Expected agent owner; empty = any.
  string owner = 1;
}

// SnmpStateResponse is the snmpd stage state (F-snmp). Credentials are named, never shown.
message SnmpStateResponse {
  // An enabled services.snmp is applied.
  bool configured = 1;
  // The local agent answered the state query.
  bool reachable = 2;
  // Endpoint the query used ("127.0.0.1:161").
  string endpoint = 3;
  // Credential the query used, by name ("v3 user noc", "v2c community").
  string credential = 4;
  // System group values read back from snmpd.
  string sys_name = 5;
  string sys_descr = 6;
  string sys_location = 7;
  string sys_contact = 8;
  // sysUpTime in hundredths of a second.
  uint64 sys_up_time = 9;
  // Query error (redacted), when not reachable.
  string error = 10;
  // Configured engine id (hex; empty = daemon default).
  string engine_id = 11;
  // Daemon action the agent is waiting for ("snmpd needs restart …", D-079); empty = none.
  string pending_action = 12;
  // NGFW-MIB subagent registered with the AgentX master.
  bool subagent_registered = 13;
  // Registrations since the agent started (re-registrations after snmpd restarts included).
  uint64 subagent_registrations = 14;
  // Last subagent session error.
  string subagent_error = 15;
}

// ----- F-ipfix-sflow -----

// IpfixStateRequest asks for the flow-export state.
message IpfixStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// IpfixStateResponse is one snapshot of the flow-export state.
message IpfixStateResponse {
  // Exporters, exporter 0 first, then additional exporters by collector.
  repeated IpfixExporterState exporters = 1;
  // flowprobe.params as VPP has it; unset while no record flag is set.
  IpfixFlowprobeParamsState flowprobe_params = 2;
  // Interfaces of this owner with flowprobe enabled, sorted by interface.
  repeated IpfixFlowprobeInterfaceState flowprobe_interfaces = 3;
  // sFlow global parameters as VPP has them (always reported; VPP defaults when never set).
  IpfixSflowGlobalState sflow_global = 4;
  // Interfaces of this owner with sFlow enabled (learned mapping only, docs/vpp-code-track.md V17).
  repeated IpfixSflowInterfaceState sflow_interfaces = 5;
  // sFlow node counters from the stats segment (/err/sflow/*), summed over workers, sorted by name.
  repeated IpfixCounter sflow_counters = 6;
  // Whether this agent is the VPP-globals owner (D-071): it sets exporter 0, flowprobe.params and
  // sflow.global; otherwise it only requires them.
  bool globals_owner = 7;
  // Human-readable notes (e.g. stats segment unavailable, sFlow export needs hsflowd).
  repeated string notes = 8;
  // The owner whose view was returned.
  string owner = 9;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 10;
}

// IpfixExporterState is one IPFIX exporter as VPP has it.
message IpfixExporterState {
  // Configuration key (services.ipfix.exporters.<name>) when the agent knows it; empty otherwise.
  string name = 1;
  // Exporter 0 (the one flowprobe records use).
  bool default_exporter = 2;
  // Collector address.
  string collector = 3;
  // Collector UDP port.
  uint32 collector_port = 4;
  // Source address.
  string source_address = 5;
  // VRF name (table name of vrf_id; "default" for table 0).
  string vrf = 6;
  // Path MTU.
  uint32 path_mtu = 7;
  // Template interval in seconds.
  uint32 template_interval_sec = 8;
  // UDP checksum.
  bool udp_checksum = 9;
  // Stats index VPP returned when this agent created the exporter (additional exporters only);
  // unset when not known (e.g. after an agent restart).
  optional uint32 stat_index = 10;
}

// IpfixFlowprobeParamsState is flowprobe_get_params.
message IpfixFlowprobeParamsState {
  // Record L2 fields.
  bool record_l2 = 1;
  // Record L3 fields.
  bool record_l3 = 2;
  // Record L4 fields.
  bool record_l4 = 3;
  // Active timer in seconds.
  uint32 active_timer_sec = 4;
  // Passive timer in seconds.
  uint32 passive_timer_sec = 5;
}

// IpfixFlowprobeInterfaceState is flowprobe on one interface.
message IpfixFlowprobeInterfaceState {
  // Logical interface name (D-069).
  string interface = 1;
  // "ip4" | "ip6" | "l2".
  string which = 2;
  // "rx" | "tx" | "both".
  string direction = 3;
}

// IpfixSflowGlobalState is the sFlow plugin's global parameters.
message IpfixSflowGlobalState {
  // Sampling rate 1 in N (0 = off).
  uint32 sampling_n = 1;
  // Counter polling interval in seconds.
  uint32 polling_interval_sec = 2;
  // Sampled header bytes.
  uint32 header_bytes = 3;
  // "rx" | "tx" | "both".
  string direction = 4;
  // Drop monitoring.
  bool drop_monitoring = 5;
}

// IpfixSflowInterfaceState is sFlow sampling on one interface.
message IpfixSflowInterfaceState {
  // Logical interface name (D-069).
  string interface = 1;
  // VPP hw_if_index (sflow_interface_details).
  uint32 hw_if_index = 2;
}

// IpfixCounter is one named counter.
message IpfixCounter {
  // Stats segment name, e.g. "/err/sflow/sflow packets processed".
  string name = 1;
  // Value, summed over workers.
  uint64 value = 2;
}

// ----- F-capture-trace -----

message CaptureListRequest {
  // Expected agent owner; empty = any.
  string owner = 1;
}

// CaptureFile is one pcap file the agent keeps (or the running capture, state "running").
message CaptureFile {
  // Agent-assigned id ("<owner>-<yyyymmddThhmmss>-<n>"), [A-Za-z0-9._-] only.
  string id = 1;
  // "running", "done" (file kept), "empty" (stopped, no packet captured: no file), "interrupted" (agent
  // restart or VPP restart during the capture; the file is kept when VPP wrote one).
  string state = 2;
  // Interface captured on ("any" = every interface).
  string interface = 3;
  // "rx", "tx", "drop" joined by "," as captured.
  string direction = 4;
  // BPF expression ("" = none).
  string bpf = 5;
  google.protobuf.Timestamp started_at = 6;
  // Unset while running.
  google.protobuf.Timestamp stopped_at = 7;
  // File size in bytes (0 while running / empty).
  uint64 size = 8;
  // Packets in the file (counted from the pcap records).
  uint64 packets = 9;
  // Hex sha256 of the file ("" while running / empty).
  string sha256 = 10;
  // Requested limits.
  uint32 max_packets = 11;
  uint32 seconds = 12;
  uint32 snaplen = 13;
  // Why the capture stopped ("timeout", "cancelled", "agent-restart", "vpp-restart").
  string reason = 14;
}

message CaptureListResponse {
  // Newest first; the running capture (if any) first.
  repeated CaptureFile captures = 1;
  // Retention caps the agent applies after every capture (oldest files removed first).
  uint32 max_files = 2;
  uint64 max_bytes = 3;
  // Packet trace (tracedump) is not available: D-128/TD-20 bans trace on the shared VPP and the
  // tracedump binapi is not built (V18). Always false on this build; `trace_reason` says why.
  bool trace_available = 4;
  string trace_reason = 5;
  // Packet-generator streams cannot be defined through the binary API (no stream message); always false.
  bool pg_available = 6;
  string pg_reason = 7;
}

message CaptureReadRequest {
  string owner = 1;
  string id = 2;
}

message CaptureChunk {
  // Next bytes of the file.
  bytes data = 1;
}

message CaptureDeleteRequest {
  string owner = 1;
  string id = 2;
}

message CaptureDeleteResponse {
  // Bytes freed.
  uint64 size = 1;
}

// ----- F-srv6 -----

// Srv6Config mirrors `routing.srv6` (F-srv6): SRv6 network programming with VPP's core `sr`.
message Srv6Config {
  // Outer IPv6 source of encapsulating policies that set none, and VPP's global default
  // (sr_set_encap_source; applied by the globals owner only, D-071; write-only, never retrieved).
  optional string encap_source = 1;
  // Hop limit of the outer IPv6 header, 1–255 (sr_set_encap_hop_limit; VPP-wide, globals owner only,
  // write-only). Unset = VPP's default (64).
  optional uint32 encap_hop_limit = 2;
  // Local SIDs keyed by SID (canonical IPv6 address).
  map<string, Srv6LocalSid> local_sids = 3;
  // SR policies keyed by binding SID (canonical IPv6 address).
  map<string, Srv6Policy> policies = 4;
  // Steering entries: a prefix of a VRF or an L2 interface into a policy's binding SID.
  repeated Srv6Steering steering = 5;
}

// Srv6LocalSid mirrors `routing.srv6.localSids.<sid>` (sr_localsid_add_del).
message Srv6LocalSid {
  // "end" | "end.x" | "end.t" | "end.dx2" | "end.dx4" | "end.dx6" | "end.dt4" | "end.dt6".
  optional string behavior = 1;
  // Penultimate segment pop (end, end.x, end.t). Zod default false.
  optional bool psp = 2;
  // VRF (IPv6 table) the SID is installed in. Zod default "default".
  optional string vrf = 3;
  // Cross-connect interface (end.x, end.dx2, end.dx4, end.dx6).
  optional string interface = 4;
  // Next hop: IPv6 for end.x / end.dx6, IPv4 for end.dx4.
  optional string next_hop = 5;
  // Lookup VRF: IPv6 table for end.t / end.dt6, IPv4 table for end.dt4.
  optional string lookup_vrf = 6;
}

// Srv6Policy mirrors `routing.srv6.policies.<bsid>` (sr_policy_add_v2 / sr_policy_mod_v2 / sr_policy_del).
message Srv6Policy {
  // "default" | "spray" | "tef". Zod default "default".
  optional string type = 1;
  // true = H.Encaps (outer IPv6 header + SRH), false = H.Insert. Zod default true.
  optional bool encap = 2;
  // VRF (IPv6 table) of the binding SID. Zod default "default".
  optional string vrf = 3;
  // Outer source of this encapsulating policy; unset = Srv6Config.encap_source (D-074).
  optional string encap_source = 4;
  // Segment lists (at least one).
  repeated Srv6SidList sid_lists = 5;
}

// Srv6SidList mirrors one entry of `routing.srv6.policies.<bsid>.sidLists`.
message Srv6SidList {
  // Segment IDs in order (1–16 IPv6 addresses).
  repeated string sids = 1;
  // Load-balancing weight 1–65535. Zod default 1.
  optional uint32 weight = 2;
}

// Srv6Steering mirrors one entry of `routing.srv6.steering` (sr_steering_add_del): a discriminated
// union on `type`; the fields of the other variant are unset.
message Srv6Steering {
  // "l3" (prefix + vrf) | "l2" (interface).
  optional string type = 1;
  // l3: IPv4 or IPv6 network prefix.
  optional string prefix = 2;
  // l3: VRF of the prefix. Zod default "default".
  optional string vrf = 3;
  // l2: the interface whose received frames are steered.
  optional string interface = 4;
  // Binding SID of the policy (routing.srv6.policies key).
  optional string bsid = 5;
}

// Srv6StateRequest asks for the live SRv6 state of this owner.
message Srv6StateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// Srv6StateResponse is one snapshot of this owner's SRv6 objects (status, not configuration).
message Srv6StateResponse {
  // Local SIDs, sorted by SID.
  repeated Srv6StateLocalSid local_sids = 1;
  // Policies, sorted by binding SID.
  repeated Srv6StatePolicy policies = 2;
  // Steering entries, sorted: L3 by table and prefix, then L2 by interface.
  repeated Srv6StateSteering steering = 3;
  // The owner whose view was returned.
  string owner = 4;
  // When the dumps were taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 5;
}

// Srv6StateLocalSid is one local SID as VPP has it, with its counters.
message Srv6StateLocalSid {
  // The SID (canonical IPv6 address).
  string sid = 1;
  // Behaviour, as in Srv6LocalSid.behavior ("end", "end.x", …).
  string behavior = 2;
  bool psp = 3;
  // IPv6 table id the SID is installed in.
  uint32 fib_table = 4;
  // Cross-connect interface (logical name; "" when none).
  string interface = 5;
  // Next hop ("" when none).
  string next_hop = 6;
  // Lookup table id (end.t / end.dt4 / end.dt6; 0 otherwise).
  uint32 lookup_table = 7;
  // sr_localsids_with_packet_stats_details: traffic processed by the SID ("good") and dropped ("bad").
  uint64 good_packets = 8;
  uint64 good_bytes = 9;
  uint64 bad_packets = 10;
  uint64 bad_bytes = 11;
}

// Srv6StatePolicy is one SR policy as VPP has it.
message Srv6StatePolicy {
  // Binding SID (canonical IPv6 address).
  string bsid = 1;
  // "default" | "spray" | "tef".
  string type = 2;
  bool encap = 3;
  // IPv6 table id of the binding SID.
  uint32 fib_table = 4;
  // Outer source address (encapsulating policies; "" otherwise).
  string encap_source = 5;
  // Segment lists in VPP's order.
  repeated Srv6StateSidList sid_lists = 6;
}

// Srv6StateSidList is one segment list of a policy.
message Srv6StateSidList {
  repeated string sids = 1;
  uint32 weight = 2;
}

// Srv6StateSteering is one steering entry as VPP has it.
message Srv6StateSteering {
  // "ipv4" | "ipv6" | "l2".
  string traffic_type = 1;
  // L3: the steered prefix and its table id.
  string prefix = 2;
  uint32 fib_table = 3;
  // L2: the interface (logical name).
  string interface = 4;
  // Binding SID of the policy the traffic is steered into.
  string bsid = 5;
}

// ----- F-lisp -----

// LispConfig is `tunnels.lisp` (packages/schema domains/ext/lisp.ts).
message LispConfig {
  // Global LISP switch (VPP-global: set by the globals owner only).
  optional bool enabled = 1;
  // Global LISP-GPE switch (requires enabled).
  optional bool gpe = 2;
  // Local locator sets keyed by name.
  map<string, LispLocatorSet> locator_sets = 3;
  // Local EIDs.
  repeated LispLocalEid local_eids = 4;
  // VNI (decimal string) → VRF (L3) or bridge domain (L2).
  map<string, LispEidTable> eid_tables = 5;
  // Static remote mappings.
  repeated LispRemoteMapping remote_mappings = 6;
  // Adjacencies (remote EID ↔ local EID).
  repeated LispAdjacency adjacencies = 7;
  // Static LISP-GPE forwarding entries (write-only in VPP 26.06, V13).
  repeated LispGpeEntry gpe_entries = 8;
  // Map-resolver addresses.
  repeated string map_resolvers = 9;
  // Map-server addresses (authentication not modelled).
  repeated string map_servers = 10;
  // Proxy-ITR locator set (VPP-global).
  optional string pitr = 11;
}

// LispLocatorSet is `tunnels.lisp.locatorSets.<name>`.
message LispLocatorSet {
  repeated LispLocator locators = 1;
}

// LispLocator is one interface of a local locator set.
message LispLocator {
  optional string interface = 1;
  optional uint32 priority = 2;
  optional uint32 weight = 3;
}

// LispLocalEid is one local EID.
message LispLocalEid {
  optional uint32 vni = 1;
  optional string eid = 2;
  optional string locator_set = 3;
}

// LispEidTable maps one VNI to a VRF (L3) or a bridge domain (L2); exactly one is set.
message LispEidTable {
  optional string vrf = 1;
  optional uint32 bridge_domain = 2;
}

// LispRloc is one remote locator of a mapping.
message LispRloc {
  optional string address = 1;
  optional uint32 priority = 2;
  optional uint32 weight = 3;
}

// LispRemoteMapping is one static remote mapping; action (no-action, natively-forward,
// send-map-request, drop) applies when rlocs is empty.
message LispRemoteMapping {
  optional uint32 vni = 1;
  optional string eid = 2;
  repeated LispRloc rlocs = 3;
  optional string action = 4;
}

// LispAdjacency binds a remote and a local EID.
message LispAdjacency {
  optional uint32 vni = 1;
  optional string reid = 2;
  optional string leid = 3;
}

// LispLocatorPair is one (local, remote) RLOC pair of a GPE forwarding entry.
message LispLocatorPair {
  optional string local = 1;
  optional string remote = 2;
  optional uint32 weight = 3;
}

// LispGpeEntry is one static LISP-GPE forwarding entry.
message LispGpeEntry {
  optional uint32 vni = 1;
  optional string vrf = 2;
  optional string reid = 3;
  optional string leid = 4;
  repeated LispLocatorPair pairs = 5;
  optional string action = 6;
}

// LispStateRequest asks for the live LISP state.
message LispStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// LispStateLocator is one locator of a local locator set as VPP reports it.
message LispStateLocator {
  // Logical interface name ("" when the interface is not nameable by this agent).
  string interface = 1;
  uint32 sw_if_index = 2;
  uint32 priority = 3;
  uint32 weight = 4;
}

// LispStateLocatorSet is one local locator set.
message LispStateLocatorSet {
  string name = 1;
  repeated LispStateLocator locators = 2;
}

// LispStateMapping is one EID-table entry (local EID or map-cache entry).
message LispStateMapping {
  uint32 vni = 1;
  string eid = 2;
  // true: a local EID; false: a remote mapping (static or learned, the map-cache).
  bool local = 3;
  // Locator set of a local EID.
  string locator_set = 4;
  // Remote locators of a remote mapping.
  repeated string rlocs = 5;
  // Negative-mapping action (no-action, natively-forward, send-map-request, drop).
  string action = 6;
  // The mapping came from an authoritative source (map-reply authoritative bit / static).
  bool authoritative = 7;
  // TTL in minutes (learned mappings).
  uint32 ttl = 8;
}

// LispStateAdjacency is one adjacency.
message LispStateAdjacency {
  uint32 vni = 1;
  string reid = 2;
  string leid = 3;
}

// LispStateEidTable is one VNI → table / bridge-domain map.
message LispStateEidTable {
  uint32 vni = 1;
  uint32 dp_table = 2;
  bool is_l2 = 3;
}

// LispStateResponse is one snapshot of the LISP state. LISP objects carry no owner tag; the
// snapshot is VPP-wide (every owner's objects), like `show lisp …`.
message LispStateResponse {
  string owner = 1;
  bool enabled = 2;
  bool gpe_enabled = 3;
  // Proxy-ITR locator set ("" when unset).
  string pitr = 4;
  repeated LispStateLocatorSet locator_sets = 5;
  repeated LispStateMapping mappings = 6;
  repeated LispStateAdjacency adjacencies = 7;
  repeated LispStateEidTable eid_tables = 8;
  repeated string map_resolvers = 9;
  repeated string map_servers = 10;
  // VNIs that have LISP-GPE forwarding entries.
  repeated uint32 gpe_vnis = 11;
  google.protobuf.Timestamp retrieved_at = 12;
}

