name: Packaging fixture gate

on:
  pull_request:
    paths:
      - '.github/workflows/packaging-fixtures.yml'
      - '.github/scripts/packaging-fixtures.py'
      - '.github/scripts/test_packaging_fixture_gate.py'
      - 'deploy/debian/ngfw/**'
      - 'deploy/apt/**'
      - 'deploy/systemd/ngfw-*'
      - 'deploy/vpp/**'
      - 'scripts/publish-apt.sh'
      - 'scripts/10-install-runtime.sh'
      - 'apps/agent/internal/renderers/rsyslog/paths.go'
      - 'apps/agent/internal/actions/capture-trace/capture.go'
  push:
    paths:
      - '.github/workflows/packaging-fixtures.yml'
      - '.github/scripts/packaging-fixtures.py'
      - '.github/scripts/test_packaging_fixture_gate.py'
      - 'deploy/debian/ngfw/**'
      - 'deploy/apt/**'
      - 'deploy/systemd/ngfw-*'
      - 'deploy/vpp/**'
      - 'scripts/publish-apt.sh'
      - 'scripts/10-install-runtime.sh'
      - 'apps/agent/internal/renderers/rsyslog/paths.go'
      - 'apps/agent/internal/actions/capture-trace/capture.go'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Offline packaging and temporary-key signing fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Verify fixture tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in python3 node make bash openssl dpkg-deb gpg gpgv gpgconf gpg-agent flock realpath sync; do
            command -v "$tool" >/dev/null
          done
      - name: Verify strict gate exit policy
        run: python3 -m unittest discover -s .github/scripts -p test_packaging_fixture_gate.py -v
      - name: Run all fixtures without skips
        shell: bash
        env:
          CI: '1'
        run: python3 .github/scripts/packaging-fixtures.py
