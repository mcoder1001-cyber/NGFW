// ObjectsConfig mirrors `objects`; every record is keyed by object name, unique within its kind
// only (vdom.md guardrail #2).
message ObjectsConfig {
  // Address objects.
  map<string, AddressObject> addresses = 1;
  // Address groups.
  map<string, AddressGroup> address_groups = 2;
