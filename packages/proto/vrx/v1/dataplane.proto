// Contract between vrx-api (Node.js) and vrx-agent (Go). Frozen after task P03 is approved;
// changes require a PR labelled `contract`. Field numbers are never reused.
//
// Semantics (idempotency, ownership, confirm-timeout self-revert, stream ordering, what Retrieve
// must return) are specified in docs/contracts/proto.md. This file is the wire contract only.
//
// DesiredState is a 1:1 protobuf projection of the configuration document (`RootConfig` in
// packages/schema): one field per top-level key, field names are the snake_case form of the Zod
// field names, records become `map<string, …>`, arrays `repeated`, Zod enums stay strings (the
// allowed values are listed in the comment), Zod discriminated unions are flattened (discriminator
// plus every variant's fields). The protobuf JSON mapping of a parsed document therefore *is* a
// DesiredState — see the compile-check tests (apps/agent/internal/contracttest, packages/proto/test).
//
// Presence policy (D-039): EVERY scalar field below DesiredState is proto3 `optional` (explicit
// presence), whether or not the Zod field has a default. Only what the document sets is on the
// wire, protojson/ts-proto `toJSON` emit exactly the keys that were set (`id: 0`, `enabled: false`
// included), and `Retrieve` results diff honestly against the running document. `repeated` and
// `map` fields have no presence in proto3: absent and empty are the same thing.
//
// Domain presence (D-041): a domain message that is UNSET in ApplyRequest.desired_state is "not
// managed by this transaction" and is skipped; an explicitly EMPTY domain (`{}`; for the two map
// domains an empty map) means "delete every owned object of that domain". `subsystems` narrows
// further. See ApplyRequest.desired_state and docs/contracts/proto.md §2.
//
// Secrets (D-040, 00-CONTEXT rule 10): schema leaves flagged `secret: true` (password hashes,
// keys, PSKs) have NO field here; only `*_ref` references cross this boundary.
syntax = "proto3";

package vrx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "ngfw/agent/gen/vrx/v1;vrxv1";

// Dataplane is the privileged agent's northbound API, served on a unix socket
// (/run/vrx/agent.sock in production, the slot's VRX_AGENT_SOCKET in tests). One agent process
// serves exactly one owner (VRX_OWNER); see docs/contracts/proto.md "Ownership".
service Dataplane {
  // Apply converges the data plane (VPP + daemons) to the desired state of the selected
  // subsystems inside one transaction: validate → plan → apply → verify; on any error the
  // operations of this transaction are reverted in reverse order (status ROLLED_BACK). Applying the
  // same desired state twice yields an empty plan. With confirm_timeout_sec > 0 the agent
  // self-reverts to the previously confirmed state unless the transaction is confirmed in time.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Retrieve dumps the ACTUAL state of the selected subsystems from VPP and the daemons, filtered
  // to objects owned by this agent, decoded into the same DesiredState messages (canonicalised),
  // so that the caller can diff it against the running configuration. Never touches the data plane.
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
  // DryRun runs validation and planning for a desired state without applying anything and returns
  // the issues found plus the plan the reconciler would execute.
  rpc DryRun(DryRunRequest) returns (ValidationReport);
  // StreamStats pushes interface counters and per-worker CPU load read from the VPP stats segment,
  // one StatsBatch per interval (1 Hz by default), until the client cancels.
  rpc StreamStats(StreamStatsRequest) returns (stream StatsBatch);
  // StreamEvents pushes asynchronous events (link state, reconcile start/done, confirm-timeout
  // reverts, errors) in the order the agent observes them, until the client cancels.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  // Action runs a diagnostic (ping, traceroute, packet capture) and streams its output; the last
  // message is always a `done`. Cancelling the call stops the action.
  rpc Action(ActionRequest) returns (stream ActionOutput);
  // Health reports agent and VPP connectivity. Cheap; polled by the API.
  rpc Health(HealthRequest) returns (HealthResponse);
  // InterfaceState dumps the live, read-only interface table (sw_if_index, type, admin/link state,
  // MTU, addresses, VRF) of every interface this agent can name: its own and untagged ones, never
  // another owner's (docs/contracts/proto.md §5 keeps such status out of Retrieve). Never mutates.
  rpc InterfaceState(InterfaceStateRequest) returns (InterfaceStateResponse);

  // Feature RPCs (wave A/B, docs/status/wave-A-hotspots.md C5): insert below your own anchor, framed by
  // one blank line before and after, so every anchor stays a detached comment and out of the generated
  // code (the same rule for the field/value anchors in the messages below). New messages go in your
  // `// ----- <task-id> -----` section at the end of this file; numbers only from wave-A-hotspots.md §2.
  // wave-BC: F-det44-map-dslite-cnat
  // wave-BC: F-tunnels
  // wave-BC: F-vrrp-config-sync
  // wave-BC: F-pki
  // wave-BC: F-ikev2-native
  // wave-BC: F-ospf
  // wave-BC: F-isis-rip
  // wave-BC: F-mpls-srmpls
  // wave-BC: F-lb
  // wave-BC: F-qos-flat

  // QosPolicerState (F-qos-flat) lists this owner's policers — the `services.qos.policers` and the shapers, which the
  // agent realises as egress policers "shaper:<name>" — as VPP reports them (policer_dump_v2: configuration and token
  // buckets) with their conform / exceed / violate counters from the stats segment (/net/policer/*). Read-only
  // status, never part of Retrieve (§5); one policer walk at a time per agent (D-132).
  rpc QosPolicerState(QosPolicerStateRequest) returns (QosPolicerStateResponse);
  // QosPolicerReset (F-qos-flat) refills the token buckets of one of this owner's policers (policer_reset). VPP
  // keeps the counters (they restart only when the policer is re-created or updated).
  rpc QosPolicerReset(QosPolicerResetRequest) returns (QosPolicerResetResponse);

  // wave-BC: F-host-stack

  // HostStackState reports the host stack as VPP sees it: session layer on/off (read-only probe),
  // this owner's session rules (from session_rules_v2_dump) and the app namespaces it applied. Never mutates.
  rpc HostStackState(HostStackStateRequest) returns (HostStackStateResponse);

  // wave-BC: F-snmp

  // SnmpState reports the snmpd renderer stage (F-snmp): daemon state read over SNMP, the pending
  // daemon action, the VRX-MIB AgentX subagent. No credential value, ever. Never mutates.
  rpc SnmpState(SnmpStateRequest) returns (SnmpStateResponse);

  // wave-BC: F-ipfix-sflow

  // IpfixState reports the live flow-export state (F-ipfix-sflow): IPFIX exporters from Retrieve
  // (exporter 0 read-only when this agent is not the globals owner), flowprobe and sFlow interfaces
  // of this owner, the VPP-global flowprobe/sFlow parameters and the sFlow node counters from the
  // stats segment. Dumps only; never mutates. UNAVAILABLE without VPP.
  rpc IpfixState(IpfixStateRequest) returns (IpfixStateResponse);

  // wave-BC: F-capture-trace
  // wave-BC: F-srv6
  // wave-BC: F-lisp

  // LispState reports the live LISP / LISP-GPE state (switches, locator sets, EID table / map-cache,
  // adjacencies, EID-table maps, resolvers) read from the VPP dumps (F-lisp). Never mutates.
  rpc LispState(LispStateRequest) returns (LispStateResponse);

  // wave-BC: F-bfd-redistribution
  // wave-BC: F-ra-vpn
  // wave-BC: F-mpls-ldp
  // wave-BC: F-igmp-mfib
  // wave-BC: F-dashboard-prom-alarms
  // wave-BC: F-ha-state-sync
  // wave-A: F-bonding

  // BondState dumps the live state of this agent's bond interfaces (sw_bond_interface_dump): mode, load-balance
  // algorithm, member and active-member counts, and per member the weight, link state and, for LACP bonds, the
  // actor/partner LACP state (sw_member_interface_dump, sw_interface_lacp_dump; docs/contracts/proto.md "F-bonding").
  // Read-only; bounded (bonds and their members are few, one message).
  rpc BondState(BondStateRequest) returns (BondStateResponse);

  // wave-A: F-bridge-l2

  // BridgeDomainState dumps the live state of this agent's bridge domains (bd_tag "<owner>:…"): flags,
  // MAC aging, members with their port role and split-horizon group, the BVI and the number of learned
  // and static L2 FIB entries (docs/contracts/proto.md "F-bridge-l2"). Read-only.
  rpc BridgeDomainState(BridgeDomainStateRequest) returns (BridgeDomainStateResponse);
  // BridgeDomainMacs pages through the L2 FIB of one of this agent's bridge domains (l2_fib_table_dump),
  // at most 1000 entries per call, so a message stays bounded however large the table is. Read-only.
  rpc BridgeDomainMacs(BridgeDomainMacsRequest) returns (BridgeDomainMacsResponse);

  // wave-A: F-loopback-bvi-gso-lldp-span

  // LldpNeighbors lists the interfaces with LLDP enabled that this agent can name (its own and untagged ones,
  // never another owner's) with what was heard on each (lldp_dump: chassis id, port id, TTL, last heard/sent),
  // ordered by interface name, at most 1000 per call (docs/contracts/proto.md "F-loopback-bvi-gso-lldp-span").
  // Read-only.
  rpc LldpNeighbors(LldpNeighborsRequest) returns (LldpNeighborsResponse);

  // wave-A: F-vrf-static-ecmp

  // ListRoutes pages the live FIB of one VRF (ip_route_v2_dump read once, filtered and paged in the agent; only the
  // page crosses this boundary). Read-only state (docs/contracts/proto.md §11 F-vrf-static-ecmp: ListRoutes).
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);

  // wave-A: F-neighbors-ra

  // ListNeighbors (F-neighbors-ra) dumps the live ARP/ND table (ip_neighbor_dump per interface and address family)
  // of every interface this agent can name — its own and untagged ones, never another owner's — filtered and paged
  // by the agent. Read-only; learned (dynamic) and static entries alike.
  rpc ListNeighbors(ListNeighborsRequest) returns (ListNeighborsResponse);

  // wave-A: F-rpf-adl-pbr
  // wave-A: F-object-model

  // FqdnObjectState reports the agent's resolver state of every FQDN address object
  // (objects.addresses.<name> with type "fqdn"): the addresses in use (last-good answers survive a
  // failed refresh), when they were last resolved, the next scheduled refresh and the latest error.
  // Read-only runtime state (docs/contracts/proto.md §5 keeps it out of Retrieve). Never mutates.
  rpc FqdnObjectState(FqdnObjectStateRequest) returns (FqdnObjectStateResponse);

  // wave-A: F-acl

  // AclState reports the runtime state of this owner's L3/L4 ACLs (acl.lists): per list the VPP
  // acl_index, VPP rule count and summed hit counters; for one list a page (≤ 1000) of its
  // configuration rules by sequence with the number of VPP rules each expanded to and their hit
  // counters, mapped back through the agent's expansion; on request the ACLs bound to every
  // interface in VPP order, other owners' included (D-066), and the MACIP ACL per interface.
  // Read-only runtime state (docs/contracts/proto.md §5 keeps it out of Retrieve); counters come
  // from the stats segment, never a whole list in one message. Never mutates.
  rpc AclState(AclStateRequest) returns (AclStateResponse);

  // wave-A: F-host-acl-nftables

  // HostAclState reports the host firewall the agent rendered from `acl.host*` (the nftables table
  // `inet vrx`): its sets, chains and rules with per-rule packet/byte counters read from
  // `nft -j list table`, and whether the kernel table still matches the applied rendering.
  // Read-only runtime state (docs/contracts/proto.md §5 keeps counters out of Retrieve). Never mutates.
  rpc HostAclState(HostAclStateRequest) returns (HostAclStateResponse);

  // wave-A: F-nat44-ed-sessions

  // NatSessions pages the live NAT44-ED session table of this owner (read-only, never mutates). VPP
  // dumps sessions per user (inside host), so the agent pages over the users first and dumps only
  // the users that cover the requested page: one response carries at most `limit` (≤ 1000)
  // sessions, never the whole table (docs/contracts/proto.md §11).
  rpc NatSessions(NatSessionsRequest) returns (NatSessionsResponse);
  // NatSummary reports this owner's NAT44-ED totals and per-pool usage (read-only; served from a
  // cache of up to 30 s, see retrieved_at).
  rpc NatSummary(NatSummaryRequest) returns (NatSummaryResponse);

  // wave-A: F-nat44-ei-64-66-nptv6
  // wave-A: P11
  // wave-A: F-wireguard
  // wave-A: P12
  // wave-A: F-kea-dhcp-relay
  // wave-A: F-unbound-chrony-syslog
}

// ---------------------------------------------------------------------------------------------
// Transactions: Apply / DryRun / Retrieve
// ---------------------------------------------------------------------------------------------

// ApplyRequest carries one transaction. Exactly one of these forms is valid:
//   - apply:            txn_id + desired_state (+ subsystems, confirm_timeout_sec)
//   - confirm:          confirm_txn_id only (no desired_state) — cancels the self-revert timer
//   - confirm-and-apply: both — the pending transaction is confirmed, then the new one applied
message ApplyRequest {
  // Caller-generated unique id of this transaction (UUID recommended). It is the idempotency key:
  // a repeated txn_id with an identical desired_state returns the stored ApplyResponse without
  // re-applying; a repeated txn_id with a different desired_state fails with ABORTED. Required for
  // an apply, ignored for a pure confirm.
  string txn_id = 1;
  // The desired configuration. Domain presence follows D-041: a domain that is UNSET (message not
  // present; for `interfaces`/`vrfs`: the map is empty AND the key is not named in `subsystems`)
  // is not managed by this transaction and is skipped; a domain that is present — even as an empty
  // message `{}` — is authoritative: every owned object of that domain that is absent from it is
  // deleted. `subsystems` narrows the set of domains considered further; naming a domain there
  // makes it authoritative even when it is unset/empty (that is how a caller deletes everything in
  // `interfaces` or `vrfs`). The API normally sends the whole parsed document with all 13 domains
  // present; a partial document can therefore never wipe domains it does not mention.
  DesiredState desired_state = 2;
  // Top-level keys of the configuration document to apply (`ROOT_KEYS` in packages/schema:
  // "system", "dataplane", "interfaces", "vrfs", "routing", "nat", "objects", "acl", "vpn",
  // "tunnels", "services", "ha", "management"). Empty = every domain that is present in
  // desired_state (D-041). A key listed here is authoritative even if its domain is unset or
  // empty. Unknown keys fail with
  // INVALID_ARGUMENT; keys without an implementation in this agent fail with UNIMPLEMENTED
  // (HealthResponse.subsystems lists the implemented ones).
  repeated string subsystems = 3;
  // Seconds after which the agent re-applies the previously confirmed desired state on its own
  // unless this transaction is confirmed (see confirm_txn_id). 0 = no timer, the transaction is
  // confirmed immediately. The agent must not depend on the API being alive for the revert.
  uint32 confirm_timeout_sec = 4;
  // txn_id of a pending (unconfirmed) transaction to confirm. Confirming a transaction that is not
  // pending fails with FAILED_PRECONDITION (it was never applied, was already confirmed, or the
  // timer already reverted it — StreamEvents reports the revert as CONFIRM_REVERTED).
  string confirm_txn_id = 5;
  // Owner tag the caller expects this agent to stamp on every object it creates (D-030:
  // interface tag `<owner>:<id>`; owner-prefixed names or the owner table for objects without
  // tags). An agent serves exactly one owner (VRX_OWNER, tests: their VRX_TEST_PREFIX); a
  // non-empty value that differs from the agent's owner fails with INVALID_ARGUMENT. Empty = the
  // agent's owner. The field exists so that a request aimed at the wrong agent on the shared host
  // is rejected instead of silently applied.
  string owner = 6;
}

// ApplyStatus is the outcome of one transaction.
enum ApplyStatus {
  APPLY_STATUS_UNSPECIFIED = 0;
  // Every planned operation succeeded and the re-Retrieve verified the result. With a confirm
  // timer the state is applied but not yet confirmed (see ApplyResponse.confirm_deadline).
  APPLY_STATUS_APPLIED = 1;
  // Validation or planning failed before anything was applied; nothing changed. `results` and
  // `validation` explain why.
  APPLY_STATUS_FAILED = 2;
  // An operation failed and every operation already applied in this transaction was reverted
  // successfully; the data plane is back at the previous state.
  APPLY_STATUS_ROLLED_BACK = 3;
  // An operation failed AND the rollback failed too: the data plane is in an intermediate state.
  // The agent marks itself degraded (HealthResponse.degraded) and emits Event DEGRADED
  // (docs/01-architecture.md AD-4).
  APPLY_STATUS_DEGRADED = 4;
  // A pure confirm (confirm_txn_id without desired_state) succeeded: the timer was cancelled.
  APPLY_STATUS_CONFIRMED = 5;
}

// ApplyResponse reports the outcome of Apply. Application-level outcomes (FAILED, ROLLED_BACK,
// DEGRADED) are returned with gRPC status OK; gRPC errors are reserved for malformed requests
// (INVALID_ARGUMENT), preconditions (FAILED_PRECONDITION, ABORTED) and infrastructure
// (UNAVAILABLE when VPP is disconnected).
message ApplyResponse {
  // Echo of ApplyRequest.txn_id (or of confirm_txn_id for a pure confirm).
  string txn_id = 1;
  // Overall outcome.
  ApplyStatus status = 2;
  // One entry per object the plan touched or failed on (created, updated, deleted, failed,
  // reverted). Unchanged objects are not listed; an idempotent re-apply has no results.
  repeated ObjectResult results = 3;
  // Counts over the plan, also emitted with Event RECONCILE_DONE.
  ApplySummary summary = 4;
  // Validation issues when status is FAILED because of validation (empty otherwise).
  ValidationReport validation = 5;
  // When the transaction finished applying (agent clock).
  google.protobuf.Timestamp applied_at = 6;
  // Set when confirm_timeout_sec > 0: the instant at which the agent reverts unless confirmed.
  google.protobuf.Timestamp confirm_deadline = 7;
  // Free-text explanation for FAILED/DEGRADED outcomes that are not attributable to one object.
  string message = 8;
}

// ApplyOperation is what the reconciler did (or planned) for one object.
enum ApplyOperation {
  APPLY_OPERATION_UNSPECIFIED = 0;
  APPLY_OPERATION_CREATE = 1;
  APPLY_OPERATION_UPDATE = 2;
  APPLY_OPERATION_DELETE = 3;
  // Update that required delete + create (the descriptor returned ErrRecreate); dependents are
  // recreated too.
  APPLY_OPERATION_RECREATE = 4;
  // Desired equals actual. Not listed in v1 plans or results (ApplySummary.unchanged counts these
  // objects); reserved for a verbose plan option.
  APPLY_OPERATION_NOOP = 5;
}

// ObjectResultCode classifies the result of one operation.
enum ObjectResultCode {
  OBJECT_RESULT_CODE_UNSPECIFIED = 0;
  // The operation was applied and verified.
  OBJECT_RESULT_CODE_OK = 1;
  // The operation itself failed (VPP API or daemon error in `message`).
  OBJECT_RESULT_CODE_FAILED = 2;
  // Not attempted because an earlier operation failed (the transaction was already rolling back).
  OBJECT_RESULT_CODE_SKIPPED = 3;
  // The operation had succeeded and was undone by the rollback of this transaction.
  OBJECT_RESULT_CODE_REVERTED = 4;
  // The operation had succeeded and its rollback failed (status DEGRADED).
  OBJECT_RESULT_CODE_REVERT_FAILED = 5;
  // A mandatory dependency (scheduler.Dependency) is neither desired nor present.
  OBJECT_RESULT_CODE_DEPENDENCY_MISSING = 6;
  // The object is invalid for this agent/VPP (semantic check inside the descriptor).
  OBJECT_RESULT_CODE_INVALID = 7;
}

// ObjectResult is the per-object outcome of Apply (and the shape of DryRun plan entries).
message ObjectResult {
  // Scheduler key "<descriptor>/<id>", e.g. "interface/TenGigabitEthernet0/0/0",
  // "ip.route/customer-a/0.0.0.0/0".
  string key = 1;
  // Operation performed (or planned).
  ApplyOperation op = 2;
  // Outcome.
  ObjectResultCode code = 3;
  // Human-readable detail (VPP retval text, daemon output). Never contains secrets.
  string message = 4;
  // RFC 6901 JSON pointer into the configuration document identifying the offending object
  // (VPP interface names contain "/" — escaped as "~1"), e.g.
  // "/interfaces/TenGigabitEthernet0~10~10/ipv4/0". Empty when the object has no document path
  // (agent-derived objects).
  string pointer = 5;
  // Top-level key of the configuration document the object belongs to.
  string subsystem = 6;
}

// ApplySummary counts the operations of one transaction.
message ApplySummary {
  // Objects created.
  uint32 created = 1;
  // Objects updated in place (including recreates).
  uint32 updated = 2;
  // Objects deleted.
  uint32 deleted = 3;
  // Objects already converged (no operation).
  uint32 unchanged = 4;
  // Operations that failed.
  uint32 failed = 5;
  // Operations reverted by the rollback.
  uint32 reverted = 6;
}

// DryRunRequest asks for validation + plan without applying. It deliberately has no confirm
// fields: a dry run is never a transaction.
message DryRunRequest {
  // Optional correlation id copied into logs and the report; not an idempotency key.
  string txn_id = 1;
  // The complete desired configuration; same rules as ApplyRequest.desired_state.
  DesiredState desired_state = 2;
  // Subsystems to plan for; same rules as ApplyRequest.subsystems.
  repeated string subsystems = 3;
  // Same rules as ApplyRequest.owner.
  string owner = 4;
}

// IssueSeverity of a validation issue.
enum IssueSeverity {
  ISSUE_SEVERITY_UNSPECIFIED = 0;
  // Would be rejected by Apply.
  ISSUE_SEVERITY_ERROR = 1;
  // Applied, but probably not what the operator wants (e.g. interface without addresses in a VRF).
  ISSUE_SEVERITY_WARNING = 2;
  // Informational (e.g. object will be recreated, traffic interruption expected).
  ISSUE_SEVERITY_INFO = 3;
}

// ValidationIssue is one finding of DryRun (or of Apply's validation phase).
message ValidationIssue {
  // RFC 6901 pointer to the offending value in the configuration document; "" = whole document.
  string pointer = 1;
  // Human-readable explanation; the API maps it to an RFC 9457 problem detail.
  string message = 2;
  // Severity; Apply refuses when any issue has ISSUE_SEVERITY_ERROR.
  IssueSeverity severity = 3;
  // Machine-readable rule id, e.g. "interfaces.vrf-exists", "routing.static.next-hop-interface".
  string rule = 4;
}

// ValidationReport is the result of DryRun and the detail of a validation-FAILED Apply.
message ValidationReport {
  // Echo of the request's txn_id.
  string txn_id = 1;
  // True when no issue has ISSUE_SEVERITY_ERROR (Apply would proceed).
  bool ok = 2;
  // All findings, ERROR first, then by pointer.
  repeated ValidationIssue errors = 3;
  // The operations the reconciler would execute, in execution order (creates/updates in
  // topological order, then deletes in reverse). `code` is unset in a plan; converged objects are
  // not listed (summary.unchanged counts them). Empty when ok is false or nothing would change.
  repeated ObjectResult plan = 4;
  // Counts over `plan`.
  ApplySummary summary = 5;
}

// RetrieveRequest selects what to dump.
message RetrieveRequest {
  // Subsystems to dump; same rules as ApplyRequest.subsystems. With an empty list, subsystems this
  // agent does not implement are simply omitted (see RetrieveResponse.subsystems).
  repeated string subsystems = 1;
  // Same rules as ApplyRequest.owner.
  string owner = 2;
}

// RetrieveResponse is the actual state, shaped exactly like the desired state so that the API can
// diff running-vs-actual with the schema package's `diff()`.
message RetrieveResponse {
  // Actual state of the dumped subsystems: only objects owned by this agent, decoded into the
  // desired-state messages and canonicalised (addresses via net/netip, repeated fields sorted,
  // MACs lower-case). Read-only status (link state, counters) and secrets are never included;
  // write-only fields (password hashes, secret references' values) are left unset.
  DesiredState desired_state = 1;
  // Subsystems actually dumped (implemented by this agent and requested).
  repeated string subsystems = 2;
  // The owner whose objects were returned.
  string owner = 3;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 4;
}

// ---------------------------------------------------------------------------------------------
// Telemetry: StreamStats / StreamEvents
// ---------------------------------------------------------------------------------------------

// StreamStatsRequest subscribes to periodic counter batches.
message StreamStatsRequest {
  // Batch interval in milliseconds; 0 = 1000 (1 Hz). Values below 200 or above 60000 fail with
  // INVALID_ARGUMENT.
  uint32 interval_ms = 1;
  // VPP interface names to include; empty = all interfaces known to VPP (designed for ≤ 1000).
  repeated string interfaces = 2;
  // Include per-worker CPU load (StatsBatch.worker_cpu). Off by default: cheaper.
  bool include_worker_cpu = 3;

  // wave-BC: F-dashboard-prom-alarms
}

// StatsBatch is one sample of every requested counter, taken at the same instant from the VPP
// stats segment. Counters are absolute (monotonic since VPP start or the last clear); the
// consumer derives rates from consecutive batches. Batches on one stream have strictly increasing
// `seq` and `ts`; a gap in `seq` means the agent dropped batches for a slow consumer.
message StatsBatch {
  // Sample time (agent clock).
  google.protobuf.Timestamp ts = 1;
  // Per-stream sequence number starting at 1.
  uint64 seq = 2;
  // One entry per requested interface, sorted by name. Interfaces that disappeared are omitted.
  repeated InterfaceCounters interface_counters = 3;
  // Per-worker load; empty unless StreamStatsRequest.include_worker_cpu.
  repeated WorkerCpu worker_cpu = 4;
  // Effective interval in milliseconds (echo of the request, after defaulting).
  uint32 interval_ms = 5;

  // wave-BC: F-dashboard-prom-alarms
}

// InterfaceCounters are the simple counters of one interface (/if/rx, /if/tx, /if/drops, …).
message InterfaceCounters {
  // VPP interface name, e.g. "TenGigabitEthernet0/0/0".
  string name = 1;
  // VPP sw_if_index at sample time (runtime handle, may change after VPP restart).
  uint32 sw_if_index = 2;
  // Packets received.
  uint64 rx_packets = 3;
  // Bytes received.
  uint64 rx_bytes = 4;
  // Packets transmitted.
  uint64 tx_packets = 5;
  // Bytes transmitted.
  uint64 tx_bytes = 6;
  // Packets dropped (/if/drops).
  uint64 drops = 7;
  // Receive errors + transmit errors (/if/rx-error + /if/tx-error).
  uint64 errors = 8;
  // Packets punted to the host (/if/punt).
  uint64 punts = 9;
  // Packets the interface could not receive: no RX buffer available (/if/rx-no-buf) plus RX
  // misses reported by the driver (/if/rx-miss), summed.
  uint64 rx_misses = 10;
}

// WorkerCpu is the load of one VPP thread derived from /sys/node/* between two samples.
message WorkerCpu {
  // VPP thread index (0 = main thread).
  uint32 worker = 1;
  // Thread name as VPP reports it ("vpp_main", "vpp_wk_0", …).
  string name = 2;
  // Fraction of the interval spent in graph nodes, 0–100. Polling workers show near 100 even when
  // idle; use vectors_per_call to judge real load.
  double utilization_pct = 3;
  // Average vectors (packets) per graph-node call in the interval; VPP's primary load indicator.
  double vectors_per_call = 4;
  // Graph-node calls in the interval.
  uint64 calls = 5;
  // Vectors processed in the interval.
  uint64 vectors = 6;
}

// StreamEventsRequest subscribes to events. The stream starts with events observed after the
// subscription; there is no replay (Health gives a snapshot).
message StreamEventsRequest {
  // Kinds to receive; empty = all.
  repeated EventKind kinds = 1;
  // For interface-scoped kinds (LINK_UP/LINK_DOWN): VPP interface names to receive; empty = all.
  repeated string interfaces = 2;
}

// EventKind classifies an Event.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // Interface link (or admin, see attributes) state went up; `interface` is set.
  EVENT_KIND_LINK_UP = 1;
  // Interface link state went down; `interface` is set.
  EVENT_KIND_LINK_DOWN = 2;
  // A reconcile transaction started (Apply, resync on start/VPP reconnect, confirm revert);
  // `txn_id` is set for Apply-triggered ones.
  EVENT_KIND_RECONCILE_START = 3;
  // The transaction finished; `summary` carries the counts, `message` the ApplyStatus name.
  EVENT_KIND_RECONCILE_DONE = 4;
  // An asynchronous error (VPP API failure outside a transaction, daemon crash, dropped events —
  // `message` says "dropped N events").
  EVENT_KIND_ERROR = 5;
  // A confirm timer expired and the agent re-applied the previously confirmed state; `txn_id` is
  // the reverted transaction.
  EVENT_KIND_CONFIRM_REVERTED = 6;
  // The VPP binary API connection was (re-)established; a resync follows.
  EVENT_KIND_VPP_CONNECTED = 7;
  // The VPP binary API connection was lost.
  EVENT_KIND_VPP_DISCONNECTED = 8;
  // A rollback failed; the agent is degraded until an Apply succeeds (AD-4).
  EVENT_KIND_DEGRADED = 9;

  // wave-BC: F-vrrp-config-sync
  // wave-BC: F-ospf
  // wave-BC: F-isis-rip
  // wave-BC: F-bfd-redistribution
  // wave-BC: F-ra-vpn
  // wave-BC: F-mpls-ldp
  // wave-BC: F-igmp-mfib
  // wave-A: F-neighbors-ra

  // The ARP/ND table of an interface changed (F-neighbors-ra): learned, updated or removed entries, coalesced to at
  // most one event per interface per second (`interface` set; attributes "added", "removed", "updated" — counts), or
  // one event with `interface` unset (plus attribute "interfaces") when more than 16 interfaces changed in that second.
  EVENT_KIND_NEIGHBOR_CHANGED = 10;

  // wave-A: F-object-model
  // wave-A: P11
  // wave-A: F-wireguard
  // wave-A: P12
}

// Event is one asynchronous notification. Events on one stream are delivered in observation
// order with strictly increasing `seq`.
message Event {
  // Observation time (agent clock).
  google.protobuf.Timestamp ts = 1;
  // Per-stream sequence number starting at 1.
  uint64 seq = 2;
  // What happened.
  EventKind kind = 3;
  // VPP interface name for interface-scoped kinds (LINK_UP/LINK_DOWN); unset otherwise.
  optional string interface = 4;
  // Human-readable detail. Never contains secrets.
  string message = 5;
  // Transaction id for reconcile/confirm kinds; empty for resync-triggered reconciles.
  string txn_id = 6;
  // Counts for RECONCILE_DONE; unset otherwise.
  ApplySummary summary = 7;
  // Additional structured detail, small and flat (e.g. "sw_if_index": "3", "admin": "up").
  map<string, string> attributes = 8;
}

// ---------------------------------------------------------------------------------------------
// Actions: ping / traceroute / capture
// ---------------------------------------------------------------------------------------------

// ActionRequest starts one diagnostic action. Everything in it is validated by the agent (no user
// input reaches a shell: actions run through the VPP API or fixed-argv allow-listed binaries).
message ActionRequest {
  // The action to run.
  oneof action {
    // ICMP echo from the data plane.
    PingAction ping = 1;
    // Traceroute from the data plane.
    TracerouteAction traceroute = 2;
    // Packet capture on one interface (pcap output).
    CaptureAction capture = 3;

    // wave-BC: F-det44-map-dslite-cnat
    // wave-BC: F-ikev2-native
    // wave-BC: F-ra-vpn
    // wave-BC: F-ha-state-sync
    // wave-BC: F-backup-restore
    // wave-A: F-neighbors-ra

    // Flush learned ARP/ND entries (F-neighbors-ra); static neighbours stay.
    ArpFlushAction arp_flush = 4;

    // wave-A: F-nat44-ed-sessions

    // Delete one NAT44-ED session (F-nat44-ed-sessions); one `done` line, exit_code 1 when VPP has no
    // such session.
    NatSessionKillAction nat_session_kill = 5;

    // wave-A: F-unbound-chrony-syslog
  }
}

// PingAction sends ICMP echo requests from the data plane.
message PingAction {
  // IPv4 or IPv6 address (no hostname resolution in the agent).
  string target = 1;
  // VRF name to send from; "" = "default".
  string vrf = 2;
  // Number of echo requests; 0 = 5; max 100.
  uint32 count = 3;
  // Payload size in bytes; 0 = 56; max 9000.
  uint32 size = 4;
  // Interval between requests in milliseconds; 0 = 1000; min 100.
  uint32 interval_ms = 5;
  // Per-request timeout in milliseconds; 0 = 1000.
  uint32 timeout_ms = 6;
  // Source address; "" = chosen by the FIB.
  string source = 7;
}

// TracerouteAction discovers the path to a target.
message TracerouteAction {
  // IPv4 or IPv6 address.
  string target = 1;
  // VRF name; "" = "default".
  string vrf = 2;
  // Maximum hops; 0 = 30; max 64.
  uint32 max_hops = 3;
  // Probes per hop; 0 = 3; max 10.
  uint32 probes = 4;
  // Per-probe timeout in milliseconds; 0 = 1000.
  uint32 timeout_ms = 5;
  // Source address; "" = chosen by the FIB.
  string source = 6;
}

// CaptureDirection selects which packets a capture sees.
enum CaptureDirection {
  CAPTURE_DIRECTION_UNSPECIFIED = 0;
  CAPTURE_DIRECTION_RX = 1;
  CAPTURE_DIRECTION_TX = 2;
  CAPTURE_DIRECTION_BOTH = 3;
}

// CaptureAction captures packets on one interface and streams them as pcap chunks.
message CaptureAction {
  // VPP interface name to capture on.
  string interface = 1;
  // Classifier filter in VPP `pcap trace` / BPF-like syntax as the agent documents it; "" = all.
  // Validated as a token list, never passed to a shell.
  string bpf = 2;
  // Stop after this many packets; 0 = 1000; max 100000.
  uint32 max_packets = 3;
  // Stop after this many seconds; 0 = 30; max 600.
  uint32 seconds = 4;
  // Direction; UNSPECIFIED = BOTH.
  CaptureDirection direction = 5;
  // Bytes captured per packet; 0 = 65535.
  uint32 snaplen = 6;

  // wave-BC: F-capture-trace
}

// ActionOutput is one streamed chunk of an action. The stream ends with exactly one `done`.
message ActionOutput {
  // The chunk.
  oneof output {
    // One line of human-readable output (ping reply, traceroute hop).
    string line = 1;
    // Next bytes of the pcap file (the first chunk starts with the pcap global header).
    bytes pcap_chunk = 2;
    // Terminal message with the summary.
    ActionDone done = 3;

    // wave-BC: F-backup-restore
  }
}

// ActionDone closes an action stream.
message ActionDone {
  // Human-readable summary ("5 packets transmitted, 5 received, 0% loss", "1000 packets, 1.2 MB").
  string summary = 1;
  // 0 on success; non-zero when the action failed or was cut short (detail in `summary`).
  int32 exit_code = 2;
  // Structured statistics, small and flat (e.g. "transmitted": "5", "received": "5",
  // "rtt_avg_ms": "0.42", "packets": "1000", "bytes": "1234567").
  map<string, string> stats = 3;
}

// ---------------------------------------------------------------------------------------------
// Health
// ---------------------------------------------------------------------------------------------

// HealthRequest has no parameters.
message HealthRequest {}

// HealthResponse is the agent's cheap status snapshot (docs/contracts/proto.md §8).
message HealthResponse {
  // Agent build version.
  string agent_version = 1;
  // True when the VPP binary API is connected.
  bool vpp_connected = 2;
  // VPP version string as reported by show_version, empty when disconnected.
  string vpp_version = 3;
  // Owner this agent serves (VRX_OWNER).
  string owner = 4;
  // Top-level configuration keys this agent implements (Apply/Retrieve accept them).
  repeated string subsystems = 5;
  // txn_id of the last successfully applied transaction (from the persisted desired state).
  string last_txn_id = 6;
  // txn_id awaiting confirmation, empty when none.
  string pending_confirm_txn_id = 7;
  // Deadline of the pending confirmation; unset when none.
  google.protobuf.Timestamp confirm_deadline = 8;
  // True after a failed rollback until a transaction succeeds (AD-4).
  bool degraded = 9;
  // When the last reconcile (Apply or resync) finished; unset before the first one.
  google.protobuf.Timestamp last_reconcile_at = 10;
  // True while a reconcile is running.
  bool reconcile_in_progress = 11;
}

// ---------------------------------------------------------------------------------------------
// InterfaceState (P08)
// ---------------------------------------------------------------------------------------------

// InterfaceStateRequest selects interfaces by logical name.
message InterfaceStateRequest {
  // Logical names to include (configuration keys; sub-interfaces "<parent>.<sub id>"); empty = all.
  repeated string names = 1;
  // Same rules as ApplyRequest.owner.
  string owner = 2;
}

// InterfaceStateResponse is one snapshot of the interface table.
message InterfaceStateResponse {
  // One entry per interface, sorted by name.
  repeated InterfaceState interfaces = 1;
  // The owner whose view was returned.
  string owner = 2;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 3;
}

// InterfaceState is the live state of one interface as VPP reports it (not configuration).
message InterfaceState {
  // Logical name (D-069): the configuration key; the tag id of interfaces this agent created,
  // VPP's name for untagged ones.
  string name = 1;
  // VPP's interface name (differs from `name` for some created interfaces, e.g. tap240).
  string vpp_name = 2;
  // VPP sw_if_index (runtime handle, changes when the interface is re-created).
  uint32 sw_if_index = 3;
  // Kind: "loopback", "af-packet", "sub-interface", "tap", "bond", "memif", "dpdk" or VPP's device
  // class name for anything else.
  string type = 4;
  // Administrative state (sw_interface_details flags ADMIN_UP).
  bool admin_up = 5;
  // Link (carrier) state (flags LINK_UP).
  bool link_up = 6;
  // L3 MTU in effect (software MTU; the link MTU when VPP reports 0).
  uint32 mtu = 7;
  // Hardware (link) MTU.
  uint32 link_mtu = 8;
  // L2 address, lower-case "aa:bb:cc:dd:ee:ff"; empty for interfaces without one.
  string mac = 9;
  // IPv4 addresses in CIDR notation, sorted.
  repeated string ipv4 = 10;
  // IPv6 addresses in CIDR notation, sorted (link-local included when VPP reports it).
  repeated string ipv6 = 11;
  // VRF name of the IPv4 table: "default" for table 0, the configured VRF name for this agent's
  // tables, the table id as a decimal string otherwise.
  string vrf = 12;
  // IPv4 FIB table id.
  uint32 table_id = 13;
  // Logical name of the parent interface; set for sub-interfaces only.
  string parent = 14;
  // Outer VLAN id of a sub-interface; 0 otherwise.
  uint32 vlan_id = 15;
  // Inner VLAN id of a QinQ sub-interface; 0 otherwise.
  uint32 inner_vlan_id = 16;
  // True when this agent created the interface or holds a claim on it (it manages attributes).
  bool managed = 17;
  // Link speed in kbit/s as reported by the driver; 0 = unknown.
  uint64 link_speed_kbps = 18;
  // RX mode of queue 0: "polling", "interrupt" or "adaptive"; empty when VPP reports no queue.
  string rx_mode = 19;
  // Description from this agent's stored desired state (VPP cannot store it, D-073b); empty if none.
  string description = 20;
}

// ---------------------------------------------------------------------------------------------
// Desired state — 1:1 projection of the configuration document (packages/schema RootConfig)
// ---------------------------------------------------------------------------------------------
//
// Field numbers 1–13 of DesiredState follow the documented key order (`ROOT_KEYS`). Numbering
// convention inside every domain message: append-only — a new field takes the next free number
// regardless of its position in the Zod declaration (the first fields of a message happen to
// follow the Zod order); agent-only annotations, if ever needed, start at 100. Removed fields are
// `reserved`. system, dataplane, interfaces, vrfs, routing and management mirror the group-(a)
// schema leaf-for-leaf (D-042, D-061: synced on task/P02a); nat/objects/acl mirror the P02b schema
// (D-061, synced on task/P02b); vpn/tunnels/services/ha mirror the P02c schema leaf-for-leaf (D-061,
// synced on task/P02c; ha.vrrp became a record, D-053). Since P03b the drift guard
// (apps/agent/internal/contracttest TestSchemaProtoDrift) walks the generated JSON Schema of
// RootConfig against this descriptor in both directions (name, container, scalar type and width,
// explicit presence, no secret leaves) and fails CI on any difference not listed in its
// acceptedDrift table.

// DesiredState is the whole configuration as the agent sees it. Domain messages are named
// `<Key>Config` like the schema package's `<Key>Config` types; the two record-shaped domains
// (`interfaces`, `vrfs`) are maps keyed exactly like the JSON records.
message DesiredState {
  // `system` — hostname, timezone, banner, DNS client.
  SystemConfig system = 1;
  // `dataplane` — VPP startup tuning (workers, RX queues, hugepages, PCI whitelist, cores).
  DataplaneConfig dataplane = 2;
  // `interfaces` — keyed by VPP interface name ("TenGigabitEthernet0/0/0", "loop0", …).
  map<string, Interface> interfaces = 3;
  // `vrfs` — keyed by VRF name; "default" is an ordinary entry (vdom.md guardrail #1).
  map<string, Vrf> vrfs = 4;
  // `routing` — static routes, policy skeleton, FRR protocols.
  RoutingConfig routing = 5;
  // `nat` — NAT44 (ED/EI) at the top level plus the other translators as siblings.
  NatConfig nat = 6;
  // `objects` — reusable address/service/schedule/zone/tag objects.
  ObjectsConfig objects = 7;
  // `acl` — L3/L4, MACIP and host access lists and their attachments.
  AclConfig acl = 8;
  // `vpn` — IPsec, WireGuard, PKI, remote access.
  VpnConfig vpn = 9;
  // `tunnels` — GRE, VXLAN, IPIP.
  TunnelsConfig tunnels = 10;
  // `services` — DHCP, DNS, SNMP, LLDP, IPFIX/sFlow, NTP, QoS.
  ServicesConfig services = 11;
  // `ha` — VRRP, cluster.
  HaConfig ha = 12;
  // `management` — local users, AAA, TLS, syslog.
  ManagementConfig management = 13;
}

// ----- system (P02a, mirrors packages/schema/src/domains/system.ts) -----

// SystemConfig mirrors `system`.
message SystemConfig {
  // RFC 1123 hostname.
  optional string hostname = 1;
  // IANA timezone name, e.g. "UTC", "Asia/Tehran".
  optional string timezone = 2;
  // Login banners (pre-login + message of the day).
  SystemBanner banner = 3;
  // Field 4 was `ntp`: NTP is modelled once, in `services.ntp` (chrony renderer, D-050).
  reserved 4;
  reserved "ntp";
  // DNS client of the router itself (resolv.conf).
  SystemDns dns = 5;
}

// SystemBanner mirrors `system.banner` (rendered into /etc/issue, /etc/motd and the web login page).
message SystemBanner {
  // Pre-login banner shown before authentication (SSH issue, web login page); up to 4096 chars,
  // printable + LF/TAB only (D-049).
  optional string login = 1;
  // Message of the day shown after a successful login; same alphabet.
  optional string motd = 2;
}

// SystemDns mirrors `system.dns`.
message SystemDns {
  // Upstream resolvers of the system itself (IP addresses), in order.
  repeated string servers = 1;
  // Search domains (RFC 1123 names).
  repeated string search_domains = 2;
  // VRF used to reach the name servers; Zod default "default".
  optional string vrf = 3;
}

// ----- dataplane (P02a, mirrors packages/schema/src/domains/dataplane.ts) -----

// DataplaneConfig mirrors `dataplane` — rendered into the VPP startup configuration by the agent;
// changes need a data-plane restart, which the agent reports as ISSUE_SEVERITY_INFO in DryRun.
message DataplaneConfig {
  // Number of worker threads, 0–255 (0 = graph on the main thread only); unset = VPP default.
  optional uint32 workers = 1;
  // RX queues per interface (dpdk num-rx-queues); unset = driver default.
  optional uint32 rx_queues = 2;
  // Hugepage memory in GiB; unset = VPP default.
  optional uint32 hugepages_gb = 3;
  // PCI addresses ("0000:0b:00.0") of NICs handed to DPDK; empty = none (af_packet only).
  repeated string pci_whitelist = 4;
  // CPU core of the main thread (cpu main-core); unset = VPP default.
  optional uint32 main_core = 5;
  // CPU ids pinned to worker threads (cpu corelist-workers); when set, `workers` must equal its
  // length (semantic rule dataplane.workers-match-corelist). Empty = VPP default.
  repeated uint32 corelist = 6;
  // TX queues per interface (dpdk num-tx-queues); unset = driver default.
  optional uint32 tx_queues = 7;
  // PCI addresses of the management NIC(s): always `dpdk { blacklist }`, never a DPDK device
  // (F-startup-gen, D-081; the generator also protects the NIC it detects on the host).
  repeated string management_pci = 8;
  // DPDK devices keyed by PCI address ("0000:04:00.0") → `dpdk { dev <pci> { name … } }` (D-069, D-081).
  map<string, DataplaneDevice> devices = 9;
  // buffers { buffers-per-numa N }, 1024–4194304; unset = VPP default (16384).
  optional uint32 buffers_per_numa = 10;
  // plugins { plugin <file> { enable|disable } } (D-060, D-081, D-084). Present = authoritative: exactly
  // these switches are rendered; absent = the switches of the current start-up configuration are kept.
  optional PluginSet plugins = 11;
}

// PluginSet mirrors `dataplane.plugins` (D-084): a message so presence survives the proto.
message PluginSet {
  // Plugin file name ("linux_cp_plugin.so") → true = enable, false = disable.
  map<string, bool> switches = 1;
}

// DataplaneDevice mirrors one entry of `dataplane.devices` (F-startup-gen, D-081).
message DataplaneDevice {
  // Logical interface name (`name <logical>`, D-069): [a-z][a-z0-9_-]{0,14}; unset = VPP's PCI-derived name.
  optional string name = 1;
  // num-rx-queues, 1–256; unset = `dev default` / driver default.
  optional uint32 rx_queues = 2;
  // num-tx-queues, 1–256.
  optional uint32 tx_queues = 3;
  // num-rx-desc, power of two 64–16384.
  optional uint32 rx_desc = 4;
  // num-tx-desc, power of two 64–16384.
  optional uint32 tx_desc = 5;
}

// ----- interfaces (P02a, mirrors packages/schema/src/domains/interfaces.ts) -----

// Interface mirrors one entry of the `interfaces` record.
message Interface {
  // Administrative state (sw_interface_set_flags admin-up).
  optional bool enabled = 1;
  // Free-text description; stored as the second half of the VPP tag where possible.
  optional string description = 2;
  // MTU in bytes, 68–9216 (sw_interface_set_mtu); unset = driver default.
  optional uint32 mtu = 3;
  // MAC address "aa:bb:cc:dd:ee:ff" (lower-case canonical); unset = hardware/default MAC.
  optional string mac = 4;
  // IPv4 addresses in CIDR notation with host bits ("10.0.0.1/24"), sorted.
  repeated string ipv4 = 5;
  // IPv6 addresses in CIDR notation ("2001:db8::1/64"), sorted.
  repeated string ipv6 = 6;
  // VRF name the interface is bound to; first-class, never implicit (vdom.md #1).
  optional string vrf = 7;
  // RX mode: "polling" | "interrupt" | "adaptive" (sw_interface_set_rx_mode); unset = driver default.
  optional string rx_mode = 8;
  // Sub-interfaces keyed by the record key used in the document (usually the VLAN id as string).
  map<string, Subinterface> subinterfaces = 9;
  // IP-unnumbered: name of the interface whose addresses are borrowed; unset = numbered.
  optional string unnumbered = 10;
  // Accept frames for any destination MAC (sw_interface_set_promisc); Zod default false.
  optional bool promiscuous = 11;
  // DHCPv4 client (dhcp_client_config); present = enabled (D-050).
  DhcpClient dhcp_client = 12;

  // wave-A: F-bonding

  // Link aggregation (F-bonding): the interface (named BondEthernet<id>) is a VPP bond of the member interfaces; unset = not a bond.
  Bond bond = 13;

  // wave-A: F-bridge-l2

  // L2 role of the interface (F-bridge-l2, D-109 c): bridge membership, VLAN tag rewrite, MAC filter; unset = L3 only.
  BridgeL2Port l2 = 14;

  // wave-A: F-neighbors-ra

  // IPv6 router advertisements (F-neighbors-ra, sw_interface_ip6nd_ra_config / _ra_prefix); unset = not
  // configured (VPP default: suppressed).
  Ipv6Ra ipv6_ra = 15;
  // Proxy ARP on this interface (proxy_arp_intfc_enable_disable); unset or false = off.
  optional bool proxy_arp = 16;
  // Proxied IPv6 addresses (ip6nd_proxy_add_del); experimental, applied only with VRX_DF2_PROXY_ND=1 (V12).
  repeated string proxy_nd = 17;

  // wave-A: F-rpf-adl-pbr

  // Unicast RPF check (F-rpf-adl-pbr, urpf_update_v2); unset = no check.
  UrpfConfig urpf = 18;
  // Allow/deny list (F-rpf-adl-pbr, adl plugin); unset = off.
  AdlConfig adl = 19;

  // wave-A: F-loopback-bvi-gso-lldp-span

  // Software GSO on output (feature_gso_enable_disable; F-loopback-bvi-gso-lldp-span); unset = off.
  optional bool gso = 20;
  // Mirror sessions with this interface as the source (sw_interface_span_enable_disable; F-loopback-bvi-gso-lldp-span).
  repeated MirrorSession mirror = 21;

  // wave-A: P12
}

// DhcpClient mirrors `interfaces.<name>.dhcpClient` / `….subinterfaces.<id>.dhcpClient`.
message DhcpClient {
  // Hostname sent in option 12; unset = the system hostname.
  optional string hostname = 1;
  // Client identifier (option 61); unset = the interface MAC address.
  optional string client_id = 2;
  // Ask the server to broadcast its replies; Zod default false.
  optional bool set_broadcast_flag = 3;
}

// Subinterface mirrors one entry of `interfaces.<name>.subinterfaces` (dot1q / dot1ad).
message Subinterface {
  // Outer VLAN id 1–4094 (create_vlan_subif / create_subif).
  optional uint32 vlan_id = 1;
  // Inner VLAN id for QinQ; unset = single-tagged.
  optional uint32 inner_vlan_id = 2;
  // Administrative state.
  optional bool enabled = 3;
  // Free-text description.
  optional string description = 4;
  // MTU in bytes; unset = inherit from the parent.
  optional uint32 mtu = 5;
  // IPv4 addresses in CIDR notation, sorted.
  repeated string ipv4 = 6;
  // IPv6 addresses in CIDR notation, sorted.
  repeated string ipv6 = 7;
  // VRF name; may differ from the parent's.
  optional string vrf = 8;
  // IP-unnumbered source interface; unset = numbered.
  optional string unnumbered = 9;
  // Outer tag is 802.1ad (0x88a8) instead of 802.1Q (0x8100); Zod default false.
  optional bool dot1ad = 10;
  // DHCPv4 client; present = enabled (D-050).
  DhcpClient dhcp_client = 11;

  // wave-A: F-bridge-l2

  // L2 role of the sub-interface (F-bridge-l2, D-109 c): bridge membership, VLAN tag rewrite; unset = L3 only.
  BridgeL2Port l2 = 12;

  // wave-A: F-neighbors-ra

  // IPv6 router advertisements (F-neighbors-ra); unset = not configured.
  Ipv6Ra ipv6_ra = 13;
  // Proxy ARP on this sub-interface; unset or false = off.
  optional bool proxy_arp = 14;
  // Proxied IPv6 addresses (experimental, V12).
  repeated string proxy_nd = 15;

  // wave-A: F-rpf-adl-pbr
}

// ----- vrfs (P02a, mirrors packages/schema/src/domains/vrfs.ts) -----

// Vrf mirrors one entry of the `vrfs` record (ip_table_add_del for IPv4 and IPv6).
message Vrf {
  // VPP FIB table id, 0..2^32-1; 0 is the default table.
  optional uint32 id = 1;
  // Free-text description (VPP table name carries "<owner>:<name>").
  optional string description = 2;

  // wave-A: F-vrf-static-ecmp

  // Source VRF select (svs plugin): packets from these source prefixes arriving on these interfaces are routed in this
  // VRF. Canonical order: by interface, then prefix (F-vrf-static-ecmp).
  repeated VrfSourceSelect source_select = 3;

  // wave-A: F-neighbors-ra

  // Proxy-ARP address ranges of this VRF's IPv4 FIB (F-neighbors-ra, proxy_arp_add_del).
  repeated ProxyArpRange proxy_arp_ranges = 4;
}

// ----- routing (P02a, mirrors packages/schema/src/domains/routing.ts) -----

// RoutingConfig mirrors `routing`. Shapes follow the FRR renderer contract of P12 §2 (D-045):
// collections with a natural key are maps (neighbours by address, IGP interfaces by name, OSPF
// areas by id); ordered lists stay repeated.
message RoutingConfig {
  // Static routes (ip_route_add_del).
  repeated StaticRoute static = 1;
  // Fields 2/3 were `prefix_lists` / `route_maps`: moved under `policy` (D-045).
  reserved 2, 3;
  reserved "prefix_lists", "route_maps";
  // BGP (FRR bgpd); unset = BGP not configured.
  BgpConfig bgp = 4;
  // OSPFv2 (FRR ospfd); unset = not configured.
  OspfConfig ospf = 5;
  // IS-IS (FRR isisd); unset = not configured.
  IsisConfig isis = 6;
  // RIP (FRR ripd); unset = not configured.
  RipConfig rip = 7;
  // BFD sessions (VPP bfd plugin); unset = none.
  BfdConfig bfd = 8;
  // Routing policy: prefix lists and route maps (FRR).
  RoutingPolicy policy = 9;

  // wave-BC: F-ospf
  // wave-BC: F-isis-rip
  // wave-BC: F-mpls-srmpls
  // wave-BC: F-igmp-mfib
  // wave-BC: F-srv6
  // wave-A: F-bridge-l2

  // L2 switching container (F-bridge-l2, D-109 c): bridge domains, L2/L3 cross-connects, MAC filter; unset = none.
  BridgeL2Config l2 = 20;

  // wave-A: F-neighbors-ra

  // Static neighbours, neighbour-table limits and DAD (F-neighbors-ra); unset = none configured.
  NeighborsConfig neighbors = 10;

  // wave-A: F-rpf-adl-pbr

  // Policy-based routing: ACL-based forwarding (F-rpf-adl-pbr, abf plugin); unset = none.
  PbrConfig pbr = 11;
}

// StaticRoute mirrors one entry of `routing.static`.
message StaticRoute {
  // Destination prefix in CIDR notation, IPv4 or IPv6 ("0.0.0.0/0", "2001:db8::/32").
  optional string prefix = 1;
  // Next hops (ECMP when more than one); empty only for a blackhole route.
  repeated NextHop next_hops = 2;
  // VRF name the route is installed in; first-class (vdom.md #1). Zod default "default".
  optional string vrf = 3;
  // Administrative distance 1–255; Zod default 1.
  optional uint32 distance = 4;
  // Free-text description.
  optional string description = 5;
  // Drop matching traffic (null route, FIB_PATH_TYPE drop); requires empty next_hops. Zod default false.
  optional bool blackhole = 6;

  // wave-A: F-vrf-static-ecmp

  // D-072: true = FRR (staticd) programs this route and the agent does not; unset/false = the agent programs it in VPP.
  optional bool via_frr = 7;

  // wave-A: P12
}

// NextHop is one path of a StaticRoute.
message NextHop {
  // Next-hop (gateway) address; unset with `interface` set = directly attached / interface route.
  // At least one of address / interface is set (Zod refine).
  optional string address = 1;
  // Egress VPP interface name; unset = resolved via the FIB.
  optional string interface = 2;
  // ECMP weight 1–255; Zod default 1 (always set in a parsed document).
  optional uint32 weight = 3;
  // VRF the next-hop address is resolved in (VPP path table_id); unset = the route's VRF. Only with `address` and
  // without `interface` (F-vrf-static-ecmp).
  optional string vrf = 4;
}

// RoutingPolicy mirrors `routing.policy`.
message RoutingPolicy {
  // Prefix lists keyed by name.
  map<string, PrefixList> prefix_lists = 1;
  // Route maps keyed by name.
  map<string, RouteMap> route_maps = 2;
}

// PrefixList mirrors `routing.policy.prefixLists.<name>` (FRR `ip|ipv6 prefix-list`).
message PrefixList {
  // Free-text description.
  optional string description = 1;
  // "ipv4" | "ipv6"; Zod default "ipv4".
  optional string family = 2;
  // Rules in document order; `seq` unique.
  repeated PrefixListRule rules = 3;
}

// PrefixListRule is one `seq N permit|deny <prefix> [ge G] [le L]`.
message PrefixListRule {
  // Sequence number 1..2^32-1.
  optional uint32 seq = 1;
  // "permit" | "deny".
  optional string action = 2;
  // Network prefix (host bits zero).
  optional string prefix = 3;
  // Minimum matched length (len < ge ≤ max).
  optional uint32 ge = 4;
  // Maximum matched length (len ≤ le ≤ max, ge ≤ le).
  optional uint32 le = 5;
}

// RouteMap mirrors `routing.policy.routeMaps.<name>`.
message RouteMap {
  // Free-text description.
  optional string description = 1;
  // Entries in document order; `seq` unique.
  repeated RouteMapEntry entries = 2;
}

// RouteMapEntry is one `route-map NAME permit|deny SEQ` block.
message RouteMapEntry {
  // Sequence number 1..2^32-1.
  optional uint32 seq = 1;
  // "permit" | "deny".
  optional string action = 2;
  // Free-text description.
  optional string description = 3;
  // Match clauses (all must match; empty = everything).
  RouteMapMatch match = 4;
  // Set clauses.
  RouteMapSet set = 5;
}

// RouteMapMatch mirrors `…entries[].match`.
message RouteMapMatch {
  // `match ip[v6] address prefix-list`.
  optional string prefix_list = 1;
  // `match ip[v6] next-hop prefix-list`.
  optional string next_hop_prefix_list = 2;
  // `match interface`.
  optional string interface = 3;
  // `match community` (standard community or well-known name).
  optional string community = 4;
  // `match as-path` regex (FRR alphabet only, D-049).
  optional string as_path = 5;
  // `match metric`.
  optional uint32 metric = 6;
  // `match tag`.
  optional uint32 tag = 7;
}

// RouteMapSet mirrors `…entries[].set`; names follow P12 §2.
message RouteMapSet {
  // `set local-preference`.
  optional uint32 local_pref = 1;
  // `set metric` (BGP MED).
  optional uint32 med = 2;
  // `set weight` 0–65535.
  optional uint32 weight = 3;
  // `set ip[v6] next-hop`.
  optional string next_hop = 4;
  // `set community …`.
  repeated string community = 5;
  // Append instead of replace (`additive`); Zod default false.
  optional bool community_additive = 6;
  // `set as-path prepend …`.
  repeated uint32 as_path_prepend = 7;
  // `set tag`.
  optional uint32 tag = 8;
}

// RedistributeOptions is one redistributed source; the field being set means "redistribute it".
message RedistributeOptions {
  // `metric N`.
  optional uint32 metric = 1;
  // `route-map NAME`.
  optional string route_map = 2;
}

// Redistribute mirrors `routing.<protocol>.redistribute` (a record keyed by source protocol; the
// schema rejects a protocol redistributing into itself).
//
// One message serves every protocol, so each protocol's own key exists here but can never be set
// (the drift guard accepts exactly these four supersets, apps/agent/internal/contracttest).
message Redistribute {
  // Connected routes.
  RedistributeOptions connected = 1;
  // Static routes.
  RedistributeOptions static = 2;
  // BGP routes (not under routing.bgp).
  RedistributeOptions bgp = 3;
  // OSPF routes (not under routing.ospf).
  RedistributeOptions ospf = 4;
  // IS-IS routes (not under routing.isis).
  RedistributeOptions isis = 5;
  // RIP routes (not under routing.rip).
  RedistributeOptions rip = 6;
}

// BgpAddressFamily mirrors `…afi.ipv4Unicast` / `…afi.ipv6Unicast` of a neighbour or peer group.
message BgpAddressFamily {
  // `activate`; Zod default true.
  optional bool enabled = 1;
  // Inbound route map (name under routing.policy.routeMaps).
  optional string route_map_in = 2;
  // Outbound route map.
  optional string route_map_out = 3;
  // Inbound prefix list (name under routing.policy.prefixLists).
  optional string prefix_list_in = 4;
  // Outbound prefix list.
  optional string prefix_list_out = 5;
  // Zod default false.
  optional bool next_hop_self = 6;
  // `soft-reconfiguration inbound`; Zod default false.
  optional bool soft_reconfig = 7;
  // `maximum-prefix N`.
  optional uint32 maximum_prefixes = 8;
  // `default-originate`; Zod default false.
  optional bool default_originate = 9;
}

// BgpAfi mirrors `…afi`; an unset family is not activated.
message BgpAfi {
  // `address-family ipv4 unicast`.
  BgpAddressFamily ipv4_unicast = 1;
  // `address-family ipv6 unicast`.
  BgpAddressFamily ipv6_unicast = 2;
}

// BgpPeerGroup mirrors `routing.bgp.peerGroups.<name>`.
message BgpPeerGroup {
  // Remote AS (asplain).
  optional uint32 remote_as = 1;
  // Free text.
  optional string description = 2;
  // Local address or interface name.
  optional string update_source = 3;
  // eBGP multihop TTL, 1–255.
  optional uint32 ebgp_multihop = 4;
  // TCP MD5 password: a secret-store reference "password/<name>" (D-051), never the password.
  optional string password_ref = 5;
  // Keepalive timer, seconds.
  optional uint32 keepalive_sec = 6;
  // Hold timer, seconds (≥ 3).
  optional uint32 hold_time_sec = 7;
  // Zod default false.
  optional bool bfd = 8;
  // Address families.
  BgpAfi afi = 9;
}

// BgpNeighbor mirrors `routing.bgp.neighbors.<address>` (map key = neighbour address).
message BgpNeighbor {
  // Remote AS (asplain); may come from the peer group instead.
  optional uint32 remote_as = 1;
  // Free text.
  optional string description = 2;
  // Local address or interface name.
  optional string update_source = 3;
  // eBGP multihop TTL, 1–255.
  optional uint32 ebgp_multihop = 4;
  // Secret-store reference "password/<name>" (D-051).
  optional string password_ref = 5;
  // Keepalive timer, seconds.
  optional uint32 keepalive_sec = 6;
  // Hold timer, seconds (≥ 3).
  optional uint32 hold_time_sec = 7;
  // BFD for this session; Zod default false.
  optional bool bfd = 8;
  // Address families.
  BgpAfi afi = 9;
  // Inherit settings from this peer group.
  optional string peer_group = 10;
  // Keep the configuration, do not bring the session up; Zod default false.
  optional bool shutdown = 11;
}

// BgpNetwork mirrors one entry of `routing.bgp.networks`.
message BgpNetwork {
  // Announced prefix (CIDR).
  optional string prefix = 1;
  // Route map applied to the announcement.
  optional string route_map = 2;
}

// BgpConfig mirrors `routing.bgp`.
message BgpConfig {
  // Local AS (asplain).
  optional uint32 asn = 1;
  // Router id (dotted quad).
  optional string router_id = 2;
  // Zod default "default".
  optional string vrf = 3;
  // Peer groups keyed by name.
  map<string, BgpPeerGroup> peer_groups = 4;
  // Keyed by neighbour address.
  map<string, BgpNeighbor> neighbors = 5;
  // `network` statements.
  repeated BgpNetwork networks = 6;
  // Redistribution into BGP (the `bgp` key is never set).
  Redistribute redistribute = 7;
  // Zod default false.
  optional bool graceful_restart = 8;
  // RFC 8212; Zod default true.
  optional bool ebgp_requires_policy = 9;
}

// OspfArea mirrors `routing.ospf.areas.<id>` (map key = area id, decimal or dotted quad).
message OspfArea {
  // "normal" | "stub" | "nssa"; Zod default "normal".
  optional string type = 1;
  // Totally stubby / totally NSSA; Zod default false.
  optional bool no_summary = 2;
}

// OspfInterface mirrors `routing.ospf.interfaces.<name>`.
message OspfInterface {
  // Area id (decimal or dotted quad string), must exist under `areas`.
  optional string area = 1;
  // Interface cost, 1–65535.
  optional uint32 cost = 2;
  // Zod default false.
  optional bool passive = 3;
  // "broadcast" | "point-to-point" | "non-broadcast" | "point-to-multipoint".
  optional string network_type = 4;
  // Hello interval, seconds.
  optional uint32 hello_interval_sec = 5;
  // Dead interval, seconds.
  optional uint32 dead_interval_sec = 6;
  // DR priority, 0–255.
  optional uint32 priority = 7;
  // Zod default false.
  optional bool bfd = 8;

  // wave-BC: F-ospf
  // wave-BC: F-bfd-redistribution
}

// OspfConfig mirrors `routing.ospf`.
message OspfConfig {
  // Router id (dotted quad).
  optional string router_id = 1;
  // Zod default "default".
  optional string vrf = 2;
  // Areas keyed by area id.
  map<string, OspfArea> areas = 3;
  // Interfaces keyed by interface name.
  map<string, OspfInterface> interfaces = 4;
  // Redistribution into OSPF (the `ospf` key is never set).
  Redistribute redistribute = 5;
  // "off" | "on" | "always"; Zod default "off".
  optional string default_information_originate = 6;
}

// IsisInterface mirrors `routing.isis.interfaces.<name>`.
message IsisInterface {
  // Zod default false.
  optional bool passive = 1;
  // Wide metric, 1–16777215.
  optional uint32 metric = 2;
  // "level-1" | "level-2" | "level-1-2".
  optional string circuit_type = 3;
  // "broadcast" | "point-to-point".
  optional string network_type = 4;
  // Zod default false.
  optional bool bfd = 5;

  // wave-BC: F-isis-rip
  // wave-BC: F-bfd-redistribution
}

// IsisConfig mirrors `routing.isis`.
message IsisConfig {
  // Network entity title, e.g. "49.0001.1921.6800.1001.00".
  optional string net = 1;
  // IS type; Zod default "level-1-2".
  optional string level = 2;
  // Zod default "default".
  optional string vrf = 3;
  // Interfaces keyed by interface name.
  map<string, IsisInterface> interfaces = 4;
  // Redistribution into IS-IS (the `isis` key is never set).
  Redistribute redistribute = 5;

  // wave-BC: F-isis-rip
}

// RipInterface mirrors `routing.rip.interfaces.<name>`.
message RipInterface {
  // Zod default false.
  optional bool passive = 1;

  // wave-BC: F-isis-rip
}

// RipConfig mirrors `routing.rip`.
message RipConfig {
  // Zod default "default".
  optional string vrf = 1;
  // IPv4 network prefixes RIP runs on.
  repeated string networks = 2;
  // Interfaces keyed by interface name.
  map<string, RipInterface> interfaces = 3;
  // Redistribution into RIP (the `rip` key is never set).
  Redistribute redistribute = 4;
  // Zod default 1.
  optional uint32 default_metric = 5;

  // wave-BC: F-isis-rip
}

// BfdSession mirrors one entry of `routing.bfd.sessions` (bfd_udp_add).
message BfdSession {
  // Interface name the session runs on.
  optional string interface = 1;
  // Local IP address.
  optional string local_address = 2;
  // Peer IP address.
  optional string peer_address = 3;
  // Microseconds; Zod default 300000.
  optional uint32 desired_min_tx_us = 4;
  // Microseconds; Zod default 300000.
  optional uint32 required_min_rx_us = 5;
  // Zod default 3.
  optional uint32 detect_multiplier = 6;
  // Zod default true.
  optional bool enabled = 7;

  // wave-BC: F-bfd-redistribution
}

// BfdConfig mirrors `routing.bfd`.
message BfdConfig {
  // Static BFD sessions.
  repeated BfdSession sessions = 1;

  // wave-BC: F-bfd-redistribution
}

// ----- tunnels (P02c, mirrors packages/schema/src/domains/tunnels.ts) -----
//
// Every tunnel has two VRFs (vdom.md #1): `underlay_vrf` is the FIB of the outer packets (src/dst),
// `vrf` the FIB of the tunnel interface. `instance` fixes the VPP interface name (gre<n>, ipip<n>,
// vxlan_tunnel<n>) so other domains can reference the tunnel as an interface.

// TunnelsConfig mirrors `tunnels`; the records are keyed by tunnel name (unique across kinds).
message TunnelsConfig {
  // GRE tunnels (gre_tunnel_add_del).
  map<string, GreTunnel> gre = 1;
  // VXLAN tunnels (vxlan_add_del_tunnel).
  map<string, VxlanTunnel> vxlan = 2;
  // IPIP tunnels (ipip_add_tunnel), also the VTI of route-based IPsec.
  map<string, IpipTunnel> ipip = 3;

  // wave-BC: F-tunnels
  // wave-BC: F-lisp

  // LISP / LISP-GPE (F-lisp); unset = no LISP managed by this document.
  LispConfig lisp = 10;
}

// GreTunnel is `tunnels.gre.<name>`.
message GreTunnel {
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // VPP instance (interface gre<instance>); unset = allocated by VPP, not referenceable.
  optional uint32 instance = 3;
  // Source address (configured on an interface in underlay_vrf).
  optional string src = 4;
  // FIB of the outer packets.
  optional string underlay_vrf = 5;
  // FIB of the tunnel interface (overlay).
  optional string vrf = 6;
  // MTU; unset = VPP default.
  optional uint32 mtu = 7;
  // IPv4 interface addresses (CIDR); L3 tunnels only.
  repeated string ipv4 = 8;
  // IPv6 interface addresses (CIDR); L3 tunnels only.
  repeated string ipv6 = 9;
  // Bridge domain id (L2 tunnels: teb, erspan).
  optional uint32 bridge_domain = 10;
  // Destination address.
  optional string dst = 11;
  // "l3" | "teb" | "erspan".
  optional string type = 12;
  // ERSPAN session id 0–1023 (type erspan only).
  optional uint32 session_id = 13;
}

// VxlanTunnel is `tunnels.vxlan.<name>`.
message VxlanTunnel {
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // VPP instance (interface vxlan_tunnel<instance>).
  optional uint32 instance = 3;
  // Source address (configured on an interface in underlay_vrf).
  optional string src = 4;
  // FIB of the outer packets.
  optional string underlay_vrf = 5;
  // FIB of the tunnel interface (overlay, decap ip4/ip6).
  optional string vrf = 6;
  // MTU; unset = VPP default.
  optional uint32 mtu = 7;
  // IPv4 interface addresses (CIDR); decap ip4/ip6 only.
  repeated string ipv4 = 8;
  // IPv6 interface addresses (CIDR); decap ip4/ip6 only.
  repeated string ipv6 = 9;
  // Bridge domain id (decap l2).
  optional uint32 bridge_domain = 10;
  // Unicast peer or multicast group.
  optional string dst = 11;
  // 24-bit VNI.
  optional uint32 vni = 12;
  // Source UDP port.
  optional uint32 src_port = 13;
  // Destination UDP port.
  optional uint32 dst_port = 14;
  // Interface joining the multicast group (multicast dst only).
  optional string mcast_interface = 15;
  // "l2" | "ip4" | "ip6".
  optional string decap = 16;
}

// IpipTunnel is `tunnels.ipip.<name>`.
message IpipTunnel {
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // VPP instance (interface ipip<instance>).
  optional uint32 instance = 3;
  // Source address (configured on an interface in underlay_vrf).
  optional string src = 4;
  // FIB of the outer packets.
  optional string underlay_vrf = 5;
  // FIB of the tunnel interface (overlay).
  optional string vrf = 6;
  // MTU; unset = VPP default.
  optional uint32 mtu = 7;
  // IPv4 interface addresses (CIDR).
  repeated string ipv4 = 8;
  // IPv6 interface addresses (CIDR).
  repeated string ipv6 = 9;
  // Bridge domain id (never valid for IPIP; kept for the common tunnel shape).
  optional uint32 bridge_domain = 10;
  // "p2p" | "p2mp".
  optional string mode = 11;
  // Destination address (p2p only).
  optional string dst = 12;
  // Outer DSCP 0–63; unset = copy the inner DSCP.
  optional uint32 dscp = 13;

  // wave-BC: F-tunnels
}

// ----- services (P02c, mirrors packages/schema/src/domains/services.ts) -----
//
// Renderers are written so that "one daemon instance per <vrf|interface>" is a parameter of these
// messages, not an assumption (vdom.md #5). Secrets are `*_ref` references only (D-051).

// ServicesConfig mirrors `services`.
message ServicesConfig {
  // DHCP servers (Kea instances) and relays (VPP dhcp proxy).
  DhcpService dhcp = 1;
  // DNS resolvers (Unbound instances) and the VPP dns cache.
  DnsService dns = 2;
  // SNMP agent (net-snmp).
  SnmpService snmp = 3;
  // LLDP (VPP lldp plugin).
  LldpService lldp = 4;
  // IPFIX exporters, flowprobe and sFlow (VPP plugins).
  IpfixService ipfix = 5;
  // NTP client/server (chrony) — the only NTP model (D-050).
  NtpService ntp = 6;
  // QoS: policers, shapers, marking maps, interface attachments (D-052).
  QosService qos = 7;

  // wave-BC: F-host-stack

  // VPP host stack: session layer, app namespaces, session rules, TCP source addresses, http_static (F-host-stack).
  HostStackService host_stack = 10;

  // wave-BC: F-lb
  // wave-A: F-rpf-adl-pbr

  // Automatic source deny list of the host stack (F-rpf-adl-pbr, auto_sdl plugin, a VPP-global); unset = off.
  AutoSdlConfig auto_sdl = 8;

  // wave-A: F-loopback-bvi-gso-lldp-span

  // Network delay simulator, a lab tool (VPP nsim; applied by the globals owner only, D-071; F-loopback-bvi-gso-lldp-span).
  NsimService nsim = 9;
}

// SocketAddress is an `{ address, port }` pair (listen sockets, collectors).
message SocketAddress {
  // IP address.
  optional string address = 1;
  // UDP/TCP port.
  optional uint32 port = 2;
}

// DhcpService is `services.dhcp`.
message DhcpService {
  // Kea server instances keyed by name.
  map<string, DhcpServer> servers = 1;
  // Relays keyed by name.
  map<string, DhcpRelay> relays = 2;
}

// DhcpOption is one DHCP option.
message DhcpOption {
  // Option code (DHCPv4 1–254, DHCPv6 1–65535).
  optional uint32 code = 1;
  // Kea option data.
  optional string data = 2;
  // Send even when not requested.
  optional bool always_send = 3;
}

// DhcpPool is one address range of a subnet.
message DhcpPool {
  // First address.
  optional string start = 1;
  // Last address.
  optional string end = 2;
}

// DhcpReservation is `…subnets.<name>.reservations.<name>`.
message DhcpReservation {
  // Client MAC (exactly one of mac / duid).
  optional string mac = 1;
  // Client DUID (DHCPv6).
  optional string duid = 2;
  // Reserved address.
  optional string ip = 3;
  // Hostname.
  optional string hostname = 4;
  // Options.
  repeated DhcpOption options = 5;
}

// DhcpSubnet is `services.dhcp.servers.<name>.subnets.<name>`.
message DhcpSubnet {
  // Free-text description.
  optional string description = 1;
  // Subnet (CIDR).
  optional string subnet = 2;
  // Address pools.
  repeated DhcpPool pools = 3;
  // Default gateway (DHCPv4).
  optional string gateway = 4;
  // DNS servers.
  repeated string dns_servers = 5;
  // NTP servers.
  repeated string ntp_servers = 6;
  // Domain name.
  optional string domain_name = 7;
  // Domain search list.
  repeated string domain_search = 8;
  // Lease time in seconds; unset = server default.
  optional uint32 lease_time_sec = 9;
  // Options.
  repeated DhcpOption options = 10;
  // Reservations keyed by name.
  map<string, DhcpReservation> reservations = 11;
}

// DhcpServer is `services.dhcp.servers.<name>` (one Kea instance).
message DhcpServer {
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // "ipv4" | "ipv6".
  optional string family = 3;
  // VRF of the instance.
  optional string vrf = 4;
  // Interfaces the instance listens on.
  repeated string interfaces = 5;
  // Lease time in seconds.
  optional uint32 lease_time_sec = 6;
  // Renew timer T1 in seconds.
  optional uint32 renew_timer_sec = 7;
  // Rebind timer T2 in seconds.
  optional uint32 rebind_timer_sec = 8;
  // Authoritative.
