[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectKernelLogs=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_SYS_ADMIN CAP_IPC_LOCK CAP_CHOWN CAP_DAC_OVERRIDE
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
ReadWritePaths=/var/lib/ngfw-system-identity /etc/systemd/resolved.conf.d
ReadWritePaths=/var/lib/ngfw/agent /var/lib/ngfw/captures /etc/ngfw/rsyslog-tls /run/ngfw -/etc/frr -/etc/swanctl -/etc/kea -/etc/unbound -/etc/chrony -/etc/rsyslog.d -/etc/snmp -/etc/keepalived
RestrictNamespaces=~cgroup
SystemCallFilter=
SystemCallFilter=@system-service @mount
