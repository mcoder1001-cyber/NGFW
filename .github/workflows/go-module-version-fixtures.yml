name: Go module installer source fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/go-module-version-fixtures.yml'
      - '.github/scripts/go-module-version-fixtures.py'
      - 'scripts/20-install-build.sh'
      - 'apps/agent/go.mod'
      - 'docs/status/tasks/TD-19-test-go-module-version.py'
  push:
    paths:
      - '.github/workflows/go-module-version-fixtures.yml'
      - '.github/scripts/go-module-version-fixtures.py'
      - 'scripts/20-install-build.sh'
      - 'apps/agent/go.mod'
      - 'docs/status/tasks/TD-19-test-go-module-version.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-module-version-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: ShellCheck and six offline module-version cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check actual build installer shell source
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          shellcheck --version
          shellcheck -x -P SCRIPTDIR scripts/20-install-build.sh
      - name: Check inventory and strict outcome policy
        run: python3 .github/scripts/go-module-version-fixtures.py --check-policy
      - name: Run exactly six offline module-version methods
        run: python3 .github/scripts/go-module-version-fixtures.py
