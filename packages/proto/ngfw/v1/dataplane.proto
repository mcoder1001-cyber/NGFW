  // "psk" | "cert".
  optional string method = 1;
  // method=psk: reference to the pre-shared key (never the key).
  optional string secret_ref = 2;
  // method=cert: local certificate name in vpn.pki.certificates.
  optional string certificate = 3;
  // method=cert: CA name in vpn.pki.cas trusted for the peer; unset = any configured CA.
  optional string remote_ca = 4;
}

// IpsecDpd mirrors a dead-peer-detection block.
message IpsecDpd {
  // Enabled.
  optional bool enabled = 1;
  // DPD delay in seconds.
  optional uint32 delay_sec = 2;
  // DPD timeout in seconds (IKEv1 only).
  optional uint32 timeout_sec = 3;
  // "clear" | "trap" | "restart".
  optional string action = 4;
}

// IpsecRekey mirrors a rekeying block.
message IpsecRekey {
  // IKE SA lifetime in seconds.
  optional uint32 ike_sec = 1;
  // CHILD SA lifetime in seconds.
  optional uint32 esp_sec = 2;
  // CHILD SA lifetime in bytes; unset = none.
  optional uint64 esp_bytes = 3;
  // CHILD SA lifetime in packets; unset = none.
  optional uint64 esp_packets = 4;
  // Re-authenticate instead of rekeying the IKE SA.
  optional bool reauth = 5;
}

// IpsecTunnel mirrors `vpn.ipsec.tunnels.<name>`.
message IpsecTunnel {
  // Route-based (VTI) settings.
  message RouteBased {
    // Name in tunnels.ipip; the tunnel is protected (ipsec_tunnel_protect) and traffic is steered
    // by routes.
    optional string ipip_interface = 1;
  }
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // "strongswan" | "vpp-ikev2".
  optional string engine = 3;
  // IKE version 1 | 2.
  optional uint32 ike_version = 4;
  // "tunnel" | "transport".
  optional string mode = 5;
  // "esp" | "ah".
  optional string protocol = 6;
  // Local address (configured on an interface in `underlay_vrf`).
  optional string local_addr = 7;
  // Remote address: IP, hostname or "%any" (responder only).
  optional string remote_addr = 8;
  // Local IKE identity; unset = local address.
  optional string local_id = 9;
  // Remote IKE identity; unset = remote address.
  optional string remote_id = 10;
  // Authentication.
  IpsecAuth auth = 11;
  // Name in vpn.ipsec.proposals.
  optional string proposal = 12;
  // Local traffic selectors (CIDR); policy-based tunnels need ≥ 1.
  repeated string local_ts = 13;
  // Remote traffic selectors (CIDR).
  repeated string remote_ts = 14;
  // Dead peer detection.
  IpsecDpd dpd = 15;
  // NAT traversal (UDP encapsulation).
  optional bool nat_t = 16;
  // MOBIKE (IKEv2); unset = strongSwan default.
  optional bool mobike = 17;
  // IKE fragmentation: "yes" | "no" | "force" | "accept"; unset = default.
  optional string fragmentation = 18;
  // Rekeying.
  IpsecRekey rekey = 19;
  // "none" | "start" | "trap".
  optional string start_action = 20;
  // "none" | "start" | "trap".
  optional string close_action = 21;
  // Overlay VRF: FIB the traffic selectors apply to / the protected IPIP interface belongs to (vdom.md #1).
  optional string vrf = 22;
  // Route-based settings; unset = policy-based.
  RouteBased route_based = 23;
  // Extended sequence numbers.
  optional bool esn = 24;
  // Anti-replay.
  optional bool anti_replay = 25;
  // FIB IKE/ESP run in (outer packets); local_addr is configured in it. `vrf` is the overlay (F4).
  optional string underlay_vrf = 26;

  // wave-BC: F-ikev2-native
}

// IpsecSettings mirrors `vpn.ipsec.settings`.
message IpsecSettings {
  // VPP crypto engine: "auto" | "native" | "ipsecmb" | "openssl".
  optional string crypto_engine = 1;
  // Asynchronous crypto (dedicated crypto workers / QAT).
  optional bool async_crypto = 2;

  // wave-BC: F-ikev2-native
}

// IpsecConfig mirrors `vpn.ipsec`.
message IpsecConfig {
  // Plugin-wide settings.
  IpsecSettings settings = 1;
  // Proposals keyed by name.
  map<string, IpsecProposal> proposals = 2;
  // Tunnels keyed by name.
  map<string, IpsecTunnel> tunnels = 3;
}

// WireguardPeer mirrors `vpn.wireguard.interfaces.<name>.peers.<name>`.
message WireguardPeer {
  // Remote endpoint.
  message Endpoint {
    // IP address or hostname.
    optional string address = 1;
    // UDP port.
    optional uint32 port = 2;
  }
  // Free-text description.
  optional string description = 1;
  // Base64 32-byte public key.
  optional string public_key = 2;
  // Reference to the pre-shared key; unset = none.
  optional string preshared_key_ref = 3;
  // Endpoint; unset for peers that always initiate.
  Endpoint endpoint = 4;
  // Allowed IPs (CIDR, 1–256).
  repeated string allowed_ips = 5;
  // Persistent keepalive in seconds; 0 = disabled (Zod default).
  optional uint32 persistent_keepalive_sec = 6;
}

// WireguardInterface mirrors `vpn.wireguard.interfaces.<name>`.
message WireguardInterface {
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // VPP instance number; the interface is "wg<instance>".
  optional uint32 instance = 3;
  // VRF of the tunnel interface.
  optional string vrf = 4;
  // VRF of the listen address / peer endpoints.
  optional string underlay_vrf = 5;
  // Listen (source) address.
  optional string listen_address = 6;
  // Listen UDP port.
  optional uint32 listen_port = 7;
  // Reference to the private key.
  optional string private_key_ref = 8;
  // Interface addresses (CIDR).
  repeated string address = 9;
  // MTU.
  optional uint32 mtu = 10;
  // Peers keyed by name.
  map<string, WireguardPeer> peers = 11;
  // Install a route via this interface for every allowed IP of its peers (F-wireguard; default false).
  optional bool route_allowed_ips = 12;
}

// WireguardConfig mirrors `vpn.wireguard`.
message WireguardConfig {
  // Interfaces keyed by name.
  map<string, WireguardInterface> interfaces = 1;
}

// PkiCa mirrors `vpn.pki.cas.<name>`.
message PkiCa {
  // CRL settings.
  message Crl {
    // CRL distribution URL.
    optional string url = 1;
    // Refresh interval in seconds.
    optional uint32 refresh_interval_sec = 2;
  }
  // Free-text description.
  optional string description = 1;
  // Reference to the CA certificate (PEM in the secret store).
  optional string certificate_ref = 2;
  // CRL; unset = none.
  Crl crl = 3;
  // OCSP responder URL.
  optional string ocsp_url = 4;

  // wave-BC: F-pki

  // How the CA key pair was generated (F-pki); unset = unknown (imported).
  PkiKeySpec key_spec = 5;
  // Facts of the CA certificate recorded by the PKI actions (F-pki); unset = not recorded.
  PkiIssued issued = 6;
}

// PkiCertificate mirrors `vpn.pki.certificates.<name>`.
message PkiCertificate {
  // ACME settings.
  message Acme {
    // ACME directory URL.
    optional string directory_url = 1;
    // Domains (1–100).
    repeated string domains = 2;
    // Account e-mail.
    optional string email = 3;
    // "http-01" | "dns-01".
    optional string challenge = 4;
  }
  // Free-text description.
  optional string description = 1;
  // Reference to the certificate; unset when obtained via ACME.
  optional string certificate_ref = 2;
  // Reference to the private key.
  optional string private_key_ref = 3;
  // Issuing CA name in vpn.pki.cas.
  optional string ca = 4;
  // ACME; unset = static certificate.
  Acme acme = 5;
  // Alert this many days before expiry.
  optional uint32 expiry_alert_days = 6;

  // wave-BC: F-pki

  // Parameters of the key pair + CSR made by the PKI actions (F-pki); unset = imported.
  PkiCsr csr = 7;
  // Facts of the certificate recorded by the PKI actions (F-pki); unset = not recorded.
  PkiIssued issued = 8;
}

// PkiConfig mirrors `vpn.pki`.
message PkiConfig {
  // PKCS#11 / HSM.
  message Hsm {
    // Enabled.
    optional bool enabled = 1;
    // PKCS#11 module path.
    optional string module = 2;
    // Token label.
    optional string token_label = 3;
    // Reference to the PIN.
    optional string pin_ref = 4;
  }
  // Certificate authorities keyed by name.
  map<string, PkiCa> cas = 1;
  // Certificates keyed by name.
  map<string, PkiCertificate> certificates = 2;
  // HSM; unset = none.
  Hsm hsm = 3;
}

// RemoteAccessPool mirrors one entry of `vpn.remoteAccess.<name>.pools`.
message RemoteAccessPool {
  // Pool name.
  optional string name = 1;
  // Client pool prefix (CIDR).
  optional string prefix = 2;
  // DNS servers pushed to clients (≤ 4).
  repeated string dns = 3;
}

// RemoteAccessUser mirrors one entry of `vpn.remoteAccess.<name>.users`.
message RemoteAccessUser {
  // Username.
  optional string username = 1;
  // Reference to the password (never the password).
  optional string password_ref = 2;
}

// RemoteAccessProfile mirrors `vpn.remoteAccess.<name>`.
message RemoteAccessProfile {
  // RADIUS settings.
  message Radius {
    // One RADIUS server.
    message Server {
      // IP address or hostname.
      optional string address = 1;
      // UDP port.
      optional uint32 port = 2;
      // Reference to the shared secret.
      optional string secret_ref = 3;
    }
    // Servers (1–8).
    repeated Server servers = 1;
  }
  // Enabled.
  optional bool enabled = 1;
  // Free-text description.
  optional string description = 2;
  // Local address.
  optional string local_addr = 3;
  // Local IKE identity; unset = local address.
  optional string local_id = 4;
  // VRF name.
  optional string vrf = 5;
  // "eap-mschapv2" | "eap-tls" | "eap-radius" | "pubkey".
  optional string auth = 6;
  // Server certificate name in vpn.pki.certificates.
  optional string certificate = 7;
  // Client CA name in vpn.pki.cas (eap-tls / pubkey).
  optional string client_ca = 8;
  // Name in vpn.ipsec.proposals.
  optional string proposal = 9;
  // Client pools (1–16).
  repeated RemoteAccessPool pools = 10;
  // Split-tunnel prefixes (CIDR); empty = full tunnel.
  repeated string split_tunnel = 11;
  // Local EAP users.
  repeated RemoteAccessUser users = 12;
  // RADIUS; unset = none.
  Radius radius = 13;
  // Dead peer detection.
  IpsecDpd dpd = 14;
  // Rekeying.
  IpsecRekey rekey = 15;
  // FIB IKE/ESP run in (outer packets); local_addr is configured in it. `vrf` is the overlay (F4).
  optional string underlay_vrf = 16;
}

// ---------------------------------------------------------------------------------------------
// Feature sections (wave A/B): each feature's new messages and enums go below its own
// `// ----- <task-id> -----` line, framed by blank lines (docs/status/wave-A-hotspots.md C5).
// ---------------------------------------------------------------------------------------------

// ----- F-bonding -----

// Bond mirrors `interfaces.<BondEthernet<id>>.bond` (packages/schema/src/domains/ext/bonding.ts): bond_create2 +
// bond_add_member + sw_interface_set_bond_weight.
message Bond {
  // "lacp" | "xor" | "round-robin" | "active-backup".  (VPP's broadcast mode is not offered, Q1.)
  optional string mode = 1;
  // Transmit hash of xor / lacp bonds: "l2" | "l23" | "l34"; unset = l2 (VPP forces the algorithm of the other modes).
  optional string load_balance = 2;
  // Member interfaces keyed by their logical name (D-069).
  map<string, BondMember> members = 3;
  // Transmit only on members attached to the bond's NUMA node; Zod default false.
  optional bool numa_only = 4;
  // VPP bond id (the interface is BondEthernet<id>); unset = the number in the interface name.
  optional uint32 id = 5;
}

// BondMember mirrors `….bond.members.<ifName>`.
message BondMember {
  // LACP only: do not initiate LACP (is_passive); Zod default false.
  optional bool passive = 1;
  // LACP only: 90 s partner timeout instead of 3 s (is_long_timeout); Zod default false.
  optional bool long_timeout = 2;
  // active-backup only: member weight 1–255 (sw_interface_set_bond_weight); unset = VPP default.
  optional uint32 weight = 3;
}

// BondStateRequest selects bonds by logical name; empty = every bond of this agent.
message BondStateRequest {
  repeated string names = 1;
  // Expected agent owner (as ApplyRequest.owner); empty = the agent's owner.
  string owner = 2;
}

// BondStateResponse is the live bond table of this agent (bonds whose interface carries its owner tag).
message BondStateResponse {
  // One entry per bond, sorted by name.
  repeated BondStatus bonds = 1;
  string owner = 2;
  google.protobuf.Timestamp retrieved_at = 3;
}

// BondStatus is one bond as VPP reports it (sw_bond_interface_dump + sw_interface_dump).
message BondStatus {
  // Logical name (the configuration key, BondEthernet<id>).
  string name = 1;
  // VPP's interface name.
  string vpp_name = 2;
  uint32 sw_if_index = 3;
  // VPP bond id.
  uint32 id = 4;
  // "lacp" | "xor" | "round-robin" | "active-backup".
  string mode = 5;
  // "l2" | "l23" | "l34" | "round-robin" | "active-backup" (the value VPP reports; forced for rr/ab).
  string load_balance = 6;
  bool numa_only = 7;
  // Administrative and link state of the bond interface.
  bool admin_up = 8;
  bool link_up = 9;
  // Number of members, and of members in the active (transmitting) set.
  uint32 member_count = 10;
  uint32 active_member_count = 11;
  // One entry per member, sorted by interface name.
  repeated BondMemberStatus members = 12;
}

// BondMemberStatus is one member of a bond (sw_member_interface_dump, sw_interface_dump, sw_interface_lacp_dump).
message BondMemberStatus {
  // Logical interface name (D-069); VPP's name for a member this agent cannot name.
  string interface = 1;
  uint32 sw_if_index = 2;
  bool passive = 3;
  bool long_timeout = 4;
  // Weight as VPP reports it (0 = never set).
  uint32 weight = 5;
  bool is_local_numa = 6;
  bool admin_up = 7;
  bool link_up = 8;
  // LACP state of the member; unset for bonds in other modes (or when the lacp plugin reports nothing).
  BondLacpState lacp = 9;
}

// BondLacpState is one member's LACP state (sw_interface_lacp_details). State machine values are decoded to the
// lacp plugin's names (rx: initialize|port-disabled|expired|lacp-disabled|defaulted|current; tx: transmit;
// mux: detached|waiting|attached|collecting-distributing; ptx: no-periodic|fast-periodic|slow-periodic|periodic-tx),
// or the number in decimal for a value the plugin does not define.
message BondLacpState {
  string rx_state = 1;
  string tx_state = 2;
  string mux_state = 3;
  string ptx_state = 4;
  BondLacpPort actor = 5;
  BondLacpPort partner = 6;
}

// BondLacpPort is the actor or partner half of an LACP port.
message BondLacpPort {
  uint32 system_priority = 1;
  // System id MAC "aa:bb:cc:dd:ee:ff" (all zero while no partner has been seen).
  string system = 2;
  uint32 key = 3;
  uint32 port_priority = 4;
  uint32 port_number = 5;
  // LACP state octet (802.1AX): bit 0 activity … bit 7 expired.
  uint32 state = 6;
  // The set bits of `state` by name: activity, timeout, aggregation, synchronization, collecting, distributing,
  // defaulted, expired.
  repeated string state_flags = 7;
}

// ----- F-bridge-l2 -----

// BridgeL2Port mirrors `interfaces.<if>.l2` and `interfaces.<if>.subinterfaces.<id>.l2`
// (packages/schema/src/domains/ext/bridge-l2.ts).
message BridgeL2Port {
  // Name of the bridge domain (a key of routing.l2.bridge_domains) the interface is a member of; unset = not bridged.
  optional string bridge_domain = 1;
  // Split-horizon group 0–255, 0 = none (sw_interface_set_l2_bridge.shg); Zod default 0.
  optional uint32 shg = 2;
  // Bridge virtual interface (port_type BVI; a loopback, one per bridge domain); Zod default false.
  optional bool bvi = 3;
  // Unknown-unicast forwarder (port_type UU_FWD); Zod default false.
  optional bool uu_fwd = 4;
  // VLAN tag rewrite on the L2 port (l2_interface_vlan_tag_rewrite); unset = none.
  BridgeL2TagRewrite tag_rewrite = 5;
  // mactime filter enabled on this parent interface (mactime_enable_disable); Zod default false.
  optional bool mac_filter = 6;
}

// BridgeL2TagRewrite mirrors `….l2.tagRewrite`.
message BridgeL2TagRewrite {
  // "push-1" | "push-2" | "pop-1" | "pop-2" | "translate-1-1" | "translate-1-2" | "translate-2-1" | "translate-2-2".
  optional string op = 1;
  // Outer VLAN id 1–4094 written by push / translate; unset for pop.
  optional uint32 tag1 = 2;
  // Inner VLAN id 1–4094 written by push-2 / translate-1-2 / translate-2-2.
  optional uint32 tag2 = 3;
  // Pushed outer tag is 802.1ad (0x88a8) instead of 802.1Q; Zod default false.
  optional bool dot1ad = 4;
}

// BridgeL2Config mirrors `routing.l2`.
message BridgeL2Config {
  // Bridge domains keyed by name.
  map<string, BridgeL2Domain> bridge_domains = 1;
  // L2 cross-connects keyed by the receiving interface (one direction each).
  map<string, BridgeL2Xconnect> xconnects = 2;
  // L3 cross-connects keyed by the receiving interface.
  map<string, BridgeL2L3xc> l3xc = 3;
  // Time-range MAC filter devices keyed by name.
  map<string, BridgeL2MacFilter> mac_filters = 4;
}

// BridgeL2Domain mirrors `routing.l2.bridgeDomains.<name>` (bridge_domain_add_del_v2).
message BridgeL2Domain {
  // VPP bridge-domain id 1–16777215 (tunnels.*.bridge_domain references it).
  optional uint32 id = 1;
  // Flood broadcast / multicast; Zod default true.
  optional bool flood = 2;
  // Flood unknown unicast; Zod default true.
  optional bool uu_flood = 3;
  // Forward by the L2 FIB; Zod default true.
  optional bool forward = 4;
  // Learn source MACs; Zod default true.
  optional bool learn = 5;
  // ARP termination; Zod default false.
  optional bool arp_term = 6;
  // MAC aging in minutes 0–255, 0 = off; Zod default 0.
  optional uint32 mac_age_min = 7;
  // Static L2 FIB entries.
  repeated BridgeL2StaticMac static_macs = 8;
}

// BridgeL2StaticMac mirrors one entry of `….staticMacs` (l2fib_add_del, static).
message BridgeL2StaticMac {
  // MAC address "aa:bb:cc:dd:ee:ff".
  optional string mac = 1;
  // Member interface the MAC is reached through.
  optional string interface = 2;
}

// BridgeL2Xconnect mirrors `routing.l2.xconnects.<rx>` (sw_interface_set_l2_xconnect).
message BridgeL2Xconnect {
  // Transmit interface.
  optional string tx = 1;
}

// BridgeL2L3xc mirrors `routing.l2.l3xc.<rx>` (l3xc_update).
message BridgeL2L3xc {
  // IPv4 paths (one l3xc object per family).
  repeated BridgeL2L3xcPath ipv4_paths = 1;
  // IPv6 paths.
  repeated BridgeL2L3xcPath ipv6_paths = 2;
}

// BridgeL2L3xcPath mirrors one path of an L3 cross-connect (a fib_path).
message BridgeL2L3xcPath {
  // Next-hop address; unset = interface-only path or table lookup.
  optional string next_hop = 1;
  // Egress interface; unset = resolve / look up in the VRF.
  optional string interface = 2;
  // VRF name of the path's table; Zod default "default".
  optional string vrf = 3;
  // Weight 1–255; Zod default 1.
  optional uint32 weight = 4;
  // Preference 0–255; Zod default 0.
  optional uint32 preference = 5;
}

// BridgeL2MacFilter mirrors `routing.l2.macFilters.<name>` (mactime_add_del_range).
message BridgeL2MacFilter {
  // Source MAC "aa:bb:cc:dd:ee:ff" of the device.
  optional string mac = 1;
  // "allow" | "drop"; Zod default "allow".
  optional string action = 2;
  // Weekly ranges; empty = the action applies always (static allow / drop).
  repeated BridgeL2MacFilterRange ranges = 3;
}

// BridgeL2MacFilterRange mirrors one entry of `….ranges`.
message BridgeL2MacFilterRange {
  // Days "mon" … "sun".
  repeated string days = 1;
  // Start "HH:MM".
  optional string start = 2;
  // End "HH:MM" (after start; "24:00" = midnight).
  optional string end = 3;
}

// BridgeDomainStateRequest selects bridge domains by VPP id; empty = every bridge domain of this agent.
message BridgeDomainStateRequest {
  repeated uint32 ids = 1;
  // Expected agent owner (as ApplyRequest.owner); empty = the agent's owner.
  string owner = 2;
}

// BridgeDomainStateResponse is the live bridge-domain table of this agent (bd_tag "<owner>:…").
message BridgeDomainStateResponse {
  repeated BridgeDomainStatus bridge_domains = 1;
  string owner = 2;
  google.protobuf.Timestamp retrieved_at = 3;
}

// BridgeDomainStatus is one bridge domain as VPP reports it (bridge_domain_dump + l2_fib_table_dump).
message BridgeDomainStatus {
  uint32 id = 1;
  // Record name from the bridge-domain tag ("" when VPP holds none, e.g. created by an older agent).
  string name = 2;
  bool flood = 3;
  bool uu_flood = 4;
  bool forward = 5;
  bool learn = 6;
  bool arp_term = 7;
  bool arp_ufwd = 8;
  // MAC aging in minutes, 0 = off.
  uint32 mac_age_min = 9;
  // Logical name of the BVI member ("" = none).
  string bvi = 10;
  // Logical name of the uu-fwd member ("" = none).
  string uu_fwd = 11;
  repeated BridgeDomainMember members = 12;
  // Learned (dynamic) L2 FIB entries.
  uint32 learned_macs = 13;
  // Static, filter and BVI L2 FIB entries.
  uint32 static_macs = 14;
}

// BridgeDomainMember is one member of a bridge domain.
message BridgeDomainMember {
  // Logical interface name (D-069); VPP's name for an interface this agent cannot name by tag.
  string interface = 1;
  uint32 sw_if_index = 2;
  // "normal" | "bvi" | "uu-fwd".
  string port_type = 3;
  // Split-horizon group, 0 = none.
  uint32 shg = 4;
  // VLAN tag rewrite in the configuration spelling ("pop-1", …; "" = none).
  string tag_rewrite = 5;
}

// BridgeDomainMacsRequest pages through one bridge domain's L2 FIB.
message BridgeDomainMacsRequest {
  // VPP bridge-domain id; must be one of this agent's.
  uint32 bd_id = 1;
  // Index of the first entry (entries are ordered by MAC).
  uint32 offset = 2;
  // Page size 1–1000; 0 = 100. More than 1000 fails with INVALID_ARGUMENT.
  uint32 limit = 3;
  // Expected agent owner; empty = the agent's owner.
  string owner = 4;
}

// BridgeDomainMacsResponse is one page of an L2 FIB.
message BridgeDomainMacsResponse {
  repeated BridgeDomainMac macs = 1;
  // Number of entries in the whole table (for paging).
  uint32 total = 2;
  string owner = 3;
  google.protobuf.Timestamp retrieved_at = 4;
}

// BridgeDomainMac is one L2 FIB entry.
message BridgeDomainMac {
  // "aa:bb:cc:dd:ee:ff".
  string mac = 1;
  // Logical interface name ("" for a filter entry).
  string interface = 2;
  uint32 sw_if_index = 3;
  // Static entry (configured); false = learned.
  bool static = 4;
  // Filter (drop) entry.
  bool filter = 5;
  // BVI entry.
  bool bvi = 6;
}

// ----- F-loopback-bvi-gso-lldp-span -----

// MirrorSession mirrors one entry of `interfaces.<name>.mirror`: the interface is the source of the session.
message MirrorSession {
  // Interface that transmits the copies (a monitor port, or a GRE tunnel of type erspan for ERSPAN).
  optional string destination = 1;
  // "rx" | "tx" | "both"; Zod default "both".
  optional string direction = 2;
  // "device" | "l2" (the L2 path: bridge members and cross-connects); Zod default "device".
  optional string level = 3;
}

// NsimService is `services.nsim` (VPP nsim plugin: nsim_configure2, nsim_cross_connect_enable_disable,
// nsim_output_feature_enable_disable).
message NsimService {
  // The nsim cross-connect of two hardware interfaces.
  message CrossConnect {
    optional string a = 1;
    optional string b = 2;
  }
  // One-way delay in milliseconds (> 0; microsecond resolution on VPP).
  optional double delay_ms = 1;
  // Simulated link rate in Mbit/s (> 0).
  optional double bandwidth_mbps = 2;
  // Average packet size 64–9000 bytes (sizes the scheduler wheel); Zod default 1500.
  optional uint32 packet_size = 3;
  // Random loss 0–1 (VPP packets_per_drop = 1 / fraction); Zod default 0.
  optional double drop_fraction = 4;
  // Cross-connect; unset = none.
  CrossConnect cross_connect = 5;
  // Interfaces whose output goes through the simulator.
  repeated string output_interfaces = 6;
}

// LldpNeighborsRequest pages through the LLDP table.
message LldpNeighborsRequest {
  // Index of the first entry (entries are ordered by interface name).
  uint32 offset = 1;
  // Page size 1–1000; 0 = 100. More than 1000 fails with INVALID_ARGUMENT.
  uint32 limit = 2;
  // Expected agent owner; empty = the agent's owner.
  string owner = 3;
}

// LldpNeighborsResponse is one page of the LLDP table.
message LldpNeighborsResponse {
  repeated LldpNeighbor neighbors = 1;
  // Number of entries in the whole table (for paging).
  uint32 total = 2;
  string owner = 3;
  google.protobuf.Timestamp retrieved_at = 4;
}

// LldpNeighbor is one LLDP-enabled interface and the peer heard on it (VPP keeps one peer per interface).
message LldpNeighbor {
  // Logical name of the interface.
  string interface = 1;
  uint32 sw_if_index = 2;
  // A peer was heard since LLDP was enabled (last_heard > 0).
  bool heard = 3;
  // Peer chassis id: "aa:bb:cc:dd:ee:ff" for a MAC address, the text when printable, hex otherwise; "" = none.
  string chassis_id = 4;
  // "chassis-component" | "interface-alias" | "port-component" | "mac-address" | "network-address" |
  // "interface-name" | "local"; "" = none heard.
  string chassis_id_subtype = 5;
  // Peer port id, formatted like chassis_id.
  string port_id = 6;
  // "interface-alias" | "port-component" | "mac-address" | "network-address" | "interface-name" |
  // "agent-circuit-id" | "local"; "" = none heard.
  string port_id_subtype = 7;
  // Time to live the peer advertised, in seconds.
  uint32 ttl = 8;
  // Seconds since the peer was last heard (VPP clock); 0 when never heard.
  double last_heard_sec_ago = 9;
  // Seconds since this interface last sent an LLDPDU; 0 when never.
  double last_sent_sec_ago = 10;
}

// ----- F-vrf-static-ecmp -----

// VrfSourceSelect mirrors one entry of `vrfs.<name>.sourceSelect` (VPP svs plugin).
message VrfSourceSelect {
  // Source prefix in CIDR notation (network address, not /0), IPv4 or IPv6.
  optional string prefix = 1;
  // Ingress VPP interface name (configuration key).
  optional string interface = 2;
}

// ListRoutesRequest selects one page of one FIB table.
message ListRoutesRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // VRF name: a `vrfs` key of the agent's stored desired state, or "" / "default" for table 0. Unknown → NOT_FOUND.
  string vrf = 2;
  // "ipv4", "ipv6" or "" (both, IPv4 first).
  string family = 3;
  // Only routes equal to or more specific than this prefix (CIDR); "" = all.
  string prefix = 4;
  // Only routes whose best FIB source is this one (VPP's name as fib_source_dump reports it, e.g. "API", "interface",
  // "adjacency", "svs"); "" = all. Filtered by VPP (ip_route_v2_dump src). Unknown → INVALID_ARGUMENT.
  string source = 5;
  // Index of the first route of the page in the sorted, filtered list (0-based).
  uint32 offset = 6;
  // Page size; 0 = 100; max 1000.
  uint32 limit = 7;
}

// ListRoutesResponse is one page of the FIB.
message ListRoutesResponse {
  // The page, sorted by family (IPv4 first), then prefix address, then prefix length.
  repeated ListRoutesEntry routes = 1;
  // Routes that matched the filter (the whole table is read by the agent, only this page is returned).
  uint32 total = 2;
  // The owner whose view was returned.
  string owner = 3;
  // VRF name and FIB table id that were read.
  string vrf = 4;
  uint32 table_id = 5;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 6;
}

// ListRoutesEntry is one FIB entry (live state, not configuration).
message ListRoutesEntry {
  // Destination prefix, canonical CIDR.
  string prefix = 1;
  // Best FIB source (VPP name, e.g. "API", "interface", "adjacency", "recursive-resolution", "default-route").
  string source = 2;
  // The entry's paths (load-balance members).
  repeated ListRoutesPath paths = 3;
  // VPP stats index of the entry (combined counters in the stats segment).
  uint32 stats_index = 4;
}

// ListRoutesPath is one path of a FIB entry and what it resolves to (the DPO kind).
message ListRoutesPath {
  // "normal", "local", "drop", "udp-encap", "bier-imp", "icmp-unreach", "icmp-prohibit", "source-lookup", "dvr",
  // "interface-rx" or "classify" (fib_api_path_type).
  string type = 1;
  // Next-hop address; "" when the path has none.
  string next_hop = 2;
  // Egress interface: its logical name (D-069), else VPP's name; "" when none.
  string interface = 3;
  // FIB table the next hop is resolved in (recursive and lookup paths).
  uint32 table_id = 4;
  // Load-balance weight and path preference.
  uint32 weight = 5;
  uint32 preference = 6;
  // Path flags ("resolve-via-host", "resolve-via-attached", "pop-pw-cw").
  repeated string flags = 7;
}

// ----- F-neighbors-ra -----

// Ipv6Ra mirrors `interfaces.<if>.ipv6Ra` (and on sub-interfaces): router advertisements of one interface. The Zod
// defaults are VPP's fresh-interface state (suppressed, lifetime 600, intervals 200/150).
message Ipv6Ra {
  // Do not send RAs; Zod default true (VPP's default).
  optional bool suppress = 1;
  // Managed address configuration flag (M); default false.
  optional bool managed = 2;
  // Other configuration flag (O); default false.
  optional bool other = 3;
  // Router lifetime in seconds, 0 = not a default router, else > max_interval_sec and ≤ 9000; default 600.
  optional uint32 lifetime_sec = 4;
  // Maximum interval between unsolicited RAs, 4–1800 s; default 200.
  optional uint32 max_interval_sec = 5;
  // Minimum interval, 3 s … 0.75 × max_interval_sec; default 150.
  optional uint32 min_interval_sec = 6;
  // Advertised prefixes keyed by IPv6 network ("2001:db8:1::/64").
  map<string, Ipv6RaPrefix> prefixes = 7;
}

// Ipv6RaPrefix mirrors one entry of `ipv6Ra.prefixes` (prefix-information option).
message Ipv6RaPrefix {
  // Valid lifetime in seconds; default 2592000.
  optional uint32 valid_sec = 1;
  // Preferred lifetime in seconds (≤ valid_sec); default 604800.
  optional uint32 preferred_sec = 2;
  // Clear the on-link (L) flag; default false.
  optional bool off_link = 3;
  // Clear the autonomous (A) flag; default false (SLAAC then needs a /64).
  optional bool no_autoconfig = 4;
}

// ProxyArpRange mirrors one entry of `vrfs.<name>.proxyArpRanges` (IPv4 only).
message ProxyArpRange {
  // First address of the range.
  optional string low = 1;
  // Last address of the range (≥ low).
  optional string high = 2;
}

// NeighborsConfig mirrors `routing.neighbors`.
message NeighborsConfig {
  // Static ARP/ND entries (ip_neighbor_add_del, flag STATIC).
  repeated StaticNeighbor static = 1;
  // IPv4 (ARP) table limits (ip_neighbor_config); VPP-wide, globals owner only (D-071).
  NeighborLimits ipv4_limits = 2;
  // IPv6 (ND) table limits; VPP-wide, globals owner only.
  NeighborLimits ipv6_limits = 3;
  // IPv6 duplicate address detection (ip6_dad_enable_disable); present = enabled; globals owner only.
  NeighborDad dad = 4;
}

// StaticNeighbor mirrors one entry of `routing.neighbors.static`.
message StaticNeighbor {
  // Logical interface name (D-069).
  optional string interface = 1;
  // IPv4 or IPv6 address inside a connected subnet of the interface.
  optional string ip = 2;
  // Unicast MAC address.
  optional string mac = 3;
  // Do not install the /32 or /128 host route (IP_API_NEIGHBOR_FLAG_NO_FIB_ENTRY); default false.
  optional bool no_fib_entry = 4;
}

// NeighborLimits mirrors `routing.neighbors.ipv4Limits` / `ipv6Limits`.
message NeighborLimits {
  // Maximum entries; default 50000.
  optional uint32 max_number = 1;
  // Maximum age of learned entries in seconds, 0 = never; default 0.
  optional uint32 max_age_sec = 2;
  // Replace the oldest entry when full; default false.
  optional bool recycle = 3;
}

// NeighborDad mirrors `routing.neighbors.dad`.
message NeighborDad {
  // Probes per tentative address, 1–10; default 1.
  optional uint32 transmits = 1;
  // Delay between probes, 100–10000 ms; default 1000.
  optional uint32 delay_ms = 2;
}

// ListNeighborsRequest filters and pages the live neighbour table (all filters AND-ed).
message ListNeighborsRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // VRF name ("default" for table 0); "" = every VRF.
  string vrf = 2;
  // Logical interface name; "" = every interface this agent can name.
  string interface = 3;
  // "ipv4" | "ipv6"; "" = both.
  string family = 4;
  // "static" | "dynamic"; "" = both.
  string state = 5;
  // Case-insensitive substring of the IP address, the MAC address or the interface name; "" = no filter.
  string search = 6;
  // Sort key: "interface" (default), "ip", "mac", "age", "vrf", "state".
  string sort = 7;
  // Sort descending.
  bool descending = 8;
  // Rows to skip.
  uint32 offset = 9;
  // Page size; 0 = 100, maximum 1000.
  uint32 limit = 10;
}

// ListNeighborsResponse is one page of the neighbour table.
message ListNeighborsResponse {
  // The page, in the requested order.
  repeated NeighborEntry neighbors = 1;
  // Rows matching the filters (all pages).
  uint32 total = 2;
  // The owner whose view was returned.
  string owner = 3;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 4;
}

// NeighborEntry is one ARP/ND entry as VPP reports it (ip_neighbor_details).
message NeighborEntry {
  // Logical interface name.
  string interface = 1;
  // IP address (canonical text).
  string ip = 2;
  // MAC address, lower-case "aa:bb:cc:dd:ee:ff".
  string mac = 3;
  // "ipv4" | "ipv6".
  string family = 4;
  // "static" (configured) | "dynamic" (learned).
  string state = 5;
  // IP_API_NEIGHBOR_FLAG_NO_FIB_ENTRY is set.
  bool no_fib_entry = 6;
  // Seconds since the entry was last confirmed (VPP `age`); 0 for static entries.
  double age_sec = 7;
  // VRF name of the interface's table for this family ("default" for table 0, the table id for tables this agent does
  // not name).
  string vrf = 8;
  // FIB table id of the interface for this family.
  uint32 table_id = 9;
}

// ArpFlushAction deletes the learned (dynamic) ARP/ND entries of one interface, or of every configured interface
// this agent can name; static neighbours are never removed. Output: one line per interface and family, then `done`
// with stats "deleted", "interfaces".
message ArpFlushAction {
  // Logical interface name; "" = every interface of the agent's stored configuration that it can name.
  string interface = 1;
  // "ipv4" | "ipv6"; "" = both.
  string family = 2;
}

// ----- F-rpf-adl-pbr -----

// UrpfConfig mirrors `interfaces.<name>.urpf` (packages/schema/src/domains/ext/rpf-adl-pbr.ts): one uRPF check per
// address family (urpf_update_v2), in one direction.
message UrpfConfig {
  // "loose" | "strict"; unset = no IPv4 check.
  optional string ipv4 = 1;
  // "loose" | "strict"; unset = no IPv6 check.
  optional string ipv6 = 2;
  // "rx" | "tx"; Zod default "rx".
  optional string direction = 3;
}

// AdlConfig mirrors `interfaces.<name>.adl`: the adl-input feature plus its allow-list binding
// (adl_interface_enable_disable, adl_allowlist_enable_disable). Off unless ipv4 or ipv6 is checked.
message AdlConfig {
  // Check IPv4 sources; Zod default false.
  optional bool ipv4 = 1;
  // Check IPv6 sources; Zod default false.
  optional bool ipv6 = 2;
  // VRF whose table holds the allowed sources (local entries); required when a family is checked.
  optional string allow_vrf = 3;
  // Non-IP frames pass unchecked; Zod default true (false is refused on VPP 26.06).
  optional bool default_allow = 4;
}

// PbrConfig mirrors `routing.pbr`: ABF policies keyed by name and their interface attachments.
message PbrConfig {
  // Policies keyed by name (objectName, no "#").
  map<string, PbrPolicy> policies = 1;
  // Attachments, unique by (policy, interface, family).
  repeated PbrAttachment attachments = 2;
}

// PbrPolicy is one ABF policy: packets its ACL permits are forwarded over the paths (abf_policy_add_del).
message PbrPolicy {
  // Name of an entry of `acl.lists`.
  optional string acl = 1;
  // Order among the policies attached to one interface, lower first (abf_itf_attach priority); Zod default 100.
  optional uint32 priority = 2;
  // Forwarding paths, 1–255.
  repeated PbrPath paths = 3;
}

// PbrPath is one forwarding path of a PbrPolicy (fib_path).
message PbrPath {
  // Next-hop address; unset = none.
  optional string address = 1;
  // Egress interface; unset = none.
  optional string interface = 2;
  // Table the next hop is resolved in (or the packet looked up in, without address and interface); Zod default "default".
  optional string vrf = 3;
  // Weight 1–255; Zod default 1.
  optional uint32 weight = 4;
}

// PbrAttachment binds a policy to an interface for one address family (abf_itf_attach_add_del).
message PbrAttachment {
  // Name of an entry of `routing.pbr.policies`.
  optional string policy = 1;
  // Interface the packets are received on.
  optional string interface = 2;
  // "ipv4" | "ipv6"; Zod default "ipv4".
  optional string family = 3;
}

// AutoSdlConfig mirrors `services.autoSdl` (auto_sdl_config, VPP-global; no getter).
message AutoSdlConfig {
  // Enable automatic deny entries; Zod default false.
  optional bool enabled = 1;
  // Hits from one source before its deny entry is created; Zod default 5.
  optional uint32 threshold = 2;
  // Lifetime of an automatic entry in seconds (auto_sdl_config.remove_timeout); Zod default 300.
  optional uint32 remove_timeout_sec = 3;
}

// ----- F-object-model -----

// FqdnObjectStateRequest selects FQDN address objects by name.
message FqdnObjectStateRequest {
  // Object names (keys of objects.addresses); empty = every FQDN object the agent holds.
  repeated string names = 1;
  // Same rules as ApplyRequest.owner.
  string owner = 2;
}

// FqdnObjectStateResponse is one snapshot of the agent's FQDN resolver.
message FqdnObjectStateResponse {
  // One entry per FQDN address object the agent holds (applied configuration), sorted by name.
  repeated FqdnObjectState objects = 1;
  // The owner whose view was returned.
  string owner = 2;
  // When the snapshot was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 3;
}

// FqdnObjectState is the resolver's runtime view of one FQDN address object (not configuration).
message FqdnObjectState {
  // Object name (key of objects.addresses).
  string name = 1;
  // The hostname that is resolved (objects.addresses.<name>.fqdn).
  string fqdn = 2;
  // A and AAAA answers in use, canonical text (net/netip), IPv4 before IPv6, each family sorted.
  // After a failed refresh these are the last good answers; empty = the object expands to nothing.
  repeated string addresses = 3;
  // Last successful resolution (at least one address family answered); unset = never resolved.
  google.protobuf.Timestamp last_resolved = 4;
  // Next scheduled query.
  google.protobuf.Timestamp next_refresh = 5;
  // The latest attempt's failure ("no such host", a timeout, …); empty = it succeeded.
  string error = 6;
  // Consecutive failed attempts since the last success (0 after a success).
  uint32 failures = 7;
}

// ----- F-acl -----

// AclStateRequest selects what AclState reports.
message AclStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // acl.lists.<name> whose rule page is wanted; empty = no rule page (list summaries only).
  string list = 2;
  // Page over the list's configuration rules in sequence order, after the filter.
  uint32 offset = 3;
  // Page size 1–1000; 0 = 100. More than 1000 is INVALID_ARGUMENT.
  uint32 limit = 4;
  // Optional rule filter.
  AclStateFilter filter = 5;
  // Also report the ACLs bound to every interface (acl_interface_list_dump, MACIP binding).
  bool include_interfaces = 6;
}

// AclStateFilter narrows the rule page.
message AclStateFilter {
  // Only these configuration rule sequences (at most 1000); empty = every rule.
  repeated uint32 sequences = 1;
  // Only rules whose counters show at least one packet (empty page when counters are unavailable).
  bool hits_only = 2;
}

// AclStateResponse is one snapshot of the ACL plugin state of this owner.
message AclStateResponse {
  // The owner whose view was returned.
  string owner = 1;
  // When the snapshot was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 2;
  // True when per-rule hit counters are readable: acl.stats-enable was applied to this VPP by the
  // globals owner (D-071) and the stats segment answers. False → packets/bytes are 0.
  bool counters_available = 3;
  // Why counters are unavailable (empty when available), e.g. "not the globals owner".
  string counters_reason = 4;
  // Summaries of this owner's L3/L4 ACLs in VPP, sorted by name (only `list` when it is set).
  repeated AclListState lists = 5;
  // The requested page of `list`'s configuration rules, in sequence order.
  repeated AclRuleState rules = 6;
  // Number of configuration rules of `list` that match the filter (the paging total).
  uint32 total = 7;
  // Interfaces with at least one ACL or a MACIP ACL bound (include_interfaces), by sw_if_index.
  repeated AclInterfaceState interfaces = 8;
  // Summaries of this owner's MACIP ACLs in VPP, sorted by name (list summaries only).
  repeated AclListState macip_lists = 9;
}

// AclListState is the runtime summary of one ACL of this owner.
message AclListState {
  // List name (key of acl.lists / acl.macip).
  string name = 1;
  // The VPP acl_index.
  uint32 acl_index = 2;
  // Rules of the ACL in VPP.
  uint32 vpp_rules = 3;
  // True when the agent can map VPP rules to configuration rules (it projected exactly what VPP holds).
  bool mapping_known = 4;
  // Configuration rules of the list (mapping_known), including those that rendered no VPP rule.
  uint32 config_rules = 5;
  // Hits of all rules (L3/L4 ACLs with counters available; MACIP ACLs have no counters).
  uint64 packets = 6;
  // Bytes of all rules.
  uint64 bytes = 7;
}

// AclRuleStatus says whether and why a configuration rule rendered VPP rules.
enum AclRuleStatus {
  // Not known (the mapping to VPP rules is unknown).
  ACL_RULE_STATUS_UNSPECIFIED = 0;
  // Rendered as vpp_rules VPP rules.
  ACL_RULE_STATUS_APPLIED = 1;
  // enabled: false — not rendered.
  ACL_RULE_STATUS_DISABLED = 2;
  // Its schedule is not active now — not rendered until it is.
  ACL_RULE_STATUS_SCHEDULE_INACTIVE = 3;
  // Expanded to nothing (e.g. an FQDN object without addresses, or no common address family).
  ACL_RULE_STATUS_EMPTY = 4;
  // F-rule-expiry: its expiresAt has passed — not rendered; the configuration keeps it (extend or delete it).
  ACL_RULE_STATUS_EXPIRED = 5;
}

// AclRuleState is the runtime state of one configuration rule.
message AclRuleState {
  // Configuration rule sequence.
  uint32 sequence = 1;
  // Whether it is rendered.
  AclRuleStatus status = 2;
  // Number of VPP rules it expanded to (addresses × families × services).
  uint32 vpp_rules = 3;
  // Index of its first VPP rule in the ACL (its rules are contiguous); meaningful when vpp_rules > 0.
  uint32 first_vpp_rule = 4;
  // Hits summed over its VPP rules and all workers.
  uint64 packets = 5;
  // Bytes summed over its VPP rules and all workers.
  uint64 bytes = 6;
}

// AclInterfaceState is the ACL binding of one VPP interface.
message AclInterfaceState {
  // Logical interface name (D-069); another owner's interface by its VPP name.
  string interface = 1;
  // VPP sw_if_index.
  uint32 sw_if_index = 2;
  // Inbound ACLs in evaluation order (first match wins), other owners' included.
  repeated AclBoundAcl input = 3;
  // Outbound ACLs in evaluation order, other owners' included.
  repeated AclBoundAcl output = 4;
  // The MACIP ACL bound inbound; unset = none.
  AclBoundAcl macip = 5;
}

// AclBoundAcl is one ACL in an interface's list.
message AclBoundAcl {
  // VPP acl_index.
  uint32 acl_index = 1;
  // List name when the ACL is this owner's; empty for another owner's or an untagged ACL.
  string name = 2;
  // The VPP tag as stored ("<owner>:<name>" for managed ACLs).
  string tag = 3;
  // True when the ACL is not this owner's (D-066: preserved, never changed by this agent).
  bool foreign = 4;
}

// ----- F-host-acl-nftables -----

// HostAclSettings mirrors `acl.hostSettings` (packages/schema/src/domains/ext/host-acl-nftables.ts):
// how the agent renders the input chains of the host firewall (table `inet ngfw`).
message HostAclSettings {
  // Policy of every input chain the agent renders: "accept" | "drop"; unset = "accept".
  optional string default_input = 1;
  // Accept ICMP and ICMPv6 in input chains before the rules; unset = true. IPv6 neighbour and
  // router discovery is accepted either way.
  optional bool allow_icmp = 2;
  // The anti-lockout rule protecting management SSH/HTTPS.
  HostAclAntiLockout anti_lockout = 3;
}

// HostAclAntiLockout mirrors `acl.hostSettings.antiLockout`: management TCP ports from these sources
// on these interfaces are accepted at the top of every input chain; with `enabled` false a commit
// whose own rules would drop that traffic fails validation (rule acl.host-anti-lockout).
message HostAclAntiLockout {
  // Render the anti-lockout rule; unset = true.
  optional bool enabled = 1;
  // Management source prefixes (CIDR); empty = any source.
  repeated string sources = 2;
  // Linux interfaces management traffic arrives on (≤ 15 chars each); empty = any interface.
  repeated string interfaces = 3;
  // Management TCP ports 1–65535; empty = 22 and 443.
  repeated uint32 ports = 4;
}

// HostAclStateRequest asks for the rendered host firewall.
message HostAclStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// HostAclStateResponse is one snapshot of the host firewall table as the kernel reports it
// (`nft -j list table inet <table>`), annotated with what the agent rendered.
message HostAclStateResponse {
  // The owner whose view was returned.
  string owner = 1;
  // When the snapshot was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 2;
  // nftables table name in family inet: "ngfw" for the product agent, "ngfw_<owner>" for test slots.
  string table = 3;
  // How the agent drives the table: "apply" (root network namespace), "netns" (a test slot's
  // namespace) or "check" (validated with `nft -c` only, never loaded).
  string mode = 4;
  // The table exists in the kernel.
  bool present = 5;
  // The kernel table equals the last rendering the agent applied (false = drift; the next
  // Apply or resync re-renders it).
  bool in_sync = 6;
  // Named sets (expanded address objects), sorted by name.
  repeated HostAclSetState sets = 7;
  // Base chains in evaluation order (hook, then priority, then name).
  repeated HostAclChainState chains = 8;
}

// HostAclSetState is one named set of the table.
message HostAclSetState {
  // nftables set name ("a4_<object>" / "a6_<object>").
  string name = 1;
  // "ipv4_addr" | "ipv6_addr".
  string type = 2;
  // The address object or group it was expanded from ("" when unknown).
  string object = 3;
  // Elements as canonical prefixes, sorted.
  repeated string elements = 4;
}

// HostAclChainState is one base chain of the table (one per enabled attachment).
message HostAclChainState {
  // nftables chain name.
  string name = 1;
  // "input" | "output" | "forward".
  string hook = 2;
  // Chain priority -500..500.
  int32 priority = 3;
  // "accept" | "drop".
  string policy = 4;
  // The host list attached (acl.hostAttachments[].list); "" when unknown.
  string list = 5;
  // Rules in evaluation order.
  repeated HostAclRuleState rules = 6;
}

// HostAclRuleState is one nftables rule with its counters.
message HostAclRuleState {
  // "established" | "loopback" | "icmp" | "anti-lockout" | "rule" | "unknown" (not rendered by
  // this agent, or its rendering is unknown).
  string kind = 1;
  // kind=rule: the host list (acl.host.<list>).
  string list = 2;
  // kind=rule: the rule's sequence number.
  uint32 sequence = 3;
  // kind=rule: JSON pointer of the rule in the applied document (/acl/host/<list>/rules/<i>).
  string pointer = 4;
  // The rule as rendered (nftables syntax, without the counter); "" when unknown.
  string text = 5;
  // "accept" | "drop" | "reject".
  string verdict = 6;
  // The rule's nftables comment (its identity: "ngfw:<list>:<sequence>/<n>:<hash>").
  string comment = 7;
  // Counter values.
  uint64 packets = 8;
  uint64 bytes = 9;
}

// ----- F-nat44-ed-sessions -----

// NatSessionFilter narrows NatSessions. Every set field must match (AND); an unset field matches all.
message NatSessionFilter {
  // Inside (pre-translation) IPv4 address. It selects one user, so the agent dumps only that user.
  optional string inside_address = 1;
  // Outside (translated) IPv4 address.
  optional string outside_address = 2;
  // External (remote) host IPv4 address.
  optional string external_address = 3;
  // L4 port (ICMP: the identifier); matches the inside, outside or external port.
  optional uint32 port = 4;
  // "tcp" | "udp" | "icmp" | an IP protocol number in decimal.
  optional string protocol = 5;
  // Inside VRF name ("default" = table 0; a decimal string is a raw table id).
  optional string vrf = 6;
}

// NatSessionsRequest selects one page of the session table.
message NatSessionsRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // Index of the first session of the page in the (filtered) table order: users by (VRF, address),
  // then VPP's order of that user's sessions.
  uint32 offset = 2;
  // Page size; 0 = 100; more than 1000 fails with INVALID_ARGUMENT.
  uint32 limit = 3;
  // Filter; unset = every session of this owner.
  NatSessionFilter filter = 4;
  // Session table (F-nat44-ei-64-66-nptv6); UNSPECIFIED = NAT44-ED. NAT44_EI takes the same filter as ED;
  // NAT64 accepts only `filter.protocol` (any other filter field is INVALID_ARGUMENT).
  optional NatSessionVariant variant = 5;
}

// NatSession is one NAT44-ED translation as VPP reports it (state, not configuration).
message NatSession {
  // Inside endpoint (the user).
  string inside_address = 1;
  // Inside L4 port (ICMP: identifier).
  uint32 inside_port = 2;
  // Outside (translated) endpoint.
  string outside_address = 3;
  // Outside L4 port.
  uint32 outside_port = 4;
  // External (remote) host.
  string external_address = 5;
  // External host port.
  uint32 external_port = 6;
  // External host after twice-NAT (as the inside host addresses it). VPP reports it only for twice-NAT
  // sessions: "0.0.0.0" without twice-NAT.
  string external_nat_address = 7;
  // External host port after twice-NAT; 0 without twice-NAT.
  uint32 external_nat_port = 8;
  // "tcp" | "udp" | "icmp" | the IP protocol number in decimal.
  string protocol = 9;
  // Inside VRF name: "default" for table 0, the configured VRF name, else the table id in decimal.
  string vrf = 10;
  // Inside FIB table id.
  uint32 table_id = 11;
  // Created by a static mapping.
  bool static = 12;
  // Twice-NAT session.
  bool twice_nat = 13;
  // VPP considers the session timed out (not yet reclaimed).
  bool timed_out = 14;
  // Seconds since the last packet (VPP-relative).
  uint64 idle_seconds = 15;
  // Bytes in both directions.
  uint64 bytes = 16;
  // Packets in both directions.
  uint64 packets = 17;
}

// NatSessionsResponse is one page. It never carries more than the requested limit.
message NatSessionsResponse {
  // The page, in table order.
  repeated NatSession sessions = 1;
  // Offset of the next page; unset on the last page.
  optional uint32 next_offset = 2;
  // Users (inside hosts) of this owner with sessions that the filter's inside_address / vrf select.
  uint64 total_users = 3;
  // Sessions that match the filter (a lower bound when `truncated`).
  uint64 total_sessions = 4;
  // A per-call cap stopped the agent (users dumped, sessions looked at): with a filter on outside/external
  // address, port or protocol total_sessions is then a lower bound; either way the page may be
  // short — continue at next_offset.
  bool truncated = 5;
  // The owner whose view was returned.
  string owner = 6;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 7;
  // The session table this page comes from (F-nat44-ei-64-66-nptv6): EI or NAT64; unset = NAT44-ED.
  optional NatSessionVariant variant = 8;
}

// NatSummaryRequest has only the owner.
message NatSummaryRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// NatPoolUsage is the use of one owned NAT44-ED pool.
message NatPoolUsage {
  // First address of a range pool; for an interface pool the interface's first IPv4 address ("" if none).
  string first_address = 1;
  // Last address of a range pool (equal to first_address for one address and for interface pools).
  string last_address = 2;
  // Logical interface name of an interface pool; "" for a range pool.
  string interface = 3;
  // Tenant VRF name of a range pool ("default" for table 0); "" for an interface pool.
  string vrf = 4;
  // Twice-NAT pool.
  bool twice_nat = 5;
  // Number of addresses in the pool.
  uint32 addresses = 6;
  // Sessions whose outside address is in this pool (a lower bound when the response is truncated).
  uint64 sessions = 7;
}

// NatSummaryResponse is one snapshot of this owner's NAT44-ED use.
message NatSummaryResponse {
  // nat44-ed is enabled on VPP.
  bool enabled = 1;
  // VPP's session limit per worker thread (running config); 0 when disabled.
  uint32 session_limit = 2;
  // Users (inside hosts) of this owner with sessions.
  uint64 total_users = 3;
  // Sessions of those users.
  uint64 total_sessions = 4;
  // Of which created by static mappings.
  uint64 static_sessions = 5;
  // Owned pools (range pools, then interface pools).
  repeated NatPoolUsage pools = 6;
  // Session count per protocol name ("tcp", "udp", "icmp", or the number in decimal).
  map<string, uint64> sessions_by_protocol = 7;
  // The per-pool and per-protocol counts stopped at the agent's per-call caps (users dumped, sessions
  // looked at): they are lower bounds. The user / session / static totals are always complete.
  bool truncated = 8;
  // The owner whose view was returned.
  string owner = 9;
  // When the summary was computed (agent clock); the agent serves one computation for up to 30 s.
  google.protobuf.Timestamp retrieved_at = 10;
}

// NatSessionKillAction deletes one NAT44-ED session (nat44_del_session). An ED session is keyed by the
// full 5-tuple, so the external endpoint is required. The inside address must belong to this owner.
message NatSessionKillAction {
  // "tcp" | "udp" | "icmp".
  string protocol = 1;
  // Inside IPv4 address.
  string inside_address = 2;
  // Inside L4 port (ICMP: identifier).
  uint32 inside_port = 3;
  // External (remote) host IPv4 address as the inside host addresses it: the session's i2o flow, which
  // nat44_del_session looks up — external_nat_address of a twice-NAT session, external_address otherwise.
  string external_address = 4;
  // External host port as the inside host addresses it (external_nat_port of a twice-NAT session).
  uint32 external_port = 5;
  // Inside VRF name; "" = "default" (a decimal string is a raw table id).
  string vrf = 6;
  // Session table (F-nat44-ei-64-66-nptv6); UNSPECIFIED = NAT44-ED. NAT44_EI deletes by the inside endpoint
  // (protocol, inside address/port, VRF; the external endpoint is optional and ignored by VPP). NAT64 has no
  // session delete in VPP 26.06: INVALID_ARGUMENT.
  optional NatSessionVariant variant = 7;
}

// ----- F-nat44-ei-64-66-nptv6 -----

// NatSessionVariant selects the NAT session table of NatSessions / NatSessionKillAction (docs/contracts/proto.md §11
// "F-nat44-ei-64-66-nptv6"). The NatSession fields keep their names; for NAT64 they carry: inside_* = the IPv6
// client (il_addr/il_port), outside_* = the IPv4 pool endpoint (ol_addr/ol_port), external_* = the IPv4 remote
// (or_addr/r_port), external_nat_* = the remote as the IPv6 client sees it (ir_addr = NAT64 prefix + IPv4, r_port).
enum NatSessionVariant {
  // Unset: NAT44-ED (the F-nat44-ed-sessions behaviour).
  NAT_SESSION_VARIANT_UNSPECIFIED = 0;
  // NAT44 endpoint-dependent (nat44-ed).
  NAT_SESSION_VARIANT_ED = 1;
  // NAT44 endpoint-independent (nat44-ei).
  NAT_SESSION_VARIANT_EI = 2;
  // NAT64 (nat64_st_dump; read-only).
  NAT_SESSION_VARIANT_NAT64 = 3;
}

// ----- P11 -----

// ----- F-wireguard -----

// WireguardStateRequest selects the WireGuard interfaces to report.
message WireguardStateRequest {
  // VPP interface names ("wg<instance>") to include; empty = every WireGuard interface of this owner.
  repeated string interfaces = 1;
  // Same rules as ApplyRequest.owner.
  string owner = 2;
}

// WireguardStateResponse is one snapshot of this owner's WireGuard interfaces.
message WireguardStateResponse {
  // One entry per interface, sorted by name.
  repeated WireguardInterfaceState interfaces = 1;
  // The owner whose view was returned.
  string owner = 2;
  // When the dumps were taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 3;
  // Whether the agent's peer-event subscription is running (last_handshake is only observed while it is).
  bool events_active = 4;
}

// WireguardInterfaceState is the live state of one wg<N> interface (not configuration).
message WireguardInterfaceState {
  // VPP name and logical name: "wg<instance>".
  string name = 1;
  // user_instance.
  uint32 instance = 2;
  // VPP sw_if_index (runtime handle).
  uint32 sw_if_index = 3;
  // The interface's public key (std base64; a public value). The private key is never read back.
  string public_key = 4;
  // UDP listen port.
  uint32 listen_port = 5;
  // Source (listen) address.
  string listen_address = 6;
  // Administrative and link state (sw_interface_details flags).
  bool admin_up = 7;
  bool link_up = 8;
  // Interface counters from the stats segment (VPP 26.06 has no per-peer counters; 0 when the stats
  // segment is unavailable).
  uint64 rx_packets = 9;
  uint64 rx_bytes = 10;
  uint64 tx_packets = 11;
  uint64 tx_bytes = 12;
  // Peers, sorted by public key.
  repeated WireguardPeerState peers = 13;
}

// WireguardPeerState is the live state of one peer (wireguard_peers_dump; no preshared key).
message WireguardPeerState {
  // Std base64 public key (the peer's identity; the configuration names peers in the document only).
  string public_key = 1;
  // VPP peer index (runtime handle, reused after a delete).
  uint32 peer_index = 2;
  // wireguard_peer_flags: ESTABLISHED (handshake completed) and STATUS_DEAD (no handshake answer).
  bool established = 3;
  bool dead = 4;
  // The endpoint VPP currently sends to (learnt from the last authenticated packet); "" = none yet.
  string endpoint = 5;
  uint32 endpoint_port = 6;
  // Last time this agent observed the peer become established (peer event); unset = not observed
  // since the agent started. VPP 26.06 exposes no handshake timestamp.
  google.protobuf.Timestamp last_handshake = 7;
  // Configured persistent keepalive (seconds, 0 = off) and allowed IPs (canonical, sorted).
  uint32 persistent_keepalive_sec = 8;
  repeated string allowed_ips = 9;
}

// ----- P12 -----

// InterfaceLcp mirrors `interfaces.<name>.lcp`: the linux-cp pair of a VPP interface (a Linux tap/tun FRR runs on).
message InterfaceLcp {
  // Linux name of the host interface (≤ 15 bytes); unset = the VPP name.
  optional string host_if_name = 1;
  // "tap" | "tun"; Zod default "tap".
  optional string host_if_type = 2;
  // Network namespace of the host interface; unset = the linux-cp default namespace.
  optional string netns = 3;
}

// Pppoe mirrors `interfaces.<name>.pppoe` (F-pppoe-client): a PPPoE client dialled by pppd on a linux-cp tap of the
// parent, the ISP-assigned address/routes mirrored into VPP. The password is a secret reference, never inline.
message Pppoe {
  // Dial the session; Zod default true.
  optional bool enabled = 1;
  // Engine interface the session runs over; unset = this interface (set for a VLAN sub-interface WAN).
  optional string parent = 2;
  // PPP username (PAP/CHAP).
  optional string username = 3;
  // Reference to a stored password secret ("password/<name>"); never the password.
  optional string password_ref = 4;
  // RFC 2516 Service-Name to request; unset = accept any AC.
  optional string service_name = 5;
  // PPPoE payload MTU; Zod default 1492.
  optional uint32 mtu = 6;
  // Clamp forwarded TCP MSS to fit the MTU; Zod default true.
  optional bool mss_clamp = 7;
  // Install a default route via the session; Zod default true.
  optional bool default_route = 8;
  // Use the DNS servers the peer sends (IPCP); Zod default false.
  optional bool dns_from_peer = 9;
  // IPv6: "off" | "slaac" | "dhcpv6"; Zod default "off".
  optional string ipv6 = 10;
  // Reconnect policy.
  PppoeReconnect reconnect = 11;
}

// PppoeReconnect mirrors `interfaces.<name>.pppoe.reconnect`.
message PppoeReconnect {
  // Seconds to wait before redialling after the session drops; Zod default 5.
  optional uint32 holdoff_sec = 1;
  // Give up after this many failed dials in a row; 0 = forever; Zod default 0.
  optional uint32 max_fail = 2;
}

// PppoeReconnectRequest asks the agent to redial one PPPoE client now.
message PppoeReconnectRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // Configuration interface name of the PPPoE client (the `interfaces.<name>` key).
  string interface = 2;
}

// PppoeReconnectResponse says whether the redial was accepted (the session comes up asynchronously).
message PppoeReconnectResponse {
  // The agent accepted the request and is redialling.
  bool accepted = 1;
  // Human-readable detail ("no PPPoE client on 'eth0'", "redialling"…).
  string message = 2;
}

// PppoeSessionState is the live state of a PPPoE client session (not configuration); attached to InterfaceState.
message PppoeSessionState {
  // "down" | "dialing" | "up" | "failed".
  string phase = 1;
  // PPPoE session id (RFC 2516) once negotiated; 0 when down.
  uint32 session_id = 2;
  // MAC of the access concentrator (peer); empty when down.
  string ac_mac = 3;
  // AC name from the PADO tag; empty when unknown.
  string ac_name = 4;
  // Local (ISP-assigned) IPv4 address in CIDR, e.g. "203.0.113.5/32"; empty when none.
  string local_ipv4 = 5;
  // Peer (gateway) IPv4 address; empty when none.
  string peer_ipv4 = 6;
  // ISP-assigned IPv6 address/prefix; empty when none.
  string ipv6 = 7;
  // DNS servers the peer sent (IPCP), sorted; empty when none.
  repeated string dns = 8;
  // When the current session came up (agent clock); unset when down.
  google.protobuf.Timestamp since = 9;
  // Consecutive failed dials since the last success.
  uint32 fail_count = 10;
  // Last error text (pppd exit reason), empty when none.
  string last_error = 11;
}

// RoutingStateRequest selects the parts of RoutingState to read (the BGP table, counts and pairs are always returned).
message RoutingStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // Keys of registered FRR state readers to return (e.g. "bgpSummary"); unknown key → INVALID_ARGUMENT.
  repeated string readers = 2;
  // RIB lookup: FRR's RIB entries of these prefixes (canonical CIDR, at most 100) in `rib_vrf`.
  repeated string rib_prefixes = 3;
  // VRF of the RIB lookup: a VRF name of the document ("" = default).
  string rib_vrf = 4;
}

// RoutingStateResponse is the live routing-daemon state. Nothing in it is configuration and nothing holds a secret.
message RoutingStateResponse {
  // The owner whose view was returned.
  string owner = 1;
  // When FRR was read (agent clock).
  google.protobuf.Timestamp retrieved_at = 2;
  // FRR answered on its vty sockets. false = FRR is not running for this agent; `error` says why and the FRR fields
  // below are empty (lcp_pairs is still filled from VPP).
  bool frr_running = 3;
  // FRR version ("10.7.1").
  string frr_version = 4;
  // Why FRR (or VPP for lcp_pairs) could not be read; "" = no error.
  string error = 5;
  // BGP instances (one per VRF with `router bgp`), sorted by VRF.
  repeated BgpInstanceState bgp = 6;
  // FRR RIB counts "<family>/<vrf>/<protocol>" → routes (family "ipv4" | "ipv6").
  map<string, uint32> rib_counts = 7;
  // This owner's linux-cp pairs (lcp_itf_pair_get), sorted by interface.
  repeated RoutingLcpPair lcp_pairs = 8;
  // Requested readers' JSON output by key (redacted, bounded by the reader's scoped command).
  map<string, string> readers = 9;
  // RIB lookup result: FRR's entries for the requested prefixes that exist, sorted by prefix then protocol.
  repeated RoutingRibEntry rib = 10;
}

// BgpInstanceState is one `router bgp` instance (`show bgp vrf all summary json`).
message BgpInstanceState {
  // VRF name ("default" for the default VRF).
  string vrf = 1;
  // Local AS.
  uint32 asn = 2;
  // Router id in use.
  string router_id = 3;
  // Neighbours, sorted by address.
  repeated BgpNeighborState neighbors = 4;
}

// BgpNeighborState is one BGP neighbour's live session state.
message BgpNeighborState {
  // Neighbour address (the `routing.bgp.neighbors` key).
  string address = 1;
  // Remote AS.
  uint32 remote_as = 2;
  // FRR state name: Idle, Connect, Active, OpenSent, OpenConfirm, Established (Idle (Admin) = shutdown).
  string state = 3;
  // Seconds in Established (0 when not established).
  uint64 uptime_sec = 4;
  // Prefixes accepted from the peer, summed over the families.
  uint32 prefixes_received = 5;
  // Prefixes announced to the peer, summed over the families.
  uint32 prefixes_sent = 6;
  // Session drops since the daemon started (FRR connectionsDropped): the flap count.
  uint32 flaps = 7;
  // Sessions established since the daemon started.
  uint32 established = 8;
  // Description from the configuration (FRR echo).
  string description = 9;
  // Per-family counters ("ipv4Unicast", "ipv6Unicast").
  repeated BgpNeighborAfiState afis = 10;
  // BGP messages received / sent.
  uint64 messages_received = 11;
  uint64 messages_sent = 12;
}

// BgpNeighborAfiState is a neighbour's per-family prefix counters.
message BgpNeighborAfiState {
  // "ipv4Unicast" | "ipv6Unicast".
  string afi = 1;
  uint32 prefixes_received = 2;
  uint32 prefixes_sent = 3;
}

// RoutingLcpPair is one linux-cp pair of this owner (live VPP state).
message RoutingLcpPair {
  // VPP-side interface (logical name, D-069).
  string interface = 1;
  // Linux interface name.
  string host_if_name = 2;
  // "tap" | "tun".
  string host_if_type = 3;
  // Network namespace ("" = the default namespace).
  string netns = 4;
  // sw_if_index of the VPP-side interface and of VPP's end of the host tap; Linux ifindex of the host interface.
  uint32 phy_sw_if_index = 5;
  uint32 host_sw_if_index = 6;
  uint32 vif_index = 7;
}

// RoutingRibEntry is one entry of FRR's RIB (`show ip[v6] route vrf <vrf> <prefix> json`).
message RoutingRibEntry {
  // Canonical prefix.
  string prefix = 1;
  // VRF name.
  string vrf = 2;
  // FRR protocol ("bgp", "static", "connected", "kernel", "ospf" …).
  string protocol = 3;
  // Best route of its prefix / installed in the kernel FIB.
  bool selected = 4;
  bool installed = 5;
  // Administrative distance and metric.
  uint32 distance = 6;
  uint32 metric = 7;
  // Next hops.
  repeated RoutingRibNextHop next_hops = 8;
}

// RoutingRibNextHop is one next hop of a RoutingRibEntry.
message RoutingRibNextHop {
  // Gateway address ("" = directly connected).
  string address = 1;
  // Linux interface name.
  string interface = 2;
  // Active in FRR / installed in the FIB.
  bool active = 3;
  bool fib = 4;
}

// ----- F-kea-dhcp-relay -----

// DhcpLeasesRequest selects Kea leases (paged by the agent) or, with `interface` set, the VPP DHCPv4 client state
// of that interface.
message DhcpLeasesRequest {
  // Must be empty or equal to the agent's owner (§6).
  string owner = 1;
  // Kea server name (`services.dhcp.servers` key): only leases of its subnets; empty = every server.
  string server = 2;
  // "ipv4" or "ipv6"; empty = both families.
  string family = 3;
  // 1-based page number; 0 = 1.
  uint32 page = 4;
  // Leases per page, 1–1000; 0 = 100.
  uint32 page_size = 5;
  // Case-insensitive substring of the address, hardware address, client id / DUID or hostname; empty = all.
  string filter = 6;
  // Logical interface name: return the VPP DHCPv4 client state of this interface (`client`) instead of Kea leases.
  string interface = 7;
}

// DhcpLease is one Kea lease (lease4-get-page / lease6-get-page).
message DhcpLease {
  // "ipv4" or "ipv6".
  string family = 1;
  // Leased address (IA_PD: the delegated prefix without its length).
  string address = 2;
  // Client hardware address, lower-case "aa:bb:cc:dd:ee:ff" (empty when Kea has none).
  string hw_address = 3;
  // DHCPv4 client identifier as colon-separated hex (empty when the client sent none).
  string client_id = 4;
  // DHCPv6 DUID as colon-separated hex.
  string duid = 5;
  // Client hostname (option 12 / FQDN) as Kea stored it.
  string hostname = 6;
  // `services.dhcp.servers` key of the lease's subnet; empty when the subnet is not one of this agent's.
  string server = 7;
  // Subnet name (`…servers.<server>.subnets` key); empty when unknown.
  string subnet = 8;
  // Kea subnet id.
  uint32 subnet_id = 9;
  // Valid lifetime in seconds.
  uint32 valid_lifetime_sec = 10;
  // Expiry: client last transaction time + valid lifetime.
  google.protobuf.Timestamp expires_at = 11;
  // Kea lease state: "default", "declined", "expired-reclaimed" or "state-<n>".
  string state = 12;
  // DHCPv6 lease type "IA_NA" / "IA_PD"; empty for DHCPv4.
  string lease_type = 13;
  // Delegated prefix length (IA_PD); 0 otherwise.
  uint32 prefix_len = 14;
}

// DhcpSubnetUsage is the pool usage of one Kea subnet (statistic-get-all: total/assigned/declined addresses;
// DHCPv6 counts IA_NA addresses).
message DhcpSubnetUsage {
  // `services.dhcp.servers` key.
  string server = 1;
  // Subnet name.
  string subnet = 2;
  // Subnet prefix (CIDR).
  string prefix = 3;
  // Kea subnet id.
  uint32 subnet_id = 4;
  // Addresses in the subnet's pools.
  uint64 total = 5;
  // Addresses leased.
  uint64 assigned = 6;
  // Addresses declined by clients.
  uint64 declined = 7;
}

// DhcpServerStatus is the state of one Kea daemon (kea-dhcp4 or kea-dhcp6) as the agent reads it over the
// daemon's own unix control socket (D-079).
message DhcpServerStatus {
  // "ipv4" (kea-dhcp4) or "ipv6" (kea-dhcp6).
  string family = 1;
  // The control socket answers.
  bool running = 2;
  // The configuration the daemon runs (or loads when it starts) binds at least one interface.
  bool active = 3;
  // "start" when the daemon must be started for its configuration to take effect; empty otherwise. Derived on every
  // read, so it is repeated until acted on (D-079).
  string action_required = 4;
  // Seconds since the daemon (re)loaded its configuration (status-get "reload"); 0 when unknown.
  uint64 reload_sec = 5;
  // Per-subnet pool usage of this agent's subnets.
  repeated DhcpSubnetUsage subnets = 6;
  // Why the daemon could not be read; empty on success.
  string error = 7;
}

// DhcpClientLease is the VPP DHCPv4 client of one interface (dhcp_client_dump; status, never desired state).
message DhcpClientLease {
  // Logical interface name.
  string interface = 1;
  // A DHCPv4 client is configured on the interface.
  bool configured = 2;
  // Client state: "DISCOVER", "REQUEST" or "BOUND"; empty when not configured.
  string state = 3;
  // Leased address in CIDR notation; empty until bound.
  string address = 4;
  // Default router from the lease; empty when none.
  string router = 5;
  // DNS servers from the lease.
  repeated string dns_servers = 6;
  // Hostname the client sends.
  string hostname = 7;
  // MAC address the client uses, lower-case.
  string mac = 8;
}

// DhcpLeasesResponse is one page of leases plus the daemons' status, or the client state of one interface.
message DhcpLeasesResponse {
  // The agent's owner.
  string owner = 1;
  // The page of leases (sorted by family, then address).
  repeated DhcpLease leases = 2;
  // Page number returned (1-based).
  uint32 page = 3;
  // Page size used.
  uint32 page_size = 4;
  // Leases matching server/family/filter among those read (see truncated).
  uint32 total = 5;
  // The agent stopped reading at its bound (100 000 leases per family): more leases exist than total counts.
  bool truncated = 6;
  // kea-dhcp4 and kea-dhcp6 status (only the requested family when family is set).
  repeated DhcpServerStatus servers = 7;
  // The DHCPv4 client state when the request named an interface.
  DhcpClientLease client = 8;
  // When the agent read the state.
  google.protobuf.Timestamp retrieved_at = 9;
}

// ----- F-unbound-chrony-syslog -----

// SyslogTls is the TLS part of one remote-syslog target (management.syslog[i].tls). Material is
// referenced (D-051), never inline.
message SyslogTls {
  // CA certificate that verifies the collector ("cert/<name>").
  optional string ca_ref = 1;
  // Client certificate ("cert/<name>"); goes with key_ref.
  optional string cert_ref = 2;
  // Client private key ("key/<name>"); goes with cert_ref.
  optional string key_ref = 3;
  // "x509/name" | "x509/certvalid"; unset = x509/name.
  optional string auth_mode = 4;
  // Accepted collector certificate names (x509/name); empty = the collector host name.
  repeated string permitted_peers = 5;
}

// DnsLookupAction resolves one name through VPP's DNS cache (dns_resolve_name). Works only where
// the VPP dns plugin is enabled (the globals owner, D-071). Output: one line per address, then
// done with stats "ipv4" / "ipv6".
message DnsLookupAction {
  // DNS name (≤ 253 characters of [A-Za-z0-9.-_]; validated by the agent).
  string name = 1;
  // Deadline in milliseconds; 0 = 5000; max 30000.
  uint32 timeout_ms = 2;
}

// ServiceDaemonAction is a start/restart request a renderer returned and persisted (D-079): the
// files are written, the daemon applies them only after the action. It stays until the daemon's
// process started after the request.
message ServiceDaemonAction {
  // "unbound" | "chronyd" | "rsyslogd".
  string daemon = 1;
  // systemd unit the product acts on ("unbound", "chrony", "rsyslog").
  string unit = 2;
  // "start" | "restart".
  string action = 3;
  // Why the action is needed.
  string reason = 4;
}

// DnsStateRequest selects the owner (same rules as ApplyRequest.owner).
message DnsStateRequest {
  string owner = 1;
}

// DnsStateResponse is one snapshot of the Unbound instance (not configuration).
message DnsStateResponse {
  // The owner whose view was returned.
  string owner = 1;
  // When the snapshot was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 2;
  // True when unbound answers on its control socket.
  bool running = 3;
  // unbound-control status ("version", "verbosity", "uptime" …).
  map<string, string> status = 4;
  // unbound-control stats_noreset ("total.num.queries" …).
  map<string, string> stats = 5;
  // list_forwards.
  repeated DnsZoneState forwards = 6;
  // list_stubs.
  repeated DnsZoneState stubs = 7;
  // list_local_zones.
  repeated DnsLocalZoneState local_zones = 8;
  // list_local_data, one record per line.
  repeated string local_data = 9;
  // list_local_data exceeded the capture limit; local_data is then empty.
  bool local_data_truncated = 10;
  // Pending start/restart requests of the Unbound renderer.
  repeated ServiceDaemonAction pending_actions = 11;
  // The VPP DNS cache as this agent applies it.
  DnsVppCacheState vpp_cache = 12;
  // Path of the rendered unbound.conf.
  string config_path = 13;
  // A read error (the snapshot is partial); empty when complete.
  string error = 14;
}

// DnsZoneState is one list_forwards / list_stubs line.
message DnsZoneState {
  string zone = 1;
  // "forward" | "stub".
  string kind = 2;
  // "+i", "+t" … flags as unbound prints them.
  repeated string flags = 3;
  repeated string addresses = 4;
}

// DnsLocalZoneState is one list_local_zones line.
message DnsLocalZoneState {
  string zone = 1;
  string type = 2;
}

// DnsVppCacheState: VPP's dns plugin has no getter (D-063), so the state is what this agent applied.
message DnsVppCacheState {
  // The running configuration enables the VPP cache.
  bool configured = 1;
  // This agent is the globals owner and programs it (D-071); false = another agent does, or none.
  bool applied_by_this_agent = 2;
  // Upstream name servers as configured.
  repeated string upstreams = 3;
}

// NtpStateRequest selects the owner.
message NtpStateRequest {
  string owner = 1;
}

// NtpStateResponse is one snapshot of the chronyd instance.
message NtpStateResponse {
  string owner = 1;
  google.protobuf.Timestamp retrieved_at = 2;
  // True when chronyd answers on its command socket.
  bool running = 3;
  // chronyc -c tracking (unset when not running).
  NtpTracking tracking = 4;
  // chronyc -c sources.
  repeated NtpSource sources = 5;
  // chronyc -c sourcestats.
  repeated NtpSourceStats source_stats = 6;
  // chronyc -c serverstats (name → value).
  map<string, string> server_stats = 7;
  // Pending start/restart requests of the chrony renderer.
  repeated ServiceDaemonAction pending_actions = 8;
  // Path of the rendered chrony.conf.
  string config_path = 9;
  // A read error; empty when complete.
  string error = 10;
}

// NtpTracking mirrors `chronyc -c tracking` (seconds, ppm).
message NtpTracking {
  string ref_id = 1;
  string ref_name = 2;
  int32 stratum = 3;
  double ref_time = 4;
  double system_time = 5;
  double last_offset = 6;
  double rms_offset = 7;
  double frequency = 8;
  double residual_freq = 9;
  double skew = 10;
  double root_delay = 11;
  double root_dispersion = 12;
  double update_interval = 13;
  string leap = 14;
}

// NtpSource mirrors one `chronyc -c sources` row.
message NtpSource {
  // "^" server, "=" peer, "#" refclock.
  string mode = 1;
  // "*" selected, "+" combined, "-" not combined, "?" unusable, "x" falseticker, "~" variable.
  string state = 2;
  string name = 3;
  int32 stratum = 4;
  int32 poll = 5;
  // Reachability register (octal).
  string reach = 6;
  string last_rx = 7;
  double offset = 8;
  double measured = 9;
  double error = 10;
}

// NtpSourceStats mirrors one `chronyc -c sourcestats` row.
message NtpSourceStats {
  string name = 1;
  int32 np = 2;
  int32 nr = 3;
  int32 span = 4;
  double frequency = 5;
  double freq_skew = 6;
  double offset = 7;
  double std_dev = 8;
}

// SyslogStateRequest selects the owner.
message SyslogStateRequest {
  string owner = 1;
}

// SyslogStateResponse is one snapshot of the remote-syslog export (rsyslog impstats).
message SyslogStateResponse {
  string owner = 1;
  google.protobuf.Timestamp retrieved_at = 2;
  // One entry per rendered target, in management.syslog order.
  repeated SyslogTargetState targets = 3;
  // Messages submitted per rsyslog input (imuxsock, imtcp …).
  map<string, int64> inputs = 4;
  // Pending restart request of the rsyslog renderer (test slots: the slot instance).
  repeated ServiceDaemonAction pending_actions = 5;
  // Path of the rendered export file.
  string config_path = 6;
  // Why counters are unavailable ("no impstats yet"); empty when complete.
  string error = 7;
}

// SyslogTargetState is one export action as impstats reports it.
message SyslogTargetState {
  // Index in management.syslog.
  uint32 index = 1;
  // rsyslog action name ("ngfw_export_<i>_<hash>").
  string action = 2;
  // "<host>:<port>".
  string target = 3;
  // "udp" | "tcp".
  string protocol = 4;
  // False when impstats has no record of the action (rsyslog not running or not reporting yet).
  bool reported = 5;
  int64 processed = 6;
  int64 failed = 7;
  int64 suspended = 8;
  int64 suspended_duration = 9;
  int64 resumed = 10;
  int64 queue_size = 11;
  int64 enqueued = 12;
  int64 full = 13;
  int64 discarded_full = 14;
  int64 discarded_nf = 15;
  int64 max_queue_size = 16;
}

// SyslogEntriesRequest is one log-explorer query of the local journal.
message SyslogEntriesRequest {
  string owner = 1;
  // Oldest entry considered; unset = one hour ago. Never older than 30 days.
  google.protobuf.Timestamp since = 2;
  // Minimum severity ("emergency" … "debug"); "" = all.
  string severity = 3;
  // Syslog facility name ("kern", "daemon", "local0" …); "" = all.
  string facility = 4;
  // Case-insensitive substring of the message or identifier (≤ 128 printable characters; a plain
  // string, never a pattern); "" = all.
  string query = 5;
  // 1-based page, newest first; 0 = 1.
  uint32 page = 6;
  // Entries per page; 0 = 100; max 500.
  uint32 page_size = 7;
}

// SyslogEntriesResponse is one page of journal entries, newest first.
message SyslogEntriesResponse {
  string owner = 1;
  google.protobuf.Timestamp retrieved_at = 2;
  repeated SyslogEntry entries = 3;
  uint32 page = 4;
  uint32 page_size = 5;
  // Matching entries within the scanned window.
  uint32 total = 6;
  // The scan stopped at its bound (the newest `scanned` entries since `since` were searched).
  bool truncated = 7;
  // Entries read from the journal.
  uint32 scanned = 8;
  // "journald".
  string source = 9;
}

// SyslogEntry is one journal entry.
message SyslogEntry {
  google.protobuf.Timestamp time = 1;
  // "emergency" … "debug" ("" when the entry has no priority).
  string severity = 2;
  // Facility name ("" when unknown).
  string facility = 3;
  // SYSLOG_IDENTIFIER (or _COMM).
  string identifier = 4;
  uint32 pid = 5;
  string hostname = 6;
  // _SYSTEMD_UNIT ("" when none).
  string unit = 7;
  // The message (non-UTF-8 bytes replaced, at most 4096 characters).
  string message = 8;
}

// ----- F-det44-map-dslite-cnat -----

// PnatConfig mirrors `nat.pnat` (VPP pnat plugin; IPv4 only).
message PnatConfig {
  // Bindings (match tuple → rewrite tuple).
  repeated PnatBinding bindings = 1;
  // Bindings attached to an interface's input or output path.
  repeated PnatAttachment attachments = 2;
}

// PnatBinding is one named binding; the agent keys it by its match tuple.
message PnatBinding {
  // Binding name (configuration-only label; attachments reference it).
  optional string name = 1;
  // Match tuple; unset fields are wildcards.
  PnatMatch match = 2;
  // Rewrite tuple; unset fields are unchanged.
  PnatRewrite rewrite = 3;
}

// PnatMatch is the match tuple of a binding.
message PnatMatch {
  // "tcp" | "udp" | "icmp"; unset = any.
  optional string proto = 1;
  // Source IPv4 address; unset = any.
  optional string src = 2;
  // Source port (tcp/udp only); unset = any.
  optional uint32 sport = 3;
  // Destination IPv4 address; unset = any.
  optional string dst = 4;
  // Destination port (tcp/udp only); unset = any.
  optional uint32 dport = 5;
}

// PnatRewrite is the rewrite tuple of a binding.
message PnatRewrite {
  // New source IPv4 address.
  optional string src = 1;
  // New source port.
  optional uint32 sport = 2;
  // New destination IPv4 address.
  optional string dst = 3;
  // New destination port.
  optional uint32 dport = 4;
}

// PnatAttachment applies a binding on an interface.
message PnatAttachment {
  // Binding name (PnatBinding.name).
  optional string binding = 1;
  // VPP interface name.
  optional string interface = 2;
  // "input" | "output".
  optional string point = 3;
}

// Det44SessionsRequest selects one page of one inside user's DET44 sessions.
message Det44SessionsRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // Inside IPv4 address of the user (required: VPP dumps sessions per user).
  string user = 2;
  // Index of the first session of the page in VPP's order.
  uint32 offset = 3;
  // Page size; 0 = 100; more than 1000 fails with INVALID_ARGUMENT.
  uint32 limit = 4;
}

// Det44Session is one DET44 session as VPP reports it.
message Det44Session {
  // Inside L4 port.
  uint32 inside_port = 1;
  // Outside (translated) L4 port.
  uint32 outside_port = 2;
  // External (remote) host.
  string external_address = 3;
  // External host port.
  uint32 external_port = 4;
  // VPP session state ("unknown" | "udp-active" | "tcp-syn-sent" | "tcp-established" | "tcp-fin-wait" |
  // "tcp-close-wait" | "tcp-closing" | "tcp-last-ack" | "tcp-closed" | "icmp-active", else the number).
  string state = 5;
  // Expiry (VPP time, seconds).
  uint32 expire = 6;
}

// Det44SessionsResponse is one page.
message Det44SessionsResponse {
  // The page.
  repeated Det44Session sessions = 1;
  // Offset of the next page; unset on the last page.
  optional uint32 next_offset = 2;
  // Sessions of this user.
  uint64 total_sessions = 3;
  // The user's outside address (det44_forward).
  string outside_address = 4;
  // First port of the user's outside port block.
  uint32 port_lo = 5;
  // Last port of the user's outside port block.
  uint32 port_hi = 6;
  // The owner whose view was returned.
  string owner = 7;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 8;
}

// Det44LookupRequest is a forward (inside → outside) or reverse (outside → inside) lookup.
message Det44LookupRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // Forward: the inside IPv4 address. Exactly one of inside_address / outside_address.
  optional string inside_address = 2;
  // Reverse: the outside IPv4 address.
  optional string outside_address = 3;
  // Reverse: the outside port (required with outside_address).
  optional uint32 outside_port = 4;
}

// Det44LookupResponse is the deterministic mapping.
message Det44LookupResponse {
  // Inside IPv4 address.
  string inside_address = 1;
  // Outside IPv4 address.
  string outside_address = 2;
  // First port of the inside address's outside block (forward only; 0 on reverse).
  uint32 port_lo = 3;
  // Last port of that block (forward only; 0 on reverse).
  uint32 port_hi = 4;
}

// CnatSessionsRequest selects one page of the CNAT session table.
message CnatSessionsRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
  // Index of the first session of the page in VPP's order.
  uint32 offset = 2;
  // Page size; 0 = 100; more than 1000 fails with INVALID_ARGUMENT.
  uint32 limit = 3;
}

// CnatSession is one CNAT session (its 5-tuple as VPP keys it).
message CnatSession {
  // Destination address (the VIP for a forward session).
  string dst_address = 1;
  // Destination port.
  uint32 dst_port = 2;
  // Source address.
  string src_address = 3;
  // Source port.
  uint32 src_port = 4;
  // "tcp" | "udp" | "icmp" | the protocol number in decimal.
  string protocol = 5;
  // Index of the translation that created it (~0 = none).
  uint32 translation_index = 6;
  // VPP session flags.
  uint32 flags = 7;
}

// CnatSessionsResponse is one page. The CNAT session table is VPP-global and untagged: the globals owner sees every
// row; any other owner only rows whose src_address or dst_address is in its own address scope.
message CnatSessionsResponse {
  // The page.
  repeated CnatSession sessions = 1;
  // Offset of the next page; unset on the last page.
  optional uint32 next_offset = 2;
  // Sessions visible to this owner, counted after the scope filter (a lower bound when truncated).
  uint64 total_sessions = 3;
  // The per-call cap (rows looked at, before the scope filter) stopped the dump.
  bool truncated = 4;
  // The owner whose view was returned.
  string owner = 5;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 6;
}

// Det44SessionCloseAction closes one DET44 session.
message Det44SessionCloseAction {
  // "in" (by the inside endpoint, det44_close_session_in) | "out" (by the outside endpoint, det44_close_session_out).
  string direction = 1;
  // Inside (direction in) or outside (direction out) IPv4 address.
  string address = 2;
  // Inside or outside port.
  uint32 port = 3;
  // External (remote) host IPv4 address.
  string external_address = 4;
  // External host port.
  uint32 external_port = 5;
}

// CnatSessionPurgeAction purges every CNAT session (a VPP-global table; the globals owner only).
message CnatSessionPurgeAction {}

