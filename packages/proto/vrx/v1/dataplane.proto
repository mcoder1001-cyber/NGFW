// QosPolicerStateRequest selects policers of this agent.
message QosPolicerStateRequest {
  // Must be empty or equal to the agent's owner (§6).
  string owner = 1;
  // Policer names without the owner prefix (a `services.qos.policers` key, or "shaper:<name>"); empty = all.
  repeated string names = 2;
}

// QosPolicerCounter is one colour's counter of a policer, summed over VPP's threads.
message QosPolicerCounter {
  // Packets.
  uint64 packets = 1;
  // Bytes.
  uint64 bytes = 2;
}

// QosPolicerStatus is one policer of this owner as VPP reports it (policer_dump_v2 + stats segment).
message QosPolicerStatus {
  // Name without the owner prefix: a `services.qos.policers` key, or "shaper:<name>" for a shaper.
  string name = 1;
  // "policer" | "shaper".
  string kind = 2;
  // VPP pool index (changes when the policer is re-created).
  uint32 index = 3;
  // "1r2c" | "1r3c-rfc2697" | "2r3c-rfc2698" | "2r3c-rfc4115" | "2r3c-mef5cf1" (the configuration spelling).
  string type = 4;
  // "kbps" | "pps".
  string rate_unit = 5;
  // Committed information rate.
  uint32 cir = 6;
  // Excess / peak information rate (0 for single-rate policers).
  uint32 eir = 7;
  // Committed burst (bytes for kbps, packets for pps).
  uint64 cb = 8;
  // Excess burst.
  uint64 eb = 9;
  // Committed token bucket fill (policer_details current_bucket, VPP's internal token units).
  uint32 current_bucket = 10;
  // Committed token bucket limit.
  uint32 current_limit = 11;
  // Extended (excess / peak) token bucket fill.
  uint32 extended_bucket = 12;
  // Extended token bucket limit.
  uint32 extended_limit = 13;
  // Conforming traffic.
  QosPolicerCounter conform = 14;
  // Exceeding traffic.
  QosPolicerCounter exceed = 15;
  // Violating traffic (three-colour policers).
  QosPolicerCounter violate = 16;
}

// QosPolicerStateResponse lists the selected policers, sorted by name.
message QosPolicerStateResponse {
  // Policers.
  repeated QosPolicerStatus policers = 1;
  // The agent's owner.
  string owner = 2;
  // When VPP was read.
  google.protobuf.Timestamp retrieved_at = 3;
  // Non-empty when the stats segment could not be read: the counters are then zero, the rest is valid.
  string counters_error = 4;
}

// QosPolicerResetRequest names the policer whose token buckets are refilled.
message QosPolicerResetRequest {
  // Must be empty or equal to the agent's owner (§6).
  string owner = 1;
  // Policer name without the owner prefix (a `services.qos.policers` key, or "shaper:<name>").
  string name = 2;
}

// QosPolicerResetResponse confirms a reset.
message QosPolicerResetResponse {
  // The agent's owner.
  string owner = 1;
  // The policer.
  string name = 2;
  // VPP pool index of the policer that was reset.
  uint32 index = 3;
  // When the reset was sent.
  google.protobuf.Timestamp reset_at = 4;
}

// ----- F-host-stack -----

// HostStackService is `services.hostStack` (F-host-stack, D-085): the API-configurable part of VPP's host stack.
message HostStackService {
  // Required state of the session layer (rule-table engine); set only by the globals owner (D-071).
  optional bool enabled = 1;
  // Application namespaces by id.
  map<string, HostStackNamespace> namespaces = 2;
  // Session rules (the host-stack "firewall"), each with a unique tag.
  repeated HostStackSessionRule session_rules = 3;
  // TCP source-address pool of one VRF (write-only in VPP, no delete).
  HostStackTcpSource tcp_source_addresses = 4;
  // http_static server (agent opt-in only, cannot be disabled via the API).
  HostStackHttpStatic http_static = 5;
}

// HostStackNamespace is one application namespace.
message HostStackNamespace {
  // Namespace secret as a `key/<name>` reference (D-051); refused until the secret channel exists.
  optional string secret_ref = 1;
  // VPP interface the namespace is bound to.
  optional string interface = 2;
  // VRF (ip4/ip6 fib).
  optional string vrf = 3;
}

// HostStackSessionRule is one session rule.
message HostStackSessionRule {
  // Unique tag (the agent prefixes its owner in VPP).
  optional string tag = 1;
  // "global" | "local".
  optional string scope = 2;
  // "tcp" | "udp".
  optional string transport = 3;
  // Local prefix (canonical CIDR).
  optional string local = 4;
  // Local port; unset = any.
  optional uint32 local_port = 5;
  // Remote prefix (canonical CIDR, same family).
  optional string remote = 6;
  // Remote port; unset = any.
  optional uint32 remote_port = 7;
  // "allow" | "deny" | "redirect".
  optional string action = 8;
  // App index for action redirect.
  optional uint32 redirect_app_index = 9;
  // App namespace id; unset = default namespace.
  optional string app_namespace = 10;
}

// HostStackTcpSource is the TCP source-address pool of one VRF.
message HostStackTcpSource {
  // First address.
  optional string first = 1;
  // Last address.
  optional string last = 2;
  // VRF.
  optional string vrf = 3;
}

// HostStackHttpStatic is the http_static server.
message HostStackHttpStatic {
  // Enabled.
  optional bool enabled = 1;
  // Web root, under /var/lib/vrx/www/.
  optional string www_root_path = 2;
  // Listen URI, e.g. tcp://0.0.0.0/80.
  optional string uri = 3;
  // Cache size in MiB.
  optional uint32 cache_size_mb = 4;
}

// HostStackStateRequest asks for the host-stack snapshot.
message HostStackStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// HostStackRuleState is one session rule as VPP reports it (this owner's tags only).
message HostStackRuleState {
  // Tag without the owner prefix.
  string tag = 1;
  // "global" | "local" | "both".
  string scope = 2;
  // "tcp" | "udp" | other VPP transport names.
  string transport = 3;
  // Local prefix.
  string local = 4;
  // Local port (0 = any).
  uint32 local_port = 5;
  // Remote prefix.
  string remote = 6;
  // Remote port (0 = any).
  uint32 remote_port = 7;
  // "allow" | "deny" | "redirect".
  string action = 8;
  // VPP app namespace indexes the rule applies to.
  repeated uint32 appns_indexes = 9;
}

// HostStackStateResponse is one host-stack snapshot.
message HostStackStateResponse {
  // Session layer answered the rules dump (VPP has no getter; true when the dump works).
  bool session_enabled = 1;
  // Why session_enabled is false or unknown (e.g. "session layer disabled"), empty otherwise.
  string session_detail = 2;
  // App namespaces this agent applied on the running VPP (write-only in VPP: from the agent's records).
  repeated string namespaces = 3;
  // This owner's session rules.
  repeated HostStackRuleState rules = 4;
  // Number of session rules in VPP (all owners).
  uint32 rule_count_total = 5;
  // Snapshot time.
  google.protobuf.Timestamp retrieved_at = 6;
}

// ----- F-snmp -----

// SnmpView is one VACM view of `services.snmp.views` (F-snmp, D-086).
message SnmpView {
  // Included subtrees (numeric OID or a symbolic name of the renderer's allow-list).
  repeated string include = 1;
  // Excluded subtrees.
  repeated string exclude = 2;
}

// SnmpMonitors is `services.snmp.monitors` (UCD-SNMP dskTable / laTable thresholds).
message SnmpMonitors {
  // Disk monitors.
  repeated SnmpMonitorDisk disks = 1;
  // Load-average monitor.
  SnmpMonitorLoad load = 2;
}

// SnmpMonitorDisk is one `disk <path> <min>%` monitor.
message SnmpMonitorDisk {
  // Absolute mount path.
  optional string path = 1;
  // Minimum free space in percent (1–99); unset = 10.
  optional uint32 min_percent = 2;
}

// SnmpMonitorLoad is the `load <1m> <5m> <15m>` monitor.
message SnmpMonitorLoad {
  // 1-minute load threshold.
  optional uint32 max1 = 1;
  // 5-minute load threshold.
  optional uint32 max5 = 2;
  // 15-minute load threshold.
  optional uint32 max15 = 3;
}

// SnmpSubagent is `services.snmp.subagent`: the VRX-MIB AgentX subagent of the agent.
message SnmpSubagent {
  // Register VRX-MIB with snmpd over AgentX (default true when SNMP is enabled).
  optional bool enabled = 1;
}

// SnmpStateRequest selects the agent (owner check as in Retrieve).
message SnmpStateRequest {
  // Expected agent owner; empty = any.
  string owner = 1;
}

// SnmpStateResponse is the snmpd stage state (F-snmp). Credentials are named, never shown.
message SnmpStateResponse {
  // An enabled services.snmp is applied.
  bool configured = 1;
  // The local agent answered the state query.
  bool reachable = 2;
  // Endpoint the query used ("127.0.0.1:161").
  string endpoint = 3;
  // Credential the query used, by name ("v3 user noc", "v2c community").
  string credential = 4;
  // System group values read back from snmpd.
  string sys_name = 5;
  string sys_descr = 6;
  string sys_location = 7;
  string sys_contact = 8;
  // sysUpTime in hundredths of a second.
  uint64 sys_up_time = 9;
  // Query error (redacted), when not reachable.
  string error = 10;
  // Configured engine id (hex; empty = daemon default).
  string engine_id = 11;
  // Daemon action the agent is waiting for ("snmpd needs restart …", D-079); empty = none.
  string pending_action = 12;
  // VRX-MIB subagent registered with the AgentX master.
  bool subagent_registered = 13;
  // Registrations since the agent started (re-registrations after snmpd restarts included).
  uint64 subagent_registrations = 14;
  // Last subagent session error.
  string subagent_error = 15;
}

// ----- F-ipfix-sflow -----

// IpfixStateRequest asks for the flow-export state.
message IpfixStateRequest {
  // Same rules as ApplyRequest.owner.
  string owner = 1;
}

// IpfixStateResponse is one snapshot of the flow-export state.
message IpfixStateResponse {
  // Exporters, exporter 0 first, then additional exporters by collector.
  repeated IpfixExporterState exporters = 1;
  // flowprobe.params as VPP has it; unset while no record flag is set.
  IpfixFlowprobeParamsState flowprobe_params = 2;
  // Interfaces of this owner with flowprobe enabled, sorted by interface.
  repeated IpfixFlowprobeInterfaceState flowprobe_interfaces = 3;
  // sFlow global parameters as VPP has them (always reported; VPP defaults when never set).
  IpfixSflowGlobalState sflow_global = 4;
  // Interfaces of this owner with sFlow enabled (learned mapping only, docs/vpp-code-track.md V17).
  repeated IpfixSflowInterfaceState sflow_interfaces = 5;
  // sFlow node counters from the stats segment (/err/sflow/*), summed over workers, sorted by name.
  repeated IpfixCounter sflow_counters = 6;
  // Whether this agent is the VPP-globals owner (D-071): it sets exporter 0, flowprobe.params and
  // sflow.global; otherwise it only requires them.
  bool globals_owner = 7;
  // Human-readable notes (e.g. stats segment unavailable, sFlow export needs hsflowd).
  repeated string notes = 8;
  // The owner whose view was returned.
  string owner = 9;
  // When the dump was taken (agent clock).
  google.protobuf.Timestamp retrieved_at = 10;
}

// IpfixExporterState is one IPFIX exporter as VPP has it.
message IpfixExporterState {
  // Configuration key (services.ipfix.exporters.<name>) when the agent knows it; empty otherwise.
  string name = 1;
  // Exporter 0 (the one flowprobe records use).
  bool default_exporter = 2;
  // Collector address.
  string collector = 3;
  // Collector UDP port.
  uint32 collector_port = 4;
  // Source address.
  string source_address = 5;
  // VRF name (table name of vrf_id; "default" for table 0).
  string vrf = 6;
  // Path MTU.
  uint32 path_mtu = 7;
  // Template interval in seconds.
  uint32 template_interval_sec = 8;
  // UDP checksum.
  bool udp_checksum = 9;
  // Stats index VPP returned when this agent created the exporter (additional exporters only);
  // unset when not known (e.g. after an agent restart).
  optional uint32 stat_index = 10;
}

// IpfixFlowprobeParamsState is flowprobe_get_params.
message IpfixFlowprobeParamsState {
  // Record L2 fields.
  bool record_l2 = 1;
  // Record L3 fields.
  bool record_l3 = 2;
  // Record L4 fields.
  bool record_l4 = 3;
  // Active timer in seconds.
  uint32 active_timer_sec = 4;
  // Passive timer in seconds.
  uint32 passive_timer_sec = 5;
}

// IpfixFlowprobeInterfaceState is flowprobe on one interface.
message IpfixFlowprobeInterfaceState {
  // Logical interface name (D-069).
  string interface = 1;
  // "ip4" | "ip6" | "l2".
  string which = 2;
  // "rx" | "tx" | "both".
  string direction = 3;
}

// IpfixSflowGlobalState is the sFlow plugin's global parameters.
message IpfixSflowGlobalState {
  // Sampling rate 1 in N (0 = off).
  uint32 sampling_n = 1;
  // Counter polling interval in seconds.
  uint32 polling_interval_sec = 2;
  // Sampled header bytes.
  uint32 header_bytes = 3;
  // "rx" | "tx" | "both".
  string direction = 4;
  // Drop monitoring.
  bool drop_monitoring = 5;
}

// IpfixSflowInterfaceState is sFlow sampling on one interface.
message IpfixSflowInterfaceState {
  // Logical interface name (D-069).
  string interface = 1;
  // VPP hw_if_index (sflow_interface_details).
  uint32 hw_if_index = 2;
}

// IpfixCounter is one named counter.
message IpfixCounter {
  // Stats segment name, e.g. "/err/sflow/sflow packets processed".
  string name = 1;
  // Value, summed over workers.
  uint64 value = 2;
}

