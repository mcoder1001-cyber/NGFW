# /etc/sysctl.d/80-ngfw-dataplane.conf — NGFW data-plane sysctls (P14 deploy/image common; values from
# scripts/30-tune-dataplane.sh and docs/09-os-packages.md §4). Sorts after the vpp package's 80-vpp.conf, so these win.
# NOT set here on purpose:
#   net.core.rmem_max / wmem_max  ngfw-meta's /usr/lib/sysctl.d/60-ngfw-netlink.conf sets 256 MiB for linux-nl
#                                 (PENDING-vpp-host-hardening option B); 30-tune's 64 MiB here would LOWER it
#   vm.nr_hugepages               reserved on the kernel command line (kernel/cmdline); 80-vpp.conf's 1024 matches it
vm.max_map_count = 3096000
vm.overcommit_memory = 0
kernel.shmmax = 68719476736
fs.file-max = 2097152
