# Installed as a site; the package never enables an insecure API listener.
map $http_upgrade $vrx_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/vrx/tls/server.crt;
    ssl_certificate_key /etc/vrx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/vrx/web;
    index index.html;
    client_max_body_size 16m;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vrx_connection_upgrade;
        proxy_read_timeout 90s;
    }
    location /restconf {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /.well-known/host-meta {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
