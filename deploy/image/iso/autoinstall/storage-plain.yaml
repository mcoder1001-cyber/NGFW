# curtin storage config generated from common/layout.tsv (plain); tests/run.sh checks they agree.
# grub_device sits on the ESP (UEFI); vrx-early.sh moves it to the disk when the installer booted in BIOS mode.
storage:
  swap:
    size: 0
  config:
    - {type: disk, id: disk0, match: {size: largest}, ptable: gpt, wipe: superblock-recursive, preserve: false, grub_device: false}
    - {type: partition, id: part-bios, device: disk0, number: 1, size: 1M, flag: bios_grub, preserve: false}
    - {type: partition, id: part-vrx-efi, device: disk0, number: 2, size: 1G, flag: boot, grub_device: true, partition_name: VRX-EFI, preserve: false}
    - {type: format, id: fmt-vrx-efi, volume: part-vrx-efi, fstype: fat32, label: VRX-EFI, preserve: false}
    - {type: partition, id: part-vrx-roota, device: disk0, number: 3, size: 20G, partition_name: vrx-rootA, preserve: false}
    - {type: format, id: fmt-vrx-roota, volume: part-vrx-roota, fstype: ext4, label: vrx-rootA, preserve: false}
    - {type: partition, id: part-vrx-rootb, device: disk0, number: 4, size: 20G, partition_name: vrx-rootB, preserve: false}
    - {type: format, id: fmt-vrx-rootb, volume: part-vrx-rootb, fstype: ext4, label: vrx-rootB, preserve: false}
    - {type: partition, id: part-vrx-log, device: disk0, number: 5, size: 20G, partition_name: vrx-log, preserve: false}
    - {type: format, id: fmt-vrx-log, volume: part-vrx-log, fstype: ext4, label: vrx-log, preserve: false}
    - {type: partition, id: part-vrx-pg, device: disk0, number: 6, size: 20G, partition_name: vrx-pg, preserve: false}
    - {type: format, id: fmt-vrx-pg, volume: part-vrx-pg, fstype: ext4, label: vrx-pg, preserve: false}
    - {type: partition, id: part-vrx-data, device: disk0, number: 7, size: -1, partition_name: vrx-data, preserve: false}
    - {type: format, id: fmt-vrx-data, volume: part-vrx-data, fstype: ext4, label: vrx-data, preserve: false}
    - {type: mount, id: mnt-vrx-roota, device: fmt-vrx-roota, path: /}
    - {type: mount, id: mnt-vrx-data, device: fmt-vrx-data, path: /data}
    - {type: mount, id: mnt-vrx-log, device: fmt-vrx-log, path: /var/log}
    - {type: mount, id: mnt-vrx-efi, device: fmt-vrx-efi, path: /boot/efi}
    - {type: mount, id: mnt-vrx-pg, device: fmt-vrx-pg, path: /var/lib/postgresql}
